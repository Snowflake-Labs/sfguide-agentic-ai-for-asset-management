# =============================================================================
# Demo Companies — Single Source of Truth for Company Data
# =============================================================================
# All data generation (DIM_ISSUER, DIM_SECURITY, transcripts, market data,
# documents) flows from this list.
#
# Loaded as: config.REF_DATA['companies']
# Access:    config.DEMO_COMPANIES (dict keyed by ticker)
#
# Structure per entry:
#   ticker:              Stock ticker symbol (also used as dict key)
#   company_name:        Official company name from Cybersyn COMPANY_INDEX
#   provider_company_id: COMPANY_ID from Cybersyn COMPANY_INDEX
#   cik:                 SEC Central Index Key for SEC filings and transcripts
#   sector:              GICS sector (mapped from SIC codes)
#   tier:                core | major | additional | supply_chain | expanded
#   demo_order:          (optional) Display priority for core/major companies
#   position_size:       (optional) large | medium | small — portfolio weighting hint
#
# Tiers:
#   core (13)           — Featured in demo scenarios, always shown first
#   major (34)          — Well-known companies, frequently referenced
#   additional (30)     — Sector diversity fill
#   supply_chain (2)    — Risk scenario dependencies (Ford, GM)
#   expanded (424)      — S&P 500 benchmark coverage
#
# Total: ~503 companies
#
# To regenerate: python scripts/generate_expanded_companies.py

# Coverage universe config — which tiers get AI processing (speaker mapping, NLP, earnings insights)
# Change this to control what's in DIM_COVERAGE_UNIVERSE without editing Python code
