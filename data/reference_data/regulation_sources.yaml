# Regulation Sources — Registry of real regulatory documents for AM demo
# =============================================================================
# Each entry maps a downloaded PDF to its metadata for enriching the
# PDF_REGULATORY_CORPUS table and SAM_REGULATORY_DOCS Cortex Search service.
#
# Fields:
#   id:               Short unique identifier (used as REGULATION_ID column)
#   title:            Full regulation title (used as DOCUMENT_TITLE)
#   file:             PDF filename in data/source_pdfs/am_regulatory/
#   source_url:       Original download URL for attribution
#   regulatory_body:  Issuing authority
#   reference:        Official regulation reference number
#   jurisdiction:     EU, UK, or US
#   effective_date:   Date the regulation became effective
#   am_relevance:     Brief description of relevance to asset management

regulations:
