name: SAM_PE_VALUE_CREATION_VIEW
description: "PE value creation semantic view for portfolio company monitoring, 100-day plan tracking, board pack analysis, and operational KPIs. Query company performance, initiative progress, and financial metrics."
tables:
  - name: companies
    synonyms:
      - portfolio_companies
      - investments
      - portcos
    description: PE-owned portfolio companies with acquisition details and fund information
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: DIM_PORTFOLIO_COMPANY
    primary_key:
      columns:
        - comp_pk_portfoliocompanyid
    dimensions:
      - name: comp_pk_portfoliocompanyid
        description: "PORTFOLIOCOMPANYID for companies"
        expr: PORTFOLIOCOMPANYID
        data_type: "NUMBER(38,0)"
      - name: company_name
        synonyms:
          - company
          - portfolio_company
          - portco
          - name
        description: "Name of the PE portfolio company owned by an APX fund, one of 6 exact names (see values). Filter with = on the exact name, never LIKE or ILIKE; map the user's wording to one of the values first. If the user names a company that is not listed, it is not in the PE portfolio - say so."
        expr: COMPANYNAME
        data_type: VARCHAR(255)
        is_enum: true
        sample_values:
          - ConsumerBrands Nordic
          - GreenEnergy Systems
          - LogiFlow DACH
          - MedDevice Pro
          - NordicTech Solutions
          - TelecomInfra AG
      - name: company_status
        synonyms:
          - status
          - investment_status
        description: "Investment status: Active or Exited"
        expr: STATUS
        data_type: VARCHAR(20)
        is_enum: true
        sample_values:
          - "Active"
          - "Exited"
      - name: deal_lead
        synonyms:
          - partner
          - responsible
        description: Deal team lead
        expr: DEALTEAMLEAD
        data_type: VARCHAR(100)
      - name: fund
        synonyms:
          - vehicle
          - investment_fund
        description: "APX fund that owns the company, one of 4 exact fund names (see values). Filter with = on the exact name, never LIKE or ILIKE: APX IX, APX VIII and the two APX Infrastructure funds are different funds."
        expr: FUNDNAME
        data_type: VARCHAR(100)
        is_enum: true
        sample_values:
          - APX IX
          - APX VIII
          - APX Infrastructure V
          - APX Infrastructure IV
      - name: geography
        synonyms:
          - region
          - market
          - location
        description: Geographic region
        expr: GEOGRAPHY
        data_type: VARCHAR(50)
      - name: sector
        synonyms:
          - industry
          - vertical
        description: Company sector
        expr: SECTOR
        data_type: VARCHAR(100)
      - name: subsector
        synonyms:
          - sub_sector
          - niche
        description: Company sub-sector
        expr: SUBSECTOR
        data_type: VARCHAR(100)
      - name: thesis_category
        synonyms:
          - thesis
          - investment_theme
          - category
        description: Investment thesis category
        expr: THESISCATEGORY
        data_type: VARCHAR(50)
    time_dimensions:
      - name: acquisition_date
        synonyms:
          - entry_date
          - investment_date
          - deal_date
        description: "Date the APX fund acquired the company. Use for holding period and vintage questions."
        expr: ACQUISITIONDATE
        data_type: DATE
      - name: exit_date
        synonyms:
          - realisation_date
          - sale_date
        description: "Date the company was exited. NULL for Active companies; only populated when company_status = 'Exited'."
        expr: EXITDATE
        data_type: DATE
    metrics:
      - name: total_exit_value
        synonyms:
          - exit_proceeds
          - exit_price
          - realised_value
        description: "Exit value in millions EUR. Only populated for Exited companies; NULL for Active companies."
        expr: SUM(EXITVALUE_MM)
        access_modifier: public_access
      - name: total_acquisition_value
        synonyms:
          - acquisition_price
          - entry_price
          - invested_capital
        description: Acquisition price in millions EUR
        expr: SUM(ACQUISITIONPRICE_MM)
        access_modifier: public_access
      - name: company_count
        synonyms:
          - portfolio_count
          - number_of_companies
        description: Number of portfolio companies
        expr: COUNT(DISTINCT PORTFOLIOCOMPANYID)
        access_modifier: public_access
      - name: average_entry_multiple
        synonyms:
          - entry_ev_ebitda
          - entry_multiple
          - purchase_multiple
        description: Entry EV/EBITDA multiple
        expr: AVG(ENTRYEV_EBITDA)
        access_modifier: public_access
      - name: average_irr
        synonyms:
          - irr
          - internal_rate_of_return
          - return
        description: Internal Rate of Return (for exited companies)
        expr: AVG(IRR_PCT)
        access_modifier: public_access
      - name: average_moic
        synonyms:
          - multiple
          - money_multiple
          - return_multiple
        description: Multiple on Invested Capital (for exited companies)
        expr: AVG(MOIC)
        access_modifier: public_access
      - name: average_ownership
        synonyms:
          - ownership_percentage
          - stake
          - equity_stake
        description: Ownership percentage
        expr: AVG(OWNERSHIPPCT)
        access_modifier: public_access
  - name: initiatives
    synonyms:
      - value_creation
      - 100_day_plan
      - projects
      - workstreams
    description: Value creation initiatives and 100-day plan tracking
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: FACT_VALUE_CREATION_PLAN
    primary_key:
      columns:
        - init_pk_planid
    dimensions:
      - name: init_pk_portfoliocompanyid
        description: "PORTFOLIOCOMPANYID for initiatives"
        expr: "PORTFOLIOCOMPANYID"
        data_type: "NUMBER(38,0)"
      - name: init_pk_planid
        description: "PLANID for initiatives"
        expr: PLANID
        data_type: "NUMBER(38,0)"
      - name: initiative_category
        synonyms:
          - category
          - type
          - workstream_type
        description: "Initiative category: Revenue Growth, Cost Optimization, Digital, ESG, Working Capital"
        expr: INITIATIVECATEGORY
        data_type: VARCHAR(100)
        is_enum: true
        sample_values:
          - "Revenue Growth"
          - "Cost Optimization"
          - "Digital"
          - "ESG"
          - "Working Capital"
      - name: initiative_name
        synonyms:
          - initiative
          - project
          - workstream
        description: Value creation initiative name
        expr: INITIATIVENAME
        data_type: VARCHAR(255)
      - name: initiative_status
        synonyms:
          - progress
        description: "Initiative status: On Track, At Risk or Behind"
        expr: STATUS
        data_type: VARCHAR(50)
        is_enum: true
        sample_values:
          - "On Track"
          - "At Risk"
          - "Behind"
      - name: target_metric
        synonyms:
          - metric
          - kpi
          - measure
        description: Target metric being tracked
        expr: TARGETMETRIC
        data_type: VARCHAR(100)
    metrics:
      - name: at_risk_count
        synonyms:
          - at_risk
          - flagged
          - issues
        description: Number of at-risk initiatives
        expr: COUNT_IF(STATUS = 'At Risk')
        access_modifier: public_access
      - name: average_baseline_value
        synonyms:
          - baseline
          - starting_point
        description: Baseline value at initiative start
        expr: AVG(BASELINEVALUE)
        access_modifier: public_access
      - name: behind_count
        synonyms:
          - behind
          - delayed
          - off_track
        description: Number of behind-schedule initiatives
        expr: COUNT_IF(STATUS = 'Behind')
        access_modifier: public_access
      - name: average_current_value
        synonyms:
          - current
          - actual
          - progress
        description: Current value achieved
        expr: AVG(CURRENTVALUE)
        access_modifier: public_access
      - name: total_ebitda_impact
        synonyms:
          - ebitda_impact
          - value_impact
          - contribution
        description: Expected EBITDA impact in millions EUR
        expr: SUM(IMPACTEBITDA_MM)
        access_modifier: public_access
      - name: initiative_count
        synonyms:
          - project_count
        description: Number of initiatives
        expr: COUNT(PLANID)
        access_modifier: public_access
      - name: average_target_value
        synonyms:
          - target
          - goal
        description: Target value to achieve
        expr: AVG(TARGETVALUE)
        access_modifier: public_access
  - name: kpis
    synonyms:
      - operational_kpis
      - company_kpis
      - performance_indicators
    description: Operational KPIs for portfolio company monitoring
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: FACT_PORTFOLIO_COMPANY_KPI
    primary_key:
      columns:
        - kpis_pk_kpiid
    dimensions:
      - name: kpis_pk_portfoliocompanyid
        description: "PORTFOLIOCOMPANYID for kpis"
        expr: "PORTFOLIOCOMPANYID"
        data_type: "NUMBER(38,0)"
      - name: kpis_pk_kpiid
        description: "KPIID for kpis"
        expr: KPIID
        data_type: "NUMBER(38,0)"
      - name: kpi_category
        synonyms:
          - kpi_type
        description: "KPI category: Financial, Operational, ESG, Customer"
        expr: KPICATEGORY
        data_type: VARCHAR(50)
      - name: kpi_name
        synonyms:
          - indicator
        description: Operational KPI name
        expr: KPINAME
        data_type: VARCHAR(100)
      - name: kpi_status
        synonyms:
          - rag_status
          - traffic_light
        description: "KPI RAG status: Green, Amber, Red"
        expr: STATUS
        data_type: VARCHAR(20)
        is_enum: true
        sample_values:
          - "Green"
          - "Amber"
          - "Red"
      - name: kpi_unit
        synonyms:
          - unit
          - unit_of_measure
        description: "Unit of the KPI value (e.g. %, Score, tCO2/€M). Lower is better for Carbon Intensity and Employee Turnover; higher is better for Customer Satisfaction, Employee NPS and On-Time Delivery."
        expr: UNIT
        data_type: VARCHAR(20)
    time_dimensions:
      - name: kpi_date
        synonyms:
          - kpi_period
          - period
          - reporting_date
          - as_of_date
        description: "Reporting period date of the KPI observation (quarterly). KPIs have one row per company, KPI and period, so status questions ('which KPIs are Red') must filter to the latest kpi_date, otherwise historical Red readings are mixed in. For trends, group by kpi_date."
        expr: KPIDATE
        data_type: DATE
    metrics:
      - name: average_actual_kpi
        synonyms:
          - actual
          - kpi_actual
        description: Actual KPI value
        expr: AVG(ACTUALVALUE)
        access_modifier: public_access
      - name: average_budget_kpi
        synonyms:
          - budget
          - kpi_budget
          - target
        description: Budget KPI value
        expr: AVG(BUDGETVALUE)
        access_modifier: public_access
      - name: average_prior_year_kpi
        synonyms:
          - prior_year
          - last_year
          - yoy
        description: Prior year KPI value
        expr: AVG(PRIORYEARVALUE)
        access_modifier: public_access
  - name: metrics
    synonyms:
      - board_pack
      - monthly_metrics
      - financials
      - performance
    description: Monthly board pack financial and operational metrics
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: FACT_BOARD_PACK_METRICS
    primary_key:
      columns:
        - metr_pk_metricid
    dimensions:
      - name: metr_pk_portfoliocompanyid
        description: "PORTFOLIOCOMPANYID for metrics"
        expr: "PORTFOLIOCOMPANYID"
        data_type: "NUMBER(38,0)"
      - name: metr_pk_metricid
        description: "METRICID for metrics"
        expr: METRICID
        data_type: "NUMBER(38,0)"
    metrics:
      - name: average_budget_variance
        synonyms:
          - variance
          - budget_variance
          - vs_budget
        description: Budget variance percentage
        expr: AVG(BUDGETVARIANCEPCT)
        access_modifier: public_access
      - name: total_cash_position
        synonyms:
          - cash
          - liquidity
          - cash_balance
        description: Cash position in millions EUR
        expr: SUM(CASHPOSITION_MM)
        access_modifier: public_access
      - name: total_customer_count
        synonyms:
          - customers
          - customer_base
        description: Number of customers
        expr: SUM(CUSTOMERCOUNT)
        access_modifier: public_access
      - name: total_ebitda
        synonyms:
          - ebitda
          - earnings
          - profitability
        description: Monthly EBITDA in millions EUR
        expr: SUM(EBITDA_MM)
        access_modifier: public_access
      - name: average_ebitda_margin
        synonyms:
          - margin
          - ebitda_margin
          - profitability_margin
        description: EBITDA margin percentage
        expr: AVG(EBITDAMARGINPCT)
        access_modifier: public_access
      - name: total_headcount
        synonyms:
          - employees
          - fte
          - staff
        description: Total headcount
        expr: SUM(HEADCOUNT)
        access_modifier: public_access
      - name: average_leverage
        synonyms:
          - leverage_ratio
          - debt_to_ebitda
        description: Net Debt / EBITDA leverage ratio
        expr: AVG(LEVERAGERATIO)
        access_modifier: public_access
      - name: total_net_debt
        synonyms:
          - debt
          - net_debt
          - leverage_amount
        description: Net debt in millions EUR
        expr: SUM(NETDEBT_MM)
        access_modifier: public_access
      - name: average_nrr
        synonyms:
          - net_revenue_retention
          - retention
        description: Net Revenue Retention percentage
        expr: AVG(NRR_PCT)
        access_modifier: public_access
      - name: total_revenue
        synonyms:
          - revenue
          - sales
          - turnover
        description: Monthly revenue in millions EUR
        expr: SUM(REVENUE_MM)
        access_modifier: public_access
    time_dimensions:
      - name: report_month
        synonyms:
          - month
          - period
          - report_date
        description: Board pack report month
        expr: REPORTMONTH
        data_type: DATE
relationships:
  - name: initiatives_to_companies
    left_table: initiatives
    right_table: companies
    relationship_columns:
      - left_column: init_pk_portfoliocompanyid
        right_column: comp_pk_portfoliocompanyid
  - name: kpis_to_companies
    left_table: kpis
    right_table: companies
    relationship_columns:
      - left_column: kpis_pk_portfoliocompanyid
        right_column: comp_pk_portfoliocompanyid
  - name: metrics_to_companies
    left_table: metrics
    right_table: companies
    relationship_columns:
      - left_column: metr_pk_portfoliocompanyid
        right_column: comp_pk_portfoliocompanyid
verified_queries:
  - name: KPIS_VS_BUDGET_WITH_FLAGS
    sql: "SELECT c.company_name, k.kpi_name, k.kpi_category, k.kpi_status, AVG(k.actualvalue) AS actual, AVG(k.budgetvalue) AS budget, AVG(k.prioryearvalue) AS prior_year FROM companies AS c LEFT JOIN kpis AS k ON c.comp_pk_portfoliocompanyid = k.kpis_pk_portfoliocompanyid WHERE c.fund = 'APX Infrastructure V' GROUP BY c.company_name, k.kpi_name, k.kpi_category, k.kpi_status ORDER BY CASE WHEN k.kpi_status = 'Red' THEN 1 WHEN k.kpi_status = 'Amber' THEN 2 ELSE 3 END, k.kpi_name"
    question: "For each portfolio company in APX Infrastructure V, how are the KPIs performing against budget and prior year, and which ones are flagged as red or amber?"
    use_as_onboarding_question: true
  - name: AT_RISK_INITIATIVES
    sql: "SELECT c.company_name, c.sector, c.geography, c.thesis_category, COUNT(DISTINCT i.init_pk_planid) AS total_initiatives, COUNT_IF(i.initiative_status = 'At Risk') AS at_risk, COUNT_IF(i.initiative_status = 'Behind') AS behind, COUNT_IF(i.initiative_status = 'On Track') AS on_track, SUM(i.impactebitda_mm) AS total_ebitda_impact_mm FROM companies AS c LEFT JOIN initiatives AS i ON c.comp_pk_portfoliocompanyid = i.init_pk_portfoliocompanyid WHERE c.company_status = 'Active' AND c.fund = 'APX IX' GROUP BY c.company_name, c.sector, c.geography, c.thesis_category ORDER BY at_risk DESC, behind DESC NULLS LAST"
    question: "For active portfolio companies in Fund APX IX, which ones have the most at-risk or behind initiatives, and what is the total EBITDA impact of their value creation plans?"
    use_as_onboarding_question: true
  - name: FUND_COMPANY_RETURNS
    sql: "SELECT c.company_name AS company, c.company_status AS status, c.sector, c.subsector, c.geography, c.deal_lead, c.thesis_category AS thesis, AVG(c.irr_pct) AS irr_pct, AVG(c.moic) AS moic, AVG(c.ownershippct) AS ownership_pct, SUM(c.acquisitionprice_mm) AS acquisition_price_mm, AVG(c.entryev_ebitda) AS entry_ev_ebitda FROM companies AS c WHERE c.fund = 'APX Infrastructure IV' GROUP BY 1, 2, 3, 4, 5, 6, 7"
    question: "What are the key performance metrics — including IRR, MOIC, ownership, acquisition price, and entry EV/EBITDA — for each portfolio company in the APX Infrastructure IV fund, broken down by sector, geography, deal lead, and investment thesis?"
    use_as_onboarding_question: false
  - name: RED_STATUS_KPIS
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_PE_VALUE_CREATION_VIEW DIMENSIONS companies.company_name, kpis.kpi_name, kpis.kpi_category, kpis.kpi_status METRICS kpis.average_actual_kpi, kpis.average_budget_kpi WHERE kpis.kpi_status = 'Red') ORDER BY company_name, kpi_name"
    question: "Show me all Red status KPIs across the portfolio."
    use_as_onboarding_question: true
  - name: RED_KPIS_LATEST_PERIOD
    sql: "WITH latest AS (SELECT MAX(kpis.kpi_date) AS max_date FROM kpis) SELECT c.company_name, k.kpi_name, k.kpi_category, k.kpi_unit, k.kpi_date, AVG(k.average_actual_kpi) AS actual, AVG(k.average_budget_kpi) AS budget FROM kpis AS k JOIN companies AS c ON k.kpis_pk_portfoliocompanyid = c.comp_pk_portfoliocompanyid WHERE k.kpi_status = 'Red' AND k.kpi_date = (SELECT max_date FROM latest) GROUP BY c.company_name, k.kpi_name, k.kpi_category, k.kpi_unit, k.kpi_date ORDER BY c.company_name, k.kpi_name"
    question: "Which KPIs are currently Red across the PE portfolio?"
    use_as_onboarding_question: false
  - name: KPI_TREND_BY_COMPANY
    sql: "WITH periods AS (SELECT DISTINCT kpis.kpi_date FROM kpis ORDER BY kpis.kpi_date DESC LIMIT 4) SELECT c.company_name, k.kpi_date, k.kpi_status, AVG(k.average_actual_kpi) AS actual, AVG(k.average_budget_kpi) AS budget FROM kpis AS k JOIN companies AS c ON k.kpis_pk_portfoliocompanyid = c.comp_pk_portfoliocompanyid WHERE k.kpi_name = 'Customer Satisfaction' AND k.kpi_date IN (SELECT kpi_date FROM periods) GROUP BY c.company_name, k.kpi_date, k.kpi_status ORDER BY c.company_name, k.kpi_date"
    question: "Show the Customer Satisfaction trend over the last 4 quarters for each portfolio company."
    use_as_onboarding_question: false
  - name: KPI_DETERIORATION_RANKING
    sql: "WITH bounds AS (SELECT MIN(kpis.kpi_date) AS first_date, MAX(kpis.kpi_date) AS last_date FROM kpis), endpoints AS (SELECT c.company_name, k.kpi_name, k.kpi_unit, AVG(CASE WHEN k.kpi_date = b.first_date THEN k.average_actual_kpi END) AS earliest_value, AVG(CASE WHEN k.kpi_date = b.last_date THEN k.average_actual_kpi END) AS latest_value FROM kpis AS k JOIN companies AS c ON k.kpis_pk_portfoliocompanyid = c.comp_pk_portfoliocompanyid CROSS JOIN bounds AS b WHERE k.kpi_date IN (b.first_date, b.last_date) GROUP BY c.company_name, k.kpi_name, k.kpi_unit) SELECT company_name, kpi_name, kpi_unit, earliest_value, latest_value, latest_value - earliest_value AS change, CASE WHEN kpi_name IN ('Carbon Intensity', 'Employee Turnover') THEN latest_value - earliest_value ELSE earliest_value - latest_value END AS deterioration FROM endpoints WHERE earliest_value IS NOT NULL AND latest_value IS NOT NULL ORDER BY deterioration DESC"
    question: "Which company KPIs have deteriorated the most from the earliest to the latest period? Remember that for Carbon Intensity and Employee Turnover a rise is a deterioration."
    use_as_onboarding_question: false
