name: SAM_EXECUTIVE_VIEW
description: "Executive semantic view for firm-wide KPIs, client analytics, strategy performance, and flow analysis. Use for C-suite performance reviews and board reporting. FIRM_AUM is the authoritative AUM from holdings; TOTAL_CLIENT_AUM is client-reported."
tables:
  - name: clients
    synonyms:
      - investors
      - accounts
      - institutional_clients
    description: "Institutional client dimension with client types, regions, and AUM"
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: DIM_CLIENT
    primary_key:
      columns:
        - clie_pk_clientid
    dimensions:
      - name: clie_pk_clientid
        description: "CLIENTID for clients"
        expr: CLIENTID
        data_type: "NUMBER(38,0)"
      - name: client_name
        synonyms:
          - investor_name
          - account_name
        description: Institutional client name
        expr: ClientName
        data_type: VARCHAR(16777216)
      - name: client_type
        synonyms:
          - investor_type
          - account_type
        description: "Client type: Pension, Endowment, Foundation, Insurance, Corporate, Family Office"
        expr: ClientType
        data_type: VARCHAR(16777216)
        is_enum: true
        sample_values:
          - "PENSION"
          - "ENDOWMENT"
          - "SOVEREIGN"
          - "INSURANCE"
          - "CORPORATE"
          - "FAMILY_OFFICE"
      - name: primary_contact
        synonyms:
          - contact
          - relationship_manager
          - rm
        description: Primary relationship manager contact
        expr: PrimaryContact
        data_type: VARCHAR(16777216)
      - name: region
        synonyms:
          - client_region
          - geography
          - location
        description: Client geographic region
        expr: Region
        data_type: VARCHAR(16777216)
    facts:
      - name: aum_with_sam
        description: "Client AUM managed by SAM"
        expr: AUM_with_SAM
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: average_aum_with_sam
        synonyms:
          - average_client_size
          - avg_client_aum
          - typical_client_size
        description: Average client AUM
        expr: AVG(aum_with_sam)
        access_modifier: public_access
      - name: client_count
        synonyms:
          - number_of_clients
          - client_count
          - investor_count
        description: Count of institutional clients
        expr: COUNT(DISTINCT ClientID)
        access_modifier: public_access
      - name: total_aum_with_sam
        synonyms:
          - client_aum
          - total_client_assets
          - reported_aum
        description: "Total AUM from client reports. Note: Use FIRM_AUM for authoritative holdings-based AUM."
        expr: SUM(aum_with_sam)
        access_modifier: public_access
  - name: client_flows
    synonyms:
      - flows
      - subscriptions
      - redemptions
    description: "Client-level flow transactions including subscriptions, redemptions, and transfers"
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: FACT_CLIENT_FLOWS
    primary_key:
      columns:
        - clie_pk_flowid
    dimensions:
      - name: clie_pk_portfolioid
        description: "PORTFOLIOID for client_flows"
        expr: "PORTFOLIOID"
        data_type: "NUMBER(38,0)"
      - name: clie_pk_clientid
        description: "CLIENTID for client_flows"
        expr: "CLIENTID"
        data_type: "NUMBER(38,0)"
      - name: clie_pk_flowid
        description: "FLOWID for client_flows"
        expr: FLOWID
        data_type: "NUMBER(38,0)"
      - name: flow_type
        synonyms:
          - transaction_type
        description: "Flow type: Subscription, Redemption, Transfer"
        expr: FlowType
        data_type: VARCHAR(12)
        is_enum: true
        sample_values:
          - "SUBSCRIPTION"
          - "REDEMPTION"
          - "DISTRIBUTION"
          - "TRANSFER"
    facts:
      - name: flow_amount
        description: "Client flow amount (positive=inflow, negative=outflow)"
        expr: FlowAmount
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: flow_transaction_count
        synonyms:
          - flow_count
          - transaction_count
          - number_of_flows
        description: Number of flow transactions
        expr: COUNT(FlowID)
        access_modifier: public_access
      - name: gross_inflows
        synonyms:
          - inflows
          - subscriptions
          - gross_inflows
        description: Gross subscription inflows
        expr: SUM(CASE WHEN FlowAmount > 0 THEN FlowAmount ELSE 0 END)
        access_modifier: public_access
      - name: gross_outflows
        synonyms:
          - outflows
          - redemptions
          - gross_outflows
        description: Gross redemption outflows
        expr: SUM(CASE WHEN FlowAmount < 0 THEN ABS(FlowAmount) ELSE 0 END)
        access_modifier: public_access
      - name: max_single_client_flow
        synonyms:
          - largest_flow
          - max_flow
          - biggest_transaction
        description: Largest single client flow
        expr: MAX(ABS(FlowAmount))
        access_modifier: public_access
      - name: total_flow_amount
        synonyms:
          - net_flows
          - total_flows
          - position
          - position_value
          - invested_amount
          - cumulative_position
          - allocation
          - client_allocation
        description: "Net flow amount representing cumulative client position (positive = inflow/position, negative = outflow)"
        expr: SUM(flow_amount)
        access_modifier: public_access
    time_dimensions:
      - name: client_flow_date
        synonyms:
          - flow_date
          - transaction_date
        description: Date of client flow transaction
        expr: FlowDate
        data_type: DATE
      - name: flow_month
        synonyms:
          - monthly
          - flow_month
        description: Monthly aggregation for flow trend analysis
        expr: "DATE_TRUNC('MONTH', FlowDate)"
        data_type: DATE
  - name: fund_flows
    synonyms:
      - strategy_flows
      - portfolio_flows
      - aggregated_flows
    description: Aggregated fund-level flows by portfolio and strategy for executive KPIs
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: FACT_FUND_FLOWS
    primary_key:
      columns:
        - fund_pk_fundflowid
    dimensions:
      - name: fund_pk_portfolioid
        description: "PORTFOLIOID for fund_flows"
        expr: "PORTFOLIOID"
        data_type: "NUMBER(38,0)"
      - name: fund_pk_fundflowid
        description: "FUNDFLOWID for fund_flows"
        expr: FUNDFLOWID
        data_type: "NUMBER(38,0)"
    facts:
      - name: client_count
        expr: ClientCount
        data_type: "NUMBER(18,0)"
        access_modifier: public_access
      - name: gross_inflows
        expr: GrossInflows
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: gross_outflows
        expr: GrossOutflows
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: net_flows
        description: "Net client flows (inflows minus outflows)"
        expr: NetFlows
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: total_client_count
        synonyms:
          - active_clients
          - contributing_clients
        description: Number of clients with flows
        expr: SUM(client_count)
        access_modifier: public_access
      - name: total_gross_inflows
        synonyms:
          - fund_inflows
          - strategy_inflows
        description: Gross inflows at fund level
        expr: SUM(gross_inflows)
        access_modifier: public_access
      - name: total_gross_outflows
        synonyms:
          - fund_outflows
          - strategy_outflows
        description: Gross outflows at fund level
        expr: SUM(gross_outflows)
        access_modifier: public_access
      - name: total_net_flows
        synonyms:
          - net_fund_flows
          - strategy_net_flows
          - portfolio_net_flows
        description: Net flows at fund/strategy level
        expr: SUM(net_flows)
        access_modifier: public_access
    time_dimensions:
      - name: fund_flow_date
        synonyms:
          - aggregated_date
        description: Date of aggregated fund flows
        expr: FlowDate
        data_type: DATE
      - name: fund_flow_month
        synonyms:
          - fund_month
          - monthly
        description: Monthly aggregation for fund flow trends
        expr: "DATE_TRUNC('MONTH', FlowDate)"
        data_type: DATE
  - name: portfolios
    synonyms:
      - funds
      - strategies
      - mandates
    description: Investment portfolios and fund information
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: DIM_PORTFOLIO
    primary_key:
      columns:
        - port_pk_portfolioid
    dimensions:
      - name: port_pk_portfolioid
        description: "PORTFOLIOID for portfolios"
        expr: PORTFOLIOID
        data_type: "NUMBER(38,0)"
      - name: portfolio_name
        synonyms:
          - fund_name
          - strategy_name
        description: "Portfolio or fund name. All portfolio names start with \"SAM \" prefix, e.g. \"SAM Technology & Infrastructure\", \"SAM ESG Leaders Global Equity\", \"SAM Global Flagship Multi-Asset\"."
        expr: PortfolioName
        data_type: VARCHAR(134217728)
        is_enum: true
        sample_values:
          - SAM Technology & Infrastructure
          - SAM ESG Leaders Global Equity
          - SAM Global Flagship Multi-Asset
          - SAM US Core Equity
          - SAM Renewable & Climate Solutions
          - SAM Sustainable Global Equity
          - SAM AI & Digital Innovation
          - SAM Global Balanced 60/40
          - SAM Tech Disruptors Equity
          - SAM US Value Equity
          - SAM Multi-Asset Income
      - name: strategy
        synonyms:
          - investment_strategy
          - portfolio_strategy
          - strategy_type
        description: "Investment strategy: Value, Growth, ESG, Core, Multi-Asset, Income"
        expr: Strategy
        data_type: VARCHAR(134217728)
        is_enum: true
        sample_values:
          - "Core"
          - "ESG"
          - "Growth"
          - "Income"
          - "Multi-Asset"
          - "Value"
  - name: strategy_perf
    synonyms:
      - strategy_performance
      - performance
      - returns
      - strategy_returns
    description: "Strategy-level performance metrics including AUM, MTD/QTD/YTD returns calculated from portfolio holdings"
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: FACT_STRATEGY_PERFORMANCE
    primary_key:
      columns:
        - stra_pk_strategyperfid
    dimensions:
      - name: stra_pk_portfolioid
        description: "PORTFOLIOID for strategy_perf"
        expr: "PORTFOLIOID"
        data_type: "NUMBER(38,0)"
      - name: stra_pk_strategyperfid
        description: "STRATEGYPERFID for strategy_perf"
        expr: STRATEGYPERFID
        data_type: "NUMBER(38,0)"
    facts:
      - name: holding_count
        description: "Number of holdings in the portfolio"
        expr: Holding_Count
        data_type: "NUMBER(18,0)"
        access_modifier: public_access
      - name: strategy_aum
        description: "Strategy-level assets under management"
        expr: Strategy_AUM
        data_type: FLOAT
        access_modifier: public_access
      - name: strategy_mtd_return
        description: "Strategy month-to-date return"
        expr: Strategy_MTD_Return
        data_type: FLOAT
        access_modifier: public_access
      - name: strategy_qtd_return
        description: "Strategy quarter-to-date return"
        expr: Strategy_QTD_Return
        data_type: FLOAT
        access_modifier: public_access
      - name: strategy_ytd_return
        description: "Strategy year-to-date return"
        expr: Strategy_YTD_Return
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_strategy_mtd_return
        synonyms:
          - mtd_return
          - monthly_return
          - month_to_date_return
          - mtd_performance
        description: Strategy month-to-date return percentage (weighted average from holdings)
        expr: AVG(strategy_mtd_return)
        access_modifier: public_access
      - name: average_strategy_qtd_return
        synonyms:
          - qtd_return
          - quarterly_return
          - quarter_to_date_return
          - qtd_performance
        description: Strategy quarter-to-date return percentage (weighted average from holdings)
        expr: AVG(strategy_qtd_return)
        access_modifier: public_access
      - name: average_strategy_ytd_return
        synonyms:
          - ytd_return
          - annual_return
          - year_to_date_return
          - ytd_performance
        description: Strategy year-to-date return percentage (weighted average from holdings)
        expr: AVG(strategy_ytd_return)
        access_modifier: public_access
      - name: total_holding_count
        synonyms:
          - holdings
          - position_count
          - number_of_holdings
        description: Total holdings count by strategy
        expr: SUM(holding_count)
        access_modifier: public_access
      - name: total_strategy_aum
        synonyms:
          - portfolio_aum
          - fund_aum
          - strategy_assets
          - firm_aum
          - total_aum
          - assets_under_management
          - firm_assets
          - aum
        description: "AUM by strategy/portfolio calculated from holdings. When not grouped by strategy, gives total firm AUM."
        expr: SUM(strategy_aum)
        access_modifier: public_access
    time_dimensions:
      - name: performance_date
        synonyms:
          - valuation_date
          - as_of_date
        description: Date of strategy performance valuation
        expr: HoldingDate
        data_type: DATE
      - name: perf_month
        synonyms:
          - perf_month
          - monthly
        description: Monthly aggregation for performance trends
        expr: "DATE_TRUNC('MONTH', HoldingDate)"
        data_type: DATE
  - name: portfolio_managers
    synonyms:
      - pms
      - fund_managers
      - investment_managers
    description: "Portfolio managers who lead investment strategies"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: DIM_PORTFOLIO_MANAGER
    primary_key:
      columns:
        - pm_pk_id
    dimensions:
      - name: pm_pk_id
        description: "Portfolio manager ID"
        expr: PM_ID
        data_type: "NUMBER"
      - name: pm_name
        synonyms:
          - portfolio_manager_name
          - fund_manager_name
          - manager_name
        description: "Name of the portfolio manager"
        expr: PM_NAME
        data_type: VARCHAR
        is_enum: true
        sample_values:
          - "David Chen"
          - "Sarah Mitchell"
          - "James Rodriguez"
          - "Emily Nakamura"
          - "Marcus Thompson"
          - "Olivia Park"
      - name: pm_title
        description: "Job title of the portfolio manager"
        expr: TITLE
        data_type: VARCHAR
      - name: pm_team
        synonyms:
          - investment_team
          - team
        description: "Investment team the PM belongs to"
        expr: TEAM
        data_type: VARCHAR
        is_enum: true
        sample_values:
          - "Growth Equities"
          - "Sustainable Strategies"
          - "Multi-Asset Solutions"
          - "Fundamental Value"
      - name: pm_hire_date
        description: "Date the PM was hired"
        expr: HIRE_DATE
        data_type: DATE
    measures:
      - name: pm_count
        description: "Number of portfolio managers"
        expr: COUNT(DISTINCT PM_ID)
        data_type: NUMBER
      - name: pm_aum_capacity
        description: "Maximum AUM capacity the PM can manage"
        expr: AUM_CAPACITY
        data_type: NUMBER
  - name: pm_assignments
    synonyms:
      - portfolio_assignments
      - pm_portfolio_link
    description: "Links portfolio managers to the portfolios they manage"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_PORTFOLIO_PM_ASSIGNMENT
    primary_key:
      columns:
        - assign_pk_portfolioid
        - assign_pk_pm_id
    dimensions:
      - name: assign_pk_portfolioid
        description: "Portfolio ID in the assignment"
        expr: PORTFOLIOID
        data_type: "NUMBER"
      - name: assign_pk_pm_id
        description: "PM ID in the assignment"
        expr: PM_ID
        data_type: "NUMBER"
      - name: pm_role
        synonyms:
          - assignment_role
        description: "Role of the PM for this portfolio (Lead, Deputy, Analyst)"
        expr: ROLE
        data_type: VARCHAR
        is_enum: true
        sample_values:
          - "Lead"
          - "Deputy"
          - "Analyst"
relationships:
  - name: client_flows_to_clients
    left_table: client_flows
    right_table: clients
    relationship_columns:
      - left_column: clie_pk_clientid
        right_column: clie_pk_clientid
  - name: client_flows_to_portfolios
    left_table: client_flows
    right_table: portfolios
    relationship_columns:
      - left_column: clie_pk_portfolioid
        right_column: port_pk_portfolioid
  - name: fund_flows_to_portfolios
    left_table: fund_flows
    right_table: portfolios
    relationship_columns:
      - left_column: fund_pk_portfolioid
        right_column: port_pk_portfolioid
  - name: strategy_perf_to_portfolios
    left_table: strategy_perf
    right_table: portfolios
    relationship_columns:
      - left_column: stra_pk_portfolioid
        right_column: port_pk_portfolioid
  - name: pm_assignments_to_portfolios
    left_table: pm_assignments
    right_table: portfolios
    relationship_columns:
      - left_column: assign_pk_portfolioid
        right_column: port_pk_portfolioid
  - name: pm_assignments_to_managers
    left_table: pm_assignments
    right_table: portfolio_managers
    relationship_columns:
      - left_column: assign_pk_pm_id
        right_column: pm_pk_id
module_custom_instructions:
  sql_generation: "PORTFOLIO NAME FILTERING: All portfolio names start with the prefix \"SAM \" (e.g., \"SAM Technology & Infrastructure\", not \"Technology & Infrastructure\"). When filtering by portfolio name, ALWAYS include the \"SAM \" prefix. Use exact match with the full name, or use ILIKE with the SAM prefix. For month-to-date queries, filter to current month using DATE_TRUNC('MONTH', CURRENT_DATE()). When showing flows, always display both gross inflows and outflows alongside net flows for context. For client concentration analysis, show the count of distinct clients alongside flow amounts. Round flow amounts to nearest thousand for readability. When asked about 'driving' flows, drill down to client level using client_flows table. For client allocation or position questions, total_flow_amount represents the client invested position in each portfolio. Group by portfolio_name to show which portfolios a client invests in. For current holdings queries, filter to positive positions (total_flow_amount > 0). EXCEPTION for at-risk clients or redemption analysis: When analyzing clients with redemption patterns, declining flows, or at-risk status, do NOT filter to positive positions - show full flow history including zero or negative cumulative positions, as these clients may have fully or partially redeemed. Include GROSS_INFLOWS and GROSS_OUTFLOWS to show complete transaction history. IMPORTANT AUM DISTINCTION: strategy_aum (from strategy_perf) when summed across all strategies gives the authoritative firm AUM calculated from actual portfolio holdings - use this for board and executive reporting. total_aum_with_sam (from clients) is the sum of client-reported AUM which may differ due to reporting timing. For strategy performance queries, filter strategy_perf to the latest performance_date. When asked about top/bottom performing strategies, order by strategy_qtd_return or strategy_ytd_return."
  question_categorization: "If users ask about 'firm performance' or 'KPIs', use fund_flows for aggregated metrics. If users ask about 'what is driving' or 'client concentration', drill down to client_flows. If users ask about 'broad-based' demand, count distinct clients. If users ask about client allocation, portfolio distribution, or which portfolios a client invests in, use client_flows grouped by portfolio with positive position filter. For 'firm AUM' or 'total AUM' questions, use total_strategy_aum from strategy_perf summed across all strategies (not total_aum_with_sam). For 'strategy performance', 'top performing', or 'returns by strategy' questions, use average_strategy_qtd_return and average_strategy_ytd_return from strategy_perf. For 'who manages', 'portfolio manager', 'PM', 'team' questions, join pm_assignments to portfolios and portfolio_managers. For key-person risk or PM concentration analysis, compute each PM's share of total firm AUM via pm_assignments joined to strategy_perf."
verified_queries:
  - name: TOTAL_FUND_FLOWS
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_EXECUTIVE_VIEW METRICS total_net_flows, total_gross_inflows, total_gross_outflows)"
    question: What are the total fund flows?
    use_as_onboarding_question: true
  - name: CLIENT_AUM
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_EXECUTIVE_VIEW METRICS total_aum_with_sam, client_count)"
    question: What is the total client AUM?
    use_as_onboarding_question: true
  - name: CLIENT_FLOWS
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_EXECUTIVE_VIEW METRICS total_flow_amount, gross_inflows, gross_outflows)"
    question: What are the client flow totals?
    use_as_onboarding_question: false
  - name: FIRM_AUM
    sql: SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_EXECUTIVE_VIEW METRICS total_strategy_aum DIMENSIONS strategy)
    question: What is the firm AUM?
    use_as_onboarding_question: true
  - name: strategy_PERFORMANCE
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_EXECUTIVE_VIEW METRICS total_strategy_aum, average_strategy_qtd_return, average_strategy_ytd_return DIMENSIONS strategy)"
    question: What is the performance by strategy?
    use_as_onboarding_question: true
  - name: CLIENT_RELATIONSHIP_PROFILE
    sql: "SELECT __clients.client_name, __clients.client_type, __clients.primary_contact, __clients.region, SUM(__clients.aum_with_sam) AS total_aum_with_sam, MIN(__client_flows.FlowDate) AS RelationshipStartDate, MAX(__client_flows.FlowDate) AS LastActivityDate FROM __client_flows JOIN __clients ON (__client_flows.CLIENTID = __clients.CLIENTID) GROUP BY __clients.client_name, __clients.client_type, __clients.primary_contact, __clients.region"
    question: "What is the relationship profile for a specific client including AUM, type, and history?"
    use_as_onboarding_question: false
  - name: CLIENT_QUARTERLY_FLOWS
    sql: "SELECT __clients.client_name, DATE_TRUNC(MONTH, __client_flows.FlowDate) AS flow_month, SUM(CASE WHEN __client_flows.FlowAmount > 0 THEN __client_flows.FlowAmount ELSE 0 END) AS Subscriptions, SUM(CASE WHEN __client_flows.FlowAmount < 0 THEN ABS(__client_flows.FlowAmount) ELSE 0 END) AS Redemptions, SUM(__client_flows.FlowAmount) AS NetFlows FROM __client_flows JOIN __clients ON (__client_flows.CLIENTID = __clients.CLIENTID) GROUP BY __clients.client_name, flow_month ORDER BY flow_month DESC"
    question: What is the quarterly flow history for a client showing subscriptions and redemptions?
    use_as_onboarding_question: false
  - name: CLIENT_PORTFOLIO_ALLOCATION
    sql: "SELECT __clients.client_name, __portfolios.portfolio_name, __portfolios.strategy, SUM(__client_flows.FlowAmount) AS CurrentPosition FROM __client_flows JOIN __clients ON (__client_flows.CLIENTID = __clients.CLIENTID) JOIN __portfolios ON (__client_flows.PORTFOLIOID = __portfolios.PORTFOLIOID) GROUP BY __clients.client_name, __portfolios.portfolio_name, __portfolios.strategy HAVING CurrentPosition > 0 ORDER BY CurrentPosition DESC"
    question: Which portfolios is a client invested in?
    use_as_onboarding_question: false
  - name: AT_RISK_CLIENTS
    sql: "SELECT __clients.client_name, __clients.client_type, SUM(__client_flows.FlowAmount) AS NetFlow6M, SUM(CASE WHEN __client_flows.FlowAmount < 0 THEN ABS(__client_flows.FlowAmount) ELSE 0 END) AS TotalRedemptions, COUNT(__client_flows.FlowID) AS RedemptionCount FROM __client_flows JOIN __clients ON (__client_flows.CLIENTID = __clients.CLIENTID) GROUP BY __clients.client_name, __clients.client_type HAVING NetFlow6M < 0 ORDER BY NetFlow6M ASC"
    question: Which clients show redemption trends or declining engagement over the past 6 months?
    use_as_onboarding_question: false
