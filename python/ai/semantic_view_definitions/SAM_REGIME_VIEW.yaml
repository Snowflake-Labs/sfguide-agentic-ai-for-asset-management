name: SAM_REGIME_VIEW
description: "ML-based market regime detection: GMM model classifying daily market conditions as RISK_ON, TRANSITIONAL, or RISK_OFF"
tables:
  - name: benchmark_returns
    synonyms:
      - benchmark returns
      - index returns
      - market returns
    description: "Daily benchmark index returns (SPX, ACWI, etc.)."
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: FACT_BENCHMARK_RETURNS
    primary_key:
      columns:
        - benc_pk_date
        - benc_pk_benchmark_id
    dimensions:
      - name: benc_pk_benchmark_id
        description: "BENCHMARK_ID for benchmark_returns"
        expr: BENCHMARK_ID
        data_type: "NUMBER(38,0)"
      - name: benchmark_code
        synonyms:
          - benchmark
          - index
        description: "Benchmark index code (SPX, ACWI, RUT, NDX, AGG)"
        expr: BENCHMARK_CODE
        data_type: VARCHAR(7)
    time_dimensions:
      - name: benc_pk_date
        description: "DATE for benchmark_returns"
        expr: DATE
        data_type: DATE
    facts:
      - name: daily_return
        description: "Daily security return"
        expr: DAILY_RETURN
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: total_daily_return
        synonyms:
          - daily return
          - benchmark return
          - index return
        description: Daily benchmark return
        expr: SUM(daily_return)
        access_modifier: public_access
  - name: regime_predictions
    synonyms:
      - regime
      - market regime
      - regime predictions
      - regime classification
    description: "ML-based market regime predictions from GMM model. Classifies each trading day as RISK_ON, TRANSITIONAL, or RISK_OFF with cluster probabilities."
    base_table:
      database: {{DATABASE}}
      schema: ML
      table: FACT_REGIME_PREDICTIONS
    primary_key:
      columns:
        - prediction_date
    dimensions:
      - name: model_version
        description: Version identifier of the regime model used for scoring
        expr: MODEL_VERSION
        data_type: VARCHAR(50)
      - name: regime_label
        synonyms:
          - regime
          - regime type
          - market regime
        description: "Market regime classification: RISK_ON, TRANSITIONAL, or RISK_OFF"
        expr: REGIME_LABEL
        data_type: VARCHAR(20)
        is_enum: true
        sample_values:
          - "RISK_ON"
          - "TRANSITIONAL"
          - "RISK_OFF"
    time_dimensions:
      - name: regi_pk_date
        description: "DATE for regime_predictions"
        expr: "DATE"
        data_type: DATE
    facts:
      - name: cluster_0_probability
        description: "Probability of regime cluster 0"
        expr: CLUSTER_0_PROB
        data_type: FLOAT
        access_modifier: public_access
      - name: cluster_1_probability
        description: "Probability of regime cluster 1"
        expr: CLUSTER_1_PROB
        data_type: FLOAT
        access_modifier: public_access
      - name: cluster_2_probability
        description: "Probability of regime cluster 2"
        expr: CLUSTER_2_PROB
        data_type: FLOAT
        access_modifier: public_access
      - name: momentum_20d
        description: "Twenty-day price momentum"
        expr: MOMENTUM_20D
        data_type: FLOAT
        access_modifier: public_access
      - name: realised_vol_20d
        description: "Twenty-day realised volatility"
        expr: REALISED_VOL_20D
        data_type: FLOAT
        access_modifier: public_access
      - name: regime_probability
        description: "Probability assigned to the regime classification"
        expr: REGIME_PROBABILITY
        data_type: FLOAT
        access_modifier: public_access
      - name: vix_level
        description: "VIX index level"
        expr: VIX_LEVEL
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_cluster_0_probability
        description: Probability of belonging to cluster 0
        expr: AVG(cluster_0_probability)
        access_modifier: public_access
      - name: average_cluster_1_probability
        description: Probability of belonging to cluster 1
        expr: AVG(cluster_1_probability)
        access_modifier: public_access
      - name: average_cluster_2_probability
        description: Probability of belonging to cluster 2
        expr: AVG(cluster_2_probability)
        access_modifier: public_access
      - name: average_momentum_20d
        synonyms:
          - momentum
          - 20 day momentum
          - short term momentum
        description: 20-day cumulative SPX return (momentum signal)
        expr: AVG(momentum_20d)
        access_modifier: public_access
      - name: average_realised_vol_20d
        synonyms:
          - realised vol
          - realized volatility
          - actual volatility
        description: 20-day realised volatility of SPX returns
        expr: AVG(realised_vol_20d)
        access_modifier: public_access
      - name: average_regime_probability
        synonyms:
          - confidence
          - probability
          - regime confidence
        description: Maximum cluster probability (confidence of regime classification)
        expr: AVG(regime_probability)
        access_modifier: public_access
      - name: average_vix_level
        synonyms:
          - vix
          - vix level
          - implied vol
        description: VIX level at time of prediction
        expr: AVG(vix_level)
        access_modifier: public_access
    time_dimensions:
      - name: prediction_date
        synonyms:
          - date
          - trading date
        description: Trading date of the regime prediction
        expr: '"DATE"'
        data_type: DATE
  - name: vix_daily
    synonyms:
      - vix
      - volatility index
      - implied volatility
    description: "Daily VIX data (close, high, low) for volatility context."
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: FACT_VIX_DAILY
    primary_key:
      columns:
        - vix_pk_date
    time_dimensions:
      - name: vix_pk_date
        description: "DATE for vix_daily"
        expr: DATE
        data_type: DATE
    facts:
      - name: vix_close
        description: "VIX closing level"
        expr: VIX_CLOSE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_vix_close
        synonyms:
          - vix close
          - vix closing
        description: VIX closing level
        expr: AVG(vix_close)
        access_modifier: public_access
  - name: sovereign_fiscal
    synonyms:
      - sovereign_debt
      - government_debt
      - fiscal_outlook
      - imf_fiscal_monitor
    description: IMF Fiscal Monitor sovereign fiscal data by country and year — gross and
      net debt to GDP, fiscal balances, revenue and expenditure. The only forward-looking
      macro series in the demo, carrying IMF projections five years out, flagged by
      is_forecast. Use it as the fiscal backdrop to a market regime, since rising sovereign debt
      and widening deficits are part of the macro context for a risk-off regime. Annual
      data, so it sets the backdrop rather than explaining a daily regime change.
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: FACT_SOVEREIGN_FISCAL_OUTLOOK
    primary_key:
      columns:
        - sovereign_fiscal_id
    dimensions:
      - name: sovereign_fiscal_id
        description: Row identifier
        expr: SOVEREIGN_FISCAL_ID
        data_type: "NUMBER(38,0)"
      - name: sovereign_country
        synonyms:
          - country_code
          - sovereign_iso3
        description: "ISO3 country code, for example USA, GBR, DEU, JPN"
        expr: COUNTRY_ISO3
        data_type: VARCHAR(16777216)
      - name: fiscal_measure
        synonyms:
          - debt_measure
          - fiscal_metric
        description: "What is being measured, for example 'Gross debt (% of GDP)',
          'Net lending/borrowing (also referred as overall balance) (% of GDP)'"
        expr: MEASURE_NAME
        data_type: VARCHAR(16777216)
      - name: sovereign_fiscal_year
        description: Year the figure relates to
        expr: FISCAL_YEAR
        data_type: "NUMBER(38,0)"
      - name: is_forecast
        synonyms:
          - is_projection
        description: TRUE when the row is an IMF projection rather than an observed
          historical figure. ALWAYS say so when presenting a forecast value.
        expr: IS_FORECAST
        data_type: BOOLEAN
        is_enum: true
        sample_values:
          - "TRUE"
          - "FALSE"
    time_dimensions:
      - name: sovereign_period_date
        description: Period end date for the observation or projection
        expr: PERIOD_DATE
        data_type: DATE
    facts:
      - name: value_pct_gdp
        synonyms:
          - debt_to_gdp
          - pct_of_gdp
        description: The measured value as a percent of GDP (120.8 = 120.8% of GDP). Already
          a percentage — do not multiply by 100.
        expr: VALUE_PCT_GDP
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: avg_value_pct_gdp
        description: Average value across the selected countries and years
        expr: AVG(value_pct_gdp)
        access_modifier: public_access
relationships:
  - name: benchmark_to_regime
    left_table: benchmark_returns
    right_table: regime_predictions
    relationship_columns:
      - left_column: benc_pk_date
        right_column: prediction_date
  - name: vix_to_regime
    left_table: vix_daily
    right_table: regime_predictions
    relationship_columns:
      - left_column: vix_pk_date
        right_column: prediction_date
verified_queries:
  - name: SOVEREIGN_DEBT_TRAJECTORY
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_REGIME_VIEW DIMENSIONS sovereign_fiscal.sovereign_country, sovereign_fiscal.sovereign_fiscal_year, sovereign_fiscal.is_forecast METRICS sovereign_fiscal.avg_value_pct_gdp WHERE sovereign_fiscal.fiscal_measure = 'Gross debt (% of GDP)' AND sovereign_fiscal.sovereign_country = 'USA' AND sovereign_fiscal.sovereign_fiscal_year >= 2024) ORDER BY sovereign_fiscal_year"
    question: What is the trajectory of US gross debt to GDP through 2030, and which years are forecasts?
    use_as_onboarding_question: true
  - name: LATEST_VIX_LEVEL
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_REGIME_VIEW DIMENSIONS vix_daily.vix_pk_date METRICS vix_daily.average_vix_close) ORDER BY vix_pk_date DESC LIMIT 10"
    question: How has the VIX moved over the last few trading days?
    use_as_onboarding_question: true
