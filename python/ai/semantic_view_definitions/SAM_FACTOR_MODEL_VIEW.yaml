name: SAM_FACTOR_MODEL_VIEW
description: "ML-based quant factor model: z-scored factor scores, Fama-MacBeth returns, XGBoost predictions, and optimal portfolio weights"
tables:
  - name: factor_returns
    synonyms:
      - factor returns
      - factor performance
      - fama macbeth
    description: Monthly Fama-MacBeth cross-sectional regression factor returns with t-statistics.
    base_table:
      database: {{DATABASE}}
      schema: ML
      table: FACT_FACTOR_RETURNS
    primary_key:
      columns:
        - fact_pk_month_date
    time_dimensions:
      - name: fact_pk_month_date
        description: "MONTH_DATE for factor_returns"
        expr: MONTH_DATE
        data_type: DATE
    facts:
      - name: momentum_return
        description: "Fama-MacBeth return for momentum factor"
        expr: MOMENTUM_RETURN
        data_type: FLOAT
        access_modifier: public_access
      - name: quality_return
        description: "Fama-MacBeth return for quality factor"
        expr: QUALITY_RETURN
        data_type: FLOAT
        access_modifier: public_access
      - name: r_squared
        description: "R-squared goodness-of-fit for factor model"
        expr: R_SQUARED
        data_type: FLOAT
        access_modifier: public_access
      - name: value_return
        description: "Fama-MacBeth return for value factor"
        expr: VALUE_RETURN
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_r_squared
        description: Cross-sectional R-squared of Fama-MacBeth regression
        expr: AVG(r_squared)
        access_modifier: public_access
      - name: total_momentum_return
        description: Monthly Fama-MacBeth momentum factor return
        expr: SUM(momentum_return)
        access_modifier: public_access
      - name: total_quality_return
        description: Monthly Fama-MacBeth quality factor return
        expr: SUM(quality_return)
        access_modifier: public_access
      - name: total_value_return
        description: Monthly Fama-MacBeth value factor return
        expr: SUM(value_return)
        access_modifier: public_access
  - name: factor_scores
    synonyms:
      - factor scores
      - factor exposures
      - factor tilts
    description: "Monthly cross-sectionally z-scored factor scores for each security. 12 factors including momentum, value, quality, growth."
    base_table:
      database: {{DATABASE}}
      schema: ML
      table: FACT_FACTOR_SCORES
    primary_key:
      columns:
        - ticker
        - month_date
    dimensions:
      - name: ticker
        synonyms:
          - stock
          - security
        description: Security ticker symbol
        expr: TICKER
        data_type: VARCHAR(20)
    facts:
      - name: growth_score
        description: "Z-scored growth factor score"
        expr: GROWTH_SCORE
        data_type: FLOAT
        access_modifier: public_access
      - name: momentum_score
        description: "Z-scored momentum factor score"
        expr: MOMENTUM_SCORE
        data_type: FLOAT
        access_modifier: public_access
      - name: quality_score
        description: "Z-scored quality factor score"
        expr: QUALITY_SCORE
        data_type: FLOAT
        access_modifier: public_access
      - name: size_score
        description: "Z-scored size factor score"
        expr: SIZE_SCORE
        data_type: FLOAT
        access_modifier: public_access
      - name: value_score
        description: "Z-scored value factor score"
        expr: VALUE_SCORE
        data_type: FLOAT
        access_modifier: public_access
      - name: volatility_score
        description: "Z-scored volatility factor score"
        expr: VOLATILITY_SCORE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_growth_score
        synonyms:
          - growth
        description: Cross-sectional z-score of growth factor
        expr: AVG(growth_score)
        access_modifier: public_access
      - name: average_momentum_score
        synonyms:
          - momentum
          - mom
        description: Cross-sectional z-score of momentum factor
        expr: AVG(momentum_score)
        access_modifier: public_access
      - name: average_quality_score
        synonyms:
          - quality
        description: Cross-sectional z-score of quality factor
        expr: AVG(quality_score)
        access_modifier: public_access
      - name: average_size_score
        synonyms:
          - size
          - market cap
        description: Cross-sectional z-score of size factor
        expr: AVG(size_score)
        access_modifier: public_access
      - name: average_value_score
        synonyms:
          - value
        description: Cross-sectional z-score of value factor
        expr: AVG(value_score)
        access_modifier: public_access
      - name: average_volatility_score
        synonyms:
          - vol
          - volatility
        description: Cross-sectional z-score of volatility factor
        expr: AVG(volatility_score)
        access_modifier: public_access
    time_dimensions:
      - name: month_date
        synonyms:
          - month
          - date
        description: Month end date for factor scores
        expr: MONTH_DATE
        data_type: DATE
  - name: ml_predictions
    synonyms:
      - factor predictions
      - return predictions
      - ml signals
    description: XGBoost ML-predicted forward returns with SHAP top feature attribution.
    base_table:
      database: {{DATABASE}}
      schema: ML
      table: FACT_ML_FACTOR_PREDICTIONS
    primary_key:
      columns:
        - ml_p_pk_ticker
        - ml_p_pk_month_date
    dimensions:
      - name: ml_p_pk_ticker
        description: "TICKER for ml_predictions"
        expr: TICKER
        data_type: "NUMBER(38,0)"
      - name: model_version
        description: Model version used for prediction
        expr: MODEL_VERSION
        data_type: VARCHAR(50)
      - name: shap_top_feature
        description: Most important SHAP feature for this prediction
        expr: SHAP_TOP_FEATURE
        data_type: VARCHAR(50)
    time_dimensions:
      - name: ml_p_pk_month_date
        description: "MONTH_DATE for ml_predictions"
        expr: MONTH_DATE
        data_type: DATE
    facts:
      - name: predicted_return
        description: "XGBoost predicted next-period return"
        expr: PREDICTED_RETURN
        data_type: FLOAT
        access_modifier: public_access
      - name: shap_top_value
        description: "SHAP value for the top contributing feature"
        expr: SHAP_TOP_VALUE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_predicted_return
        synonyms:
          - predicted return
          - ml signal
          - expected return
        description: XGBoost predicted forward 21-day return
        expr: AVG(predicted_return)
        access_modifier: public_access
      - name: average_shap_top_value
        description: SHAP value of the top feature
        expr: AVG(shap_top_value)
        access_modifier: public_access
  - name: optimal_portfolio
    synonyms:
      - optimal portfolio
      - portfolio weights
      - target weights
    description: Mean-variance optimised portfolio weights from ML-predicted returns.
    base_table:
      database: {{DATABASE}}
      schema: ML
      table: FACT_OPTIMAL_PORTFOLIO
    primary_key:
      columns:
        - opti_pk_ticker
        - opti_pk_month_date
    dimensions:
      - name: opti_pk_ticker
        description: "TICKER for optimal_portfolio"
        expr: TICKER
        data_type: "NUMBER(38,0)"
    time_dimensions:
      - name: opti_pk_month_date
        description: "MONTH_DATE for optimal_portfolio"
        expr: MONTH_DATE
        data_type: DATE
    facts:
      - name: expected_return
        description: "Expected return estimate for the security"
        expr: EXPECTED_RETURN
        data_type: FLOAT
        access_modifier: public_access
      - name: risk_contribution
        description: "Contribution to portfolio risk"
        expr: RISK_CONTRIBUTION
        data_type: FLOAT
        access_modifier: public_access
      - name: weight
        description: "Optimal portfolio weight"
        expr: WEIGHT
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: total_expected_return
        description: Expected return for this position
        expr: SUM(expected_return)
        access_modifier: public_access
      - name: total_risk_contribution
        description: Risk contribution to portfolio volatility
        expr: SUM(risk_contribution)
        access_modifier: public_access
      - name: total_weight
        synonyms:
          - portfolio weight
          - allocation
        description: Optimal portfolio weight from mean-variance optimisation
        expr: SUM(weight)
        access_modifier: public_access
relationships:
  - name: scores_to_returns
    left_table: factor_scores
    right_table: factor_returns
    relationship_columns:
      - left_column: month_date
        right_column: fact_pk_month_date
  - name: predictions_to_scores
    left_table: ml_predictions
    right_table: factor_scores
    relationship_columns:
      - left_column: ml_p_pk_ticker
        right_column: ticker
      - left_column: ml_p_pk_month_date
        right_column: month_date
  - name: portfolio_to_predictions
    left_table: optimal_portfolio
    right_table: ml_predictions
    relationship_columns:
      - left_column: opti_pk_ticker
        right_column: ml_p_pk_ticker
      - left_column: opti_pk_month_date
        right_column: ml_p_pk_month_date
verified_queries:
  - name: latest_factor_score_month
    question: Show the latest available month for factor scores.
    sql: "SELECT MAX(__factor_scores.month_date) AS LATEST_MONTH FROM __factor_scores"
    use_as_onboarding_question: false
  - name: ranked_value_quality_momentum_shortlist
    question: Show a ranked shortlist of stocks for the latest month with strong value and quality scores plus improving momentum.
    sql: "WITH latest_month AS (SELECT MAX(__factor_scores.month_date) AS month_date FROM __factor_scores), scored AS (SELECT __factor_scores.ticker, __factor_scores.month_date, __factor_scores.value_score, __factor_scores.quality_score, __factor_scores.momentum_score, LAG(__factor_scores.momentum_score, 3) OVER (PARTITION BY __factor_scores.ticker ORDER BY __factor_scores.month_date) AS momentum_3m_ago FROM __factor_scores WHERE __factor_scores.value_score IS NOT NULL AND __factor_scores.quality_score IS NOT NULL AND __factor_scores.momentum_score IS NOT NULL), latest AS (SELECT scored.ticker, scored.month_date, scored.value_score, scored.quality_score, scored.momentum_score, scored.momentum_3m_ago, scored.momentum_score - COALESCE(scored.momentum_3m_ago, 0) AS momentum_delta_3m FROM scored JOIN latest_month ON scored.month_date = latest_month.month_date), ranked AS (SELECT latest.ticker, latest.month_date, latest.value_score, latest.quality_score, latest.momentum_score, latest.momentum_delta_3m, PERCENT_RANK() OVER (ORDER BY latest.value_score) AS value_pct, PERCENT_RANK() OVER (ORDER BY latest.quality_score) AS quality_pct, PERCENT_RANK() OVER (ORDER BY latest.momentum_score) AS momentum_pct, PERCENT_RANK() OVER (ORDER BY latest.momentum_delta_3m) AS momentum_delta_pct FROM latest) SELECT ranked.ticker, ranked.month_date, ranked.value_score, ranked.quality_score, ranked.momentum_score, ranked.momentum_delta_3m, ranked.value_pct, ranked.quality_pct, ranked.momentum_pct, ranked.momentum_delta_pct, 0.35 * ranked.value_pct + 0.35 * ranked.quality_pct + 0.15 * ranked.momentum_pct + 0.15 * ranked.momentum_delta_pct AS composite_rank FROM ranked WHERE ranked.value_pct >= 0.60 AND ranked.quality_pct >= 0.60 AND ranked.momentum_delta_3m > 0 ORDER BY composite_rank DESC, ranked.ticker LIMIT 20"
    use_as_onboarding_question: false
  - name: momentum_improvement_over_three_months
    question: Show which stocks improved their momentum score over the last three months in the latest factor month.
    sql: "WITH latest_month AS (SELECT MAX(__factor_scores.month_date) AS month_date FROM __factor_scores), scored AS (SELECT __factor_scores.ticker, __factor_scores.month_date, __factor_scores.momentum_score, LAG(__factor_scores.momentum_score, 3) OVER (PARTITION BY __factor_scores.ticker ORDER BY __factor_scores.month_date) AS momentum_3m_ago FROM __factor_scores WHERE __factor_scores.momentum_score IS NOT NULL) SELECT scored.ticker, scored.month_date, scored.momentum_score, scored.momentum_3m_ago, scored.momentum_score - COALESCE(scored.momentum_3m_ago, 0) AS momentum_delta_3m FROM scored JOIN latest_month ON scored.month_date = latest_month.month_date WHERE scored.momentum_score - COALESCE(scored.momentum_3m_ago, 0) > 0 ORDER BY momentum_delta_3m DESC, scored.ticker LIMIT 50"
    use_as_onboarding_question: false
  - name: latest_factor_score_distribution_summary
    question: Summarize the latest-month distribution of value, quality, and momentum scores.
    sql: "WITH latest_month AS (SELECT MAX(__factor_scores.month_date) AS month_date FROM __factor_scores) SELECT COUNT(*) AS security_count, MIN(__factor_scores.value_score) AS min_value_score, MAX(__factor_scores.value_score) AS max_value_score, AVG(__factor_scores.value_score) AS avg_value_score, MIN(__factor_scores.quality_score) AS min_quality_score, MAX(__factor_scores.quality_score) AS max_quality_score, AVG(__factor_scores.quality_score) AS avg_quality_score, MIN(__factor_scores.momentum_score) AS min_momentum_score, MAX(__factor_scores.momentum_score) AS max_momentum_score, AVG(__factor_scores.momentum_score) AS avg_momentum_score FROM __factor_scores JOIN latest_month ON __factor_scores.month_date = latest_month.month_date"
    use_as_onboarding_question: false
