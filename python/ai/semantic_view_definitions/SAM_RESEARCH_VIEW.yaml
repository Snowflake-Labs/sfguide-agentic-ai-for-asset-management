name: SAM_RESEARCH_VIEW
description: "Consolidated research domain view for company financial analysis. Covers SEC financial statements (income, balance sheet, cash flow), analyst estimates and consensus (revenue, earnings, price targets), revenue segments (geographic and business breakdowns), insider trading (Form 4 transactions), and institutional holdings (13F filings). Financial data from SEC 10-K/10-Q via SNOWFLAKE_PUBLIC_DATA_FREE."
tables:
  - name: analysts
    synonyms:
      - research_analysts
    description: Analyst information
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: DIM_ANALYST
    primary_key:
      columns:
        - anal_pk_analyst_id
    dimensions:
      - name: anal_pk_broker_id
        description: "BROKER_ID for analysts"
        expr: "BROKER_ID"
        data_type: "NUMBER(38,0)"
      - name: anal_pk_analyst_id
        description: "ANALYST_ID for analysts"
        expr: ANALYST_ID
        data_type: "NUMBER(38,0)"
      - name: analyst_name
        synonyms:
          - analyst
          - research_analyst
        description: Analyst name
        expr: ANALYST_NAME
        data_type: VARCHAR(17)
      - name: sector_coverage
        synonyms:
          - sector
          - coverage_sector
        description: Analyst sector coverage
        expr: SECTOR_COVERAGE
        data_type: VARCHAR(11)
  - name: analyst_estimates
    synonyms:
      - analyst_data
      - price_targets
      - ratings
    description: Individual analyst estimates including price targets and ratings
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: FACT_ESTIMATE_DATA
    primary_key:
      columns:
        - anal_pk_estimate_id
    dimensions:
      - name: anal_pk_issuerid
        description: "ISSUERID for analyst_estimates"
        expr: "ISSUERID"
        data_type: "NUMBER(38,0)"
      - name: anal_pk_broker_id
        description: "BROKER_ID for analyst_estimates"
        expr: "BROKER_ID"
        data_type: "NUMBER(38,0)"
      - name: anal_pk_analyst_id
        description: "ANALYST_ID for analyst_estimates"
        expr: "ANALYST_ID"
        data_type: "NUMBER(38,0)"
      - name: anal_pk_estimate_id
        description: "ESTIMATE_ID for analyst_estimates"
        expr: ESTIMATE_ID
        data_type: "NUMBER(38,0)"
    metrics:
      - name: avg_price_target
        synonyms:
          - price_target
          - target_price
          - pt
        description: Average analyst price target
        expr: AVG(CASE WHEN DATA_ITEM_ID = 5005 THEN DATA_VALUE END)
        access_modifier: public_access
      - name: avg_rating
        synonyms:
          - rating
          - analyst_rating
          - average_rating
        description: "Average analyst rating (1=Strong Buy, 2=Buy, 3=Hold, 4=Sell, 5=Strong Sell). Lower is more bullish. Derived from price target versus current share price, so it is consistent with the ratings quoted in broker research documents."
        expr: AVG(CASE WHEN DATA_ITEM_ID = 5006 THEN DATA_VALUE END)
        access_modifier: public_access
      - name: estimate_count
        synonyms:
          - analyst_count
        description: Count of analyst estimates
        expr: COUNT(ESTIMATE_ID)
        access_modifier: public_access
      - name: max_price_target
        synonyms:
          - high_price_target
          - bull_target
        description: Highest analyst price target
        expr: MAX(CASE WHEN DATA_ITEM_ID = 5005 THEN DATA_VALUE END)
        access_modifier: public_access
      - name: min_price_target
        synonyms:
          - low_price_target
          - bear_target
        description: Lowest analyst price target
        expr: MIN(CASE WHEN DATA_ITEM_ID = 5005 THEN DATA_VALUE END)
        access_modifier: public_access
  - name: brokers
    synonyms:
      - sell_side
      - research_firms
    description: Broker/research firm information
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: DIM_BROKER
    primary_key:
      columns:
        - brok_pk_broker_id
    dimensions:
      - name: brok_pk_broker_id
        description: "BROKER_ID for brokers"
        expr: BROKER_ID
        data_type: "NUMBER(38,0)"
      - name: broker_name
        synonyms:
          - broker
          - research_firm
          - sell_side_firm
        description: "Fictional sell-side research house, one of 15 exact names (see values). Filter with = on the exact name, never LIKE or ILIKE."
        expr: BROKER_NAME
        data_type: VARCHAR(134217728)
        is_enum: true
        sample_values:
          - Alder & Finch Investments
          - Ashfield Partners
          - Blackstone Ridge Research
          - Bluehaven Capital Research
          - Brookline Advisory Group
          - Crescent Point Analytics
          - Fairmont Capital Insights
          - Granite Peak Advisory
          - Harrow Street Markets
          - Kingswell Securities Research
          - Marlowe & Co. Research
          - Northgate Analytics
          - Regent Square Analytics
          - Sterling Wharf Intelligence
          - Whitestone Equity Research
  - name: recommendations
    synonyms:
      - analyst_ratings
      - broker_ratings
      - rating_history
      - price_target_history
      - recommendation_history
    description: >-
      Point-in-time analyst ratings and price targets, one row per broker per
      security per weekly/monthly vintage. 40 vintages of history, so this is the
      table to use for anything about rating changes, upgrades and downgrades,
      broker dispersion, or how sentiment has moved over time. Ratings and targets
      are derived from the real close and real SEC fundamentals as at the vintage
      date. The five-point scale is exactly Strong Buy, Buy, Hold, Sell, Strong
      Sell - no other labels exist. Broker names are fictional research houses,
      each with a persistent bias. Coverage is 419 of 503 securities and 3-8
      brokers per security, so absence of a rating is normal and not an error.
      Prefer this table over analyst_estimates for anything historical:
      analyst_estimates holds only the most recent vintage.
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: FACT_RECOMMENDATION
    primary_key:
      columns:
        - reco_pk_recommendation_id
    dimensions:
      - name: reco_pk_recommendation_id
        description: "RECOMMENDATIONID for recommendations"
        expr: RECOMMENDATIONID
        data_type: VARCHAR(32)
      - name: reco_pk_issuerid
        description: "ISSUERID for recommendations"
        expr: ISSUERID
        data_type: "NUMBER(18,0)"
      - name: reco_pk_securityid
        description: "SECURITYID for recommendations"
        expr: SECURITYID
        data_type: "NUMBER(18,0)"
      - name: recommendation_ticker
        synonyms:
          - rated_ticker
        description: Ticker of the rated security
        expr: TICKER
        data_type: VARCHAR(16777216)
      - name: recommendation_company_name
        synonyms:
          - rated_company
        description: "Legal name of the rated company exactly as stored, the same values as company_name, e.g. ELI LILLY & CO, META PLATFORMS, INC. Users give informal names (Lilly, Meta): look up the stored value with this column's search lookup and filter with =, never LIKE or ILIKE. If none of the returned names is the company the user meant, the company is not covered - say so rather than substituting a similar name."
        expr: COMPANYNAME
        data_type: VARCHAR(16777216)
        cortex_search_service:
          service: SAM_ISSUER_NAME_SEARCH
          literal_column: LEGALNAME
          database: {{DATABASE}}
          schema: AI
      - name: recommendation_sector
        description: GICS sector of the rated security
        expr: GICS_SECTOR
        data_type: VARCHAR(16777216)
      - name: recommendation_broker_name
        synonyms:
          - rating_broker
          - research_house
        description: >-
          Fictional research house that issued the rating. One of 15 exact names
          (see values); filter with = on the exact name, never LIKE or ILIKE. Each
          carries a persistent optimism or pessimism bias, so comparing average
          upside by broker is meaningful.
        expr: BROKERNAME
        data_type: VARCHAR(16777216)
        is_enum: true
        sample_values:
          - Alder & Finch Investments
          - Ashfield Partners
          - Blackstone Ridge Research
          - Bluehaven Capital Research
          - Brookline Advisory Group
          - Crescent Point Analytics
          - Fairmont Capital Insights
          - Granite Peak Advisory
          - Harrow Street Markets
          - Kingswell Securities Research
          - Marlowe & Co. Research
          - Northgate Analytics
          - Regent Square Analytics
          - Sterling Wharf Intelligence
          - Whitestone Equity Research
      - name: rating
        synonyms:
          - analyst_rating
          - recommendation
          - current_rating
        description: >-
          Analyst rating on the five-point scale: Strong Buy, Buy, Hold, Sell,
          Strong Sell. These are the only valid values.
        expr: RATING
        data_type: VARCHAR(11)
      - name: prior_rating
        synonyms:
          - previous_rating
          - rating_before
        description: The same broker's rating at the previous vintage, NULL on initiation.
        expr: PRIORRATING
        data_type: VARCHAR(11)
      - name: rating_action
        synonyms:
          - revision
          - rating_change
          - upgrade_downgrade
        description: >-
          What the broker did at this vintage: upgrade, downgrade, reiterate or
          initiate. Filter on upgrade or downgrade to find revisions.
        expr: RATINGACTION
        data_type: VARCHAR(9)
      - name: valuation_basis
        synonyms:
          - valuation_method
        description: >-
          How fair value was derived: reported_eps (earnings based), derived_eps
          (net income over shares), or sales_multiple (loss-making names valued on
          revenue), or price_fallback (no usable reported fundamentals, e.g. no
          annual SEC filing or mixed-currency filings; target from sector median
          view plus trailing price momentum). Sales-multiple and price_fallback
          names carry lower conviction.
        expr: VALUATIONBASIS
        data_type: VARCHAR(16777216)
      - name: driver_summary
        synonyms:
          - rating_rationale
        description: Short text explanation of what drove this rating and target.
        expr: DRIVERSUMMARY
        data_type: VARCHAR(16777216)
    time_dimensions:
      - name: vintage_date
        synonyms:
          - rating_date
          - recommendation_date
          - as_of_date
        description: >-
          The date this rating was struck. Use this for any time comparison, trend
          or "latest rating" question. Latest vintage is the current view. To filter
          to the latest vintage, look up MAX(vintage_date) in a separate query first
          and filter on the date it returns: a MAX() subquery inside the WHERE
          clause can fail to compile against this view.
        expr: VINTAGEDATE
        data_type: DATE
      - name: fundamentals_as_of
        description: Period end date of the SEC fundamentals used for the valuation.
        expr: FUNDAMENTALSASOF
        data_type: DATE
    facts:
      - name: close_price
        synonyms:
          - price_at_rating
        description: Security close price on the vintage date, in USD.
        expr: CLOSEPRICE
        data_type: FLOAT
      - name: fair_value
        description: Derived fair value per share, in USD.
        expr: FAIRVALUE
        data_type: FLOAT
      - name: price_target
        synonyms:
          - target_price
          - twelve_month_target
        description: Broker's 12-month price target, in USD.
        expr: PRICETARGET
        data_type: FLOAT
      - name: prior_price_target
        description: The same broker's price target at the previous vintage, in USD.
        expr: PRIORPRICETARGET
        data_type: FLOAT
      - name: upside_fraction
        synonyms:
          - upside
          - implied_upside
        description: >-
          Implied upside as a FRACTION, not a percentage: 0.0378 means +3.78%.
          Always multiply by 100 when presenting. Exactly equals
          price_target / close_price - 1.
        expr: UPSIDEPCT
        data_type: FLOAT
      - name: broker_bias_fraction
        description: >-
          The research house's persistent bias as a fraction (-0.08 to +0.10).
          Multiply by 100 when presenting.
        expr: BROKERBIASPCT
        data_type: FLOAT
    metrics:
      - name: avg_recommendation_price_target
        synonyms:
          - consensus_price_target
        description: Average price target across brokers, in USD.
        expr: AVG(price_target)
        data_type: FLOAT
      - name: max_recommendation_price_target
        description: Highest price target across brokers, in USD.
        expr: MAX(price_target)
        data_type: FLOAT
      - name: min_recommendation_price_target
        description: Lowest price target across brokers, in USD.
        expr: MIN(price_target)
        data_type: FLOAT
      - name: avg_upside_fraction
        synonyms:
          - average_upside
        description: Average implied upside as a FRACTION. Multiply by 100 to present.
        expr: AVG(upside_fraction)
        data_type: FLOAT
      - name: recommendation_count
        synonyms:
          - covering_brokers
          - coverage_count
        description: Number of broker ratings.
        expr: COUNT(reco_pk_recommendation_id)
        data_type: "NUMBER(38,0)"
      - name: covering_broker_count
        description: Number of distinct research houses covering the security.
        expr: COUNT(DISTINCT recommendation_broker_name)
        data_type: "NUMBER(38,0)"
      - name: price_target_dispersion
        synonyms:
          - target_spread
        description: >-
          Spread between the highest and lowest price target, in USD. A wide
          spread means the street disagrees.
        expr: MAX(price_target) - MIN(price_target)
        data_type: FLOAT
  - name: consensus
    synonyms:
      - estimates
      - forecasts
    description: Analyst consensus estimates for future periods
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: FACT_ESTIMATE_CONSENSUS
    primary_key:
      columns:
        - cons_pk_consensus_id
    dimensions:
      - name: cons_pk_issuerid
        description: "ISSUERID for consensus"
        expr: "ISSUERID"
        data_type: "NUMBER(38,0)"
      - name: cons_pk_consensus_id
        description: "CONSENSUS_ID for consensus"
        expr: CONSENSUS_ID
        data_type: "NUMBER(38,0)"
      - name: estimate_type
        synonyms:
          - metric_type
          - consensus_metric
        description: "Type of consensus estimate, using these exact case-sensitive labels: Revenue, Net Income, EBITDA, TAM, Customer Count, NRR. CRITICAL: Always filter or group by estimate_type when querying consensus data — different types have vastly different scales."
        expr: ESTIMATE_TYPE
        data_type: VARCHAR(16777216)
        is_enum: true
        sample_values:
          - "Revenue"
          - "Net Income"
          - "EBITDA"
          - "TAM"
          - "Customer Count"
          - "NRR"
      - name: financial_estimates_usd
        description: "Filter: consensus estimates of company financials stated in US dollars (Revenue, Net Income, EBITDA). Use when showing estimates side by side in one table or chart. TAM is a market size, and Customer Count and NRR are not dollar amounts, so they cannot share a column with these."
        expr: ESTIMATE_TYPE IN ('Revenue', 'Net Income', 'EBITDA')
        data_type: BOOLEAN
        labels:
          - filter
    facts:
      - name: consensus_high
        description: "Highest analyst estimate"
        expr: CONSENSUS_HIGH
        data_type: FLOAT
        access_modifier: public_access
      - name: consensus_low
        description: "Lowest analyst estimate"
        expr: CONSENSUS_LOW
        data_type: FLOAT
        access_modifier: public_access
      - name: consensus_mean
        description: "Mean analyst consensus estimate"
        expr: CONSENSUS_MEAN
        data_type: FLOAT
        access_modifier: public_access
      - name: num_estimates
        description: "Number of analyst estimates"
        expr: NUM_ESTIMATES
        data_type: "NUMBER(20,0)"
        access_modifier: public_access
    metrics:
      - name: average_consensus_mean
        synonyms:
          - consensus
          - mean_estimate
          - average_estimate
        description: Consensus mean estimate value
        expr: AVG(consensus_mean)
        access_modifier: public_access
      - name: average_num_estimates
        synonyms:
          - analyst_coverage
          - coverage_count
          - number_of_analysts
        description: Average number of analyst estimates
        expr: AVG(num_estimates)
        access_modifier: public_access
      - name: max_consensus_high
        synonyms:
          - high_estimate
          - bull_case
          - optimistic_estimate
        description: Highest consensus estimate
        expr: MAX(consensus_high)
        access_modifier: public_access
      - name: min_consensus_low
        synonyms:
          - low_estimate
          - bear_case
          - pessimistic_estimate
        description: Lowest consensus estimate
        expr: MIN(consensus_low)
        access_modifier: public_access
  - name: financials
    synonyms:
      - financial_data
      - statements
      - fundamentals
      - sec_financials
    description: "Real SEC financial statement data from 10-K and 10-Q filings including income statement, balance sheet, and cash flow metrics"
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: FACT_SEC_FINANCIALS
    primary_key:
      columns:
        - fina_pk_financial_id
    dimensions:
      - name: fina_pk_issuerid
        description: "ISSUERID for financials"
        expr: "ISSUERID"
        data_type: "NUMBER(38,0)"
      - name: fina_pk_financial_id
        description: "FINANCIAL_ID for financials"
        expr: FINANCIAL_ID
        data_type: "NUMBER(38,0)"
      - name: currency
        synonyms:
          - reporting_currency
          - currency_code
        description: Reporting currency
        expr: CURRENCY
        data_type: VARCHAR(16777216)
      - name: fiscal_period
        synonyms:
          - quarter
          - fiscal_quarter
          - period
          - q
        description: "Fiscal period (FY for annual, Q1-Q4 for quarterly, Q2_YTD/Q3_YTD for cumulative year-to-date)"
        expr: FISCAL_PERIOD
        data_type: VARCHAR(16777216)
        is_enum: true
        sample_values:
          - "Q1"
          - "Q2"
          - "Q3"
          - "Q4"
          - "FY"
      - name: fiscal_year
        synonyms:
          - year
          - fy
        description: Fiscal year from SEC filing
        expr: FISCAL_YEAR
        data_type: "NUMBER(4,0)"
      - name: period_type
        synonyms:
          - row_type
          - reporting_period_type
        description: "Reporting period type. CRITICAL: For fiscal year totals filter period_type='annual'. For single quarter data filter period_type='quarterly'. Never aggregate across different period_types — cumulative_ytd overlaps with quarterly."
        expr: PERIOD_TYPE
        data_type: VARCHAR(18)
        is_enum: true
        sample_values:
          - "annual"
          - "quarterly"
          - "cumulative_ytd"
          - "balance_sheet_only"
      - name: annual_figures
        description: "Filter: full fiscal-year figures from annual filings, one row per company per fiscal year. Use for annual trends and year-over-year comparisons."
        expr: PERIOD_TYPE = 'annual'
        data_type: BOOLEAN
        labels:
          - filter
    facts:
      - name: capex
        description: "Capital expenditures"
        expr: CAPEX
        data_type: FLOAT
        access_modifier: public_access
      - name: cash_and_equivalents
        description: "Cash and cash equivalents from balance sheet"
        expr: CASH_AND_EQUIVALENTS
        data_type: FLOAT
        access_modifier: public_access
      - name: current_ratio
        description: "Current assets divided by current liabilities"
        expr: CURRENT_RATIO
        data_type: FLOAT
        access_modifier: public_access
      - name: debt_to_equity
        description: "Total debt divided by stockholders equity"
        expr: DEBT_TO_EQUITY
        data_type: FLOAT
        access_modifier: public_access
      - name: ebitda
        description: "Earnings before interest, taxes, depreciation, and amortisation"
        expr: EBITDA
        data_type: FLOAT
        access_modifier: public_access
      - name: eps_basic
        description: "Basic earnings per share"
        expr: EPS_BASIC
        data_type: FLOAT
        access_modifier: public_access
      - name: eps_diluted
        description: "Diluted earnings per share"
        expr: EPS_DILUTED
        data_type: FLOAT
        access_modifier: public_access
      - name: estimated_customer_count
        description: "Estimated customer count (heuristic)"
        expr: ESTIMATED_CUSTOMER_COUNT
        data_type: FLOAT
        access_modifier: public_access
      - name: estimated_nrr_pct
        description: "Estimated net revenue retention rate"
        expr: ESTIMATED_NRR_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: free_cash_flow
        description: "Operating cash flow minus capex"
        expr: FREE_CASH_FLOW
        data_type: FLOAT
        access_modifier: public_access
      - name: gross_margin_pct
        description: "Gross margin as percentage of revenue"
        expr: GROSS_MARGIN_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: gross_profit
        description: "Revenue minus cost of revenue"
        expr: GROSS_PROFIT
        data_type: FLOAT
        access_modifier: public_access
      - name: long_term_debt
        description: "Long-term debt from balance sheet"
        expr: LONG_TERM_DEBT
        data_type: FLOAT
        access_modifier: public_access
      - name: net_income
        description: "Bottom-line net income"
        expr: NET_INCOME
        data_type: FLOAT
        access_modifier: public_access
      - name: net_margin_pct
        description: "Net margin as percentage of revenue"
        expr: NET_MARGIN_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: operating_cash_flow
        description: "Cash flow from operations"
        expr: OPERATING_CASH_FLOW
        data_type: FLOAT
        access_modifier: public_access
      - name: operating_income
        description: "Income from core operations"
        expr: OPERATING_INCOME
        data_type: FLOAT
        access_modifier: public_access
      - name: operating_margin_pct
        description: "Operating margin as percentage of revenue"
        expr: OPERATING_MARGIN_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: rd_expense
        description: "Research and development expense"
        expr: RD_EXPENSE
        data_type: FLOAT
        access_modifier: public_access
      - name: revenue
        description: "Total revenue from SEC filings (actual USD)"
        expr: REVENUE
        data_type: FLOAT
        access_modifier: public_access
      - name: revenue_growth_pct
        description: "Year-over-year revenue growth percentage"
        expr: REVENUE_GROWTH_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: roa_pct
        description: "Return on assets as percentage"
        expr: ROA_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: roe_pct
        description: "Return on equity as percentage"
        expr: ROE_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: tam
        description: "Total addressable market estimate"
        expr: TAM
        data_type: FLOAT
        access_modifier: public_access
      - name: total_assets
        description: "Total assets from balance sheet"
        expr: TOTAL_ASSETS
        data_type: FLOAT
        access_modifier: public_access
      - name: total_equity
        description: "Total shareholders equity"
        expr: TOTAL_EQUITY
        data_type: FLOAT
        access_modifier: public_access
      - name: total_liabilities
        description: "Total liabilities from balance sheet"
        expr: TOTAL_LIABILITIES
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_current_ratio
        synonyms:
          - current_ratio
          - liquidity_ratio
        description: Current ratio
        expr: AVG(current_ratio)
        access_modifier: public_access
      - name: average_debt_to_equity
        synonyms:
          - leverage
          - d_e_ratio
        description: Debt to equity ratio
        expr: AVG(debt_to_equity)
        access_modifier: public_access
      - name: average_eps_basic
        synonyms:
          - eps
          - earnings_per_share
        description: Basic earnings per share from SEC filings
        expr: AVG(eps_basic)
        access_modifier: public_access
      - name: average_eps_diluted
        synonyms:
          - diluted_eps
        description: Diluted earnings per share from SEC filings
        expr: AVG(eps_diluted)
        access_modifier: public_access
      - name: average_estimated_nrr_pct
        synonyms:
          - nrr
          - net_revenue_retention
          - dollar_retention
          - revenue_retention
        description: Estimated Net Revenue Retention percentage (based on revenue growth)
        expr: AVG(estimated_nrr_pct)
        access_modifier: public_access
      - name: average_gross_margin_pct
        synonyms:
          - gross_margin
        description: Gross margin percentage
        expr: AVG(gross_margin_pct)
        access_modifier: public_access
      - name: average_net_margin_pct
        synonyms:
          - net_margin
          - profit_margin
        description: Net profit margin percentage
        expr: AVG(net_margin_pct)
        access_modifier: public_access
      - name: average_operating_margin_pct
        synonyms:
          - operating_margin
          - op_margin
        description: Operating margin percentage
        expr: AVG(operating_margin_pct)
        access_modifier: public_access
      - name: average_revenue_growth_pct
        synonyms:
          - revenue_growth
          - growth_rate
          - yoy_growth
        description: Year-over-year revenue growth percentage
        expr: AVG(revenue_growth_pct)
        access_modifier: public_access
      - name: average_roa_pct
        synonyms:
