  - name: theses
    synonyms:
      - investment_thesis
      - research_thesis
      - thesis
    description: "Active and historical investment theses with recommendations, key assumptions, conviction levels, health status, and price targets"
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: FACT_RESEARCH_THESES
    primary_key:
      columns:
        - thes_pk_thesis_id
    dimensions:
      - name: thes_pk_thesis_id
        description: "THESIS_ID for theses"
        expr: THESIS_ID
        data_type: "NUMBER(38,0)"
      - name: thes_pk_issuerid
        description: "ISSUERID for theses"
        expr: ISSUERID
        data_type: "NUMBER(38,0)"
      - name: thesis_ticker
        synonyms:
          - ticker
          - symbol
        description: Ticker symbol for the thesis company
        expr: TICKER
        data_type: VARCHAR(20)
      - name: thesis_company_name
        synonyms:
          - company
          - company_name
        description: Company name for the thesis
        expr: COMPANY_NAME
        data_type: VARCHAR(200)
      - name: thesis_title
        description: Concise thesis title
        expr: THESIS_TITLE
        data_type: VARCHAR(500)
      - name: thesis_summary
        description: Full thesis summary and investment rationale
        expr: THESIS_SUMMARY
        data_type: VARCHAR(5000)
      - name: thesis_recommendation
        synonyms:
          - recommendation
          - rating
        description: "Investment recommendation: BUY, HOLD, or SELL"
        expr: RECOMMENDATION
        data_type: VARCHAR(20)
        sample_values:
          - "BUY"
          - "HOLD"
          - "SELL"
      - name: thesis_conviction
        synonyms:
          - conviction
        description: "Conviction level: HIGH, MEDIUM, or LOW"
        expr: CONVICTION
        data_type: VARCHAR(10)
        sample_values:
          - "HIGH"
          - "MEDIUM"
          - "LOW"
      - name: thesis_stage
        synonyms:
          - stage
          - pipeline_stage
        description: "Thesis pipeline stage: SCREENING, RESEARCH, THESIS_DRAFT, ACTIVE, or CLOSED"
        expr: STAGE
        data_type: VARCHAR(20)
        sample_values:
          - "ACTIVE"
          - "THESIS_DRAFT"
          - "RESEARCH"
          - "SCREENING"
          - "CLOSED"
      - name: thesis_health
        synonyms:
          - health
          - health_status
        description: "Thesis health: GREEN (intact), AMBER (assumptions challenged), RED (invalidated)"
        expr: HEALTH_STATUS
        data_type: VARCHAR(10)
        sample_values:
          - "GREEN"
          - "AMBER"
          - "RED"
      - name: thesis_key_assumptions
        description: "JSON array of key assumptions. Each has: assumption (text), status (VALID/CHALLENGED/INVALIDATED), evidence (supporting text)"
        expr: "KEY_ASSUMPTIONS::VARCHAR"
        data_type: VARCHAR
      - name: thesis_validation_notes
        description: Latest validation notes from analyst review
        expr: VALIDATION_NOTES
        data_type: VARCHAR(2000)
    facts:
      - name: thesis_entry_price
        description: Entry price when thesis was initiated
        expr: ENTRY_PRICE
        data_type: "NUMBER(12,2)"
      - name: thesis_target_price
        description: Price target for the thesis
        expr: TARGET_PRICE
        data_type: "NUMBER(12,2)"
      - name: thesis_stop_loss
        description: Stop-loss price level
        expr: STOP_LOSS
        data_type: "NUMBER(12,2)"
    time_dimensions:
      - name: thesis_updated_at
        description: When the thesis was last updated
        expr: UPDATED_AT
        data_type: TIMESTAMP_NTZ
      - name: thesis_last_validated
        description: When assumptions were last validated
        expr: LAST_VALIDATED
        data_type: DATE
