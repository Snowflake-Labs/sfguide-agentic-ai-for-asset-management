      - name: shares_held
        description: Number of shares held
        expr: SHARES_HELD
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: total_institutional_value
        synonyms:
          - total_institutional_market_value
        description: Total market value of institutional holdings
        expr: SUM(inst_market_value)
        access_modifier: public_access
      - name: total_shares_held
        description: Total shares held by institutions
        expr: SUM(shares_held)
        access_modifier: public_access
      - name: institution_count
        synonyms:
          - number_of_institutions
        description: Count of distinct institutional holders
        expr: COUNT(DISTINCT INSTITUTION_NAME)
        access_modifier: public_access
    time_dimensions:
      - name: filing_date
        synonyms:
          - inst_filing_date
        description: Date of 13F filing
        expr: FILING_DATE
        data_type: DATE
  - name: theses
    synonyms:
      - investment_thesis
      - research_thesis
      - thesis
    description: "Active and historical investment theses with recommendations, key assumptions, conviction levels, health status, and price targets"
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: FACT_RESEARCH_THESES
    primary_key:
      columns:
        - thes_pk_thesis_id
    dimensions:
      - name: thes_pk_thesis_id
        description: "THESIS_ID for theses"
        expr: THESIS_ID
        data_type: "NUMBER(38,0)"
      - name: thes_pk_issuerid
        description: "ISSUERID for theses"
        expr: ISSUERID
        data_type: "NUMBER(38,0)"
      - name: thesis_ticker
        synonyms:
          - ticker
          - symbol
        description: Ticker symbol for the thesis company
        expr: TICKER
        data_type: VARCHAR(20)
      - name: thesis_company_name
        description: "Company name as entered on the research thesis, for display only. To filter theses by company, use the issuers table's company_name (joined to theses) or thesis_ticker."
        expr: COMPANY_NAME
        data_type: VARCHAR(200)
      - name: thesis_title
        description: Concise thesis title
        expr: THESIS_TITLE
        data_type: VARCHAR(500)
      - name: thesis_summary
        description: Full thesis summary and investment rationale
        expr: THESIS_SUMMARY
        data_type: VARCHAR(5000)
      - name: thesis_recommendation
        synonyms:
          - recommendation
          - rating
        description: "Investment recommendation: BUY, HOLD, or SELL"
        expr: RECOMMENDATION
        data_type: VARCHAR(20)
        sample_values:
          - "BUY"
          - "HOLD"
          - "SELL"
      - name: thesis_conviction
        synonyms:
          - conviction
        description: "Conviction level: HIGH, MEDIUM, or LOW"
        expr: CONVICTION
        data_type: VARCHAR(10)
        sample_values:
          - "HIGH"
          - "MEDIUM"
          - "LOW"
      - name: thesis_stage
        synonyms:
          - stage
          - pipeline_stage
        description: "Thesis pipeline stage: SCREENING, RESEARCH, THESIS_DRAFT, ACTIVE, or CLOSED"
        expr: STAGE
        data_type: VARCHAR(20)
        sample_values:
          - "ACTIVE"
          - "THESIS_DRAFT"
          - "RESEARCH"
          - "SCREENING"
          - "CLOSED"
      - name: thesis_health
        synonyms:
          - health
          - health_status
        description: "Thesis health: GREEN (intact), AMBER (assumptions challenged), RED (invalidated)"
        expr: HEALTH_STATUS
        data_type: VARCHAR(10)
        sample_values:
          - "GREEN"
          - "AMBER"
          - "RED"
      - name: thesis_key_assumptions
        description: "JSON array of key assumptions. Each has: assumption (text), status (VALID/CHALLENGED/INVALIDATED), evidence (supporting text)"
        expr: "KEY_ASSUMPTIONS::VARCHAR"
        data_type: VARCHAR
      - name: thesis_validation_notes
        description: Latest validation notes from analyst review
        expr: VALIDATION_NOTES
        data_type: VARCHAR(2000)
    facts:
      - name: thesis_entry_price
        description: Entry price when thesis was initiated
        expr: ENTRY_PRICE
        data_type: "NUMBER(12,2)"
      - name: thesis_target_price
        description: Price target for the thesis
        expr: TARGET_PRICE
        data_type: "NUMBER(12,2)"
      - name: thesis_stop_loss
        description: Stop-loss price level
        expr: STOP_LOSS
        data_type: "NUMBER(12,2)"
    time_dimensions:
      - name: thesis_updated_at
        description: When the thesis was last updated
        expr: UPDATED_AT
        data_type: TIMESTAMP_NTZ
      - name: thesis_last_validated
        description: When assumptions were last validated
        expr: LAST_VALIDATED
        data_type: DATE
  - name: executive_compensation
    synonyms:
      - exec_pay
      - ceo_pay
      - say_on_pay
      - management_compensation
    description: Executive compensation from SEC DEF 14A proxy statements — the Summary
      Compensation Table for each named executive, by fiscal year. Use for pay-for-performance
      and say-on-pay questions, and for management alignment alongside insider trading.
      Covers 417 issuers and 2,629 executives for FY2021-2025. A component left NULL means
      the company did not report it, which is not the same as zero.
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: FACT_EXECUTIVE_COMPENSATION
    primary_key:
      columns:
        - exec_comp_id
    dimensions:
      - name: exec_comp_id
        description: Executive compensation row identifier
        expr: EXEC_COMP_ID
        data_type: "NUMBER(38,0)"
      - name: comp_issuerid
        description: Issuer ID for the compensation record
        expr: ISSUERID
        data_type: "NUMBER(38,0)"
      - name: comp_company_name
        description: "Company name as reported on the proxy statement, for display only; a few spellings differ from company legal names (e.g. CISCO SYSTEMS, INC.). To filter compensation by company, use the issuers table's company_name, which joins to this table."
        expr: COMPANY_NAME
        data_type: VARCHAR(16777216)
      - name: executive_name
        synonyms:
          - exec_name
          - officer_name
        description: Name of the named executive officer
        expr: EXECUTIVE_NAME
        data_type: VARCHAR(16777216)
      - name: executive_role
        synonyms:
          - exec_title
          - officer_role
        description: "Role as classified on the proxy: ceo, cfo, coo,
          named_executive_officer, or a former_ prefix for someone who has left the role.
          The former_ values are useful for succession and turnover questions."
        expr: EXECUTIVE_ROLE
        data_type: VARCHAR(16777216)
        is_enum: true
        sample_values:
          - "ceo"
          - "cfo"
          - "coo"
          - "named_executive_officer"
          - "former_ceo"
          - "former_cfo"
          - "former_coo"
      - name: comp_fiscal_year
        description: Fiscal year the compensation relates to, 2021 to 2025. Where a year was
          restated in a later proxy this holds the most recently filed figure.
        expr: FISCAL_YEAR
        data_type: "NUMBER(38,0)"
    facts:
      - name: salary
        description: Base salary in USD
        expr: SALARY
        data_type: NUMBER
        access_modifier: public_access
      - name: bonus
        description: Discretionary bonus in USD
        expr: BONUS
        data_type: NUMBER
        access_modifier: public_access
      - name: stock_awards
        description: Grant-date fair value of stock awards in USD
        expr: STOCK_AWARDS
        data_type: NUMBER
        access_modifier: public_access
      - name: option_awards
        description: Grant-date fair value of option awards in USD
        expr: OPTION_AWARDS
        data_type: NUMBER
        access_modifier: public_access
      - name: non_equity_incentive
        description: Non-equity incentive plan compensation in USD
        expr: NON_EQUITY_INCENTIVE
        data_type: NUMBER
        access_modifier: public_access
      - name: all_other_compensation
        description: All other compensation in USD
        expr: ALL_OTHER_COMPENSATION
        data_type: NUMBER
        access_modifier: public_access
      - name: total_compensation
        synonyms:
          - total_pay
          - total_package
        description: Total compensation as reported in the Summary Compensation Table, USD
        expr: TOTAL_COMPENSATION
        data_type: NUMBER
        access_modifier: public_access
      - name: variable_pay_ratio
        synonyms:
          - pay_at_risk
          - performance_pay_share
        description: Equity plus incentive pay divided by total compensation, as a fraction
          (0.97 = 97%). The usual proxy for how much of a package is performance-linked
          rather than fixed. Multiply by 100 when presenting as a percentage. NULL for a
          small number of filings where the reported components exceed the reported total,
          so the ratio cannot be computed reliably.
        expr: VARIABLE_PAY_RATIO
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: avg_total_compensation
        description: Average total compensation across the selected executives
        expr: AVG(total_compensation)
        access_modifier: public_access
      - name: median_total_compensation
        description: Median total compensation, more representative than the average because
          a single mega-grant can distort the mean
        expr: MEDIAN(total_compensation)
        access_modifier: public_access
      - name: avg_variable_pay_ratio
        description: Average share of pay that is performance-linked
        expr: AVG(variable_pay_ratio)
        access_modifier: public_access
      - name: executive_count
        description: Number of executive-year records
        expr: COUNT(*)
        access_modifier: public_access
