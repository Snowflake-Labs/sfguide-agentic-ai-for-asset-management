name: SAM_RESEARCH_VIEW
description: "Consolidated research domain view for company financial analysis. Covers SEC financial statements (income, balance sheet, cash flow), analyst estimates and consensus (revenue, earnings, price targets), revenue segments (geographic and business breakdowns), insider trading (Form 4 transactions), and institutional holdings (13F filings). Financial data from SEC 10-K/10-Q via SNOWFLAKE_PUBLIC_DATA_FREE."
tables:
  - name: analysts
    synonyms:
      - research_analysts
    description: Analyst information
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: DIM_ANALYST
    primary_key:
      columns:
        - anal_pk_analyst_id
    dimensions:
      - name: anal_pk_broker_id
        description: "BROKER_ID for analysts"
        expr: "BROKER_ID"
        data_type: "NUMBER(38,0)"
      - name: anal_pk_analyst_id
        description: "ANALYST_ID for analysts"
        expr: ANALYST_ID
        data_type: "NUMBER(38,0)"
      - name: analyst_name
        synonyms:
          - analyst
          - research_analyst
        description: Analyst name
        expr: ANALYST_NAME
        data_type: VARCHAR(17)
      - name: sector_coverage
        synonyms:
          - sector
          - coverage_sector
        description: Analyst sector coverage
        expr: SECTOR_COVERAGE
        data_type: VARCHAR(11)
  - name: analyst_estimates
    synonyms:
      - analyst_data
      - price_targets
      - ratings
    description: Individual analyst estimates including price targets and ratings
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: FACT_ESTIMATE_DATA
    primary_key:
      columns:
        - anal_pk_estimate_id
    dimensions:
      - name: anal_pk_issuerid
        description: "ISSUERID for analyst_estimates"
        expr: "ISSUERID"
        data_type: "NUMBER(38,0)"
      - name: anal_pk_broker_id
        description: "BROKER_ID for analyst_estimates"
        expr: "BROKER_ID"
        data_type: "NUMBER(38,0)"
      - name: anal_pk_analyst_id
        description: "ANALYST_ID for analyst_estimates"
        expr: "ANALYST_ID"
        data_type: "NUMBER(38,0)"
      - name: anal_pk_estimate_id
        description: "ESTIMATE_ID for analyst_estimates"
        expr: ESTIMATE_ID
        data_type: "NUMBER(38,0)"
    metrics:
      - name: avg_price_target
        synonyms:
          - price_target
          - target_price
          - pt
        description: Average analyst price target
        expr: AVG(CASE WHEN DATA_ITEM_ID = 5005 THEN DATA_VALUE END)
        access_modifier: public_access
      - name: avg_rating
        synonyms:
          - rating
          - analyst_rating
          - average_rating
        description: "Average analyst rating (1=Buy, 2=Outperform, 3=Hold, 4=Underperform, 5=Sell)"
        expr: AVG(CASE WHEN DATA_ITEM_ID = 5006 THEN DATA_VALUE END)
        access_modifier: public_access
      - name: estimate_count
        synonyms:
          - analyst_count
        description: Count of analyst estimates
        expr: COUNT(ESTIMATE_ID)
        access_modifier: public_access
      - name: max_price_target
        synonyms:
          - high_price_target
          - bull_target
        description: Highest analyst price target
        expr: MAX(CASE WHEN DATA_ITEM_ID = 5005 THEN DATA_VALUE END)
        access_modifier: public_access
      - name: min_price_target
        synonyms:
          - low_price_target
          - bear_target
        description: Lowest analyst price target
        expr: MIN(CASE WHEN DATA_ITEM_ID = 5005 THEN DATA_VALUE END)
        access_modifier: public_access
  - name: brokers
    synonyms:
      - sell_side
      - research_firms
    description: Broker/research firm information
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: DIM_BROKER
    primary_key:
      columns:
        - brok_pk_broker_id
    dimensions:
      - name: brok_pk_broker_id
        description: "BROKER_ID for brokers"
        expr: BROKER_ID
        data_type: "NUMBER(38,0)"
      - name: broker_name
        synonyms:
          - broker
          - research_firm
          - sell_side_firm
        description: Broker/research firm name
        expr: BROKER_NAME
        data_type: VARCHAR(134217728)
  - name: consensus
    synonyms:
      - estimates
      - forecasts
    description: Analyst consensus estimates for future periods
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: FACT_ESTIMATE_CONSENSUS
    primary_key:
      columns:
        - cons_pk_consensus_id
    dimensions:
      - name: cons_pk_issuerid
        description: "ISSUERID for consensus"
        expr: "ISSUERID"
        data_type: "NUMBER(38,0)"
      - name: cons_pk_consensus_id
        description: "CONSENSUS_ID for consensus"
        expr: CONSENSUS_ID
        data_type: "NUMBER(38,0)"
      - name: estimate_type
        synonyms:
          - metric_type
          - consensus_metric
        description: "Type of consensus estimate: Revenue, Net Income, EBITDA, TAM, Customer Count, NRR. CRITICAL: Always filter or group by estimate_type when querying consensus data — different types have vastly different scales."
        expr: ESTIMATE_TYPE
        data_type: VARCHAR(16777216)
        is_enum: true
        sample_values:
          - "REVENUE"
          - "EPS"
          - "PRICE_TARGET"
    facts:
      - name: consensus_high
        description: "Highest analyst estimate"
        expr: CONSENSUS_HIGH
        data_type: FLOAT
        access_modifier: public_access
      - name: consensus_low
        description: "Lowest analyst estimate"
        expr: CONSENSUS_LOW
        data_type: FLOAT
        access_modifier: public_access
      - name: consensus_mean
        description: "Mean analyst consensus estimate"
        expr: CONSENSUS_MEAN
        data_type: FLOAT
        access_modifier: public_access
      - name: num_estimates
        description: "Number of analyst estimates"
        expr: NUM_ESTIMATES
        data_type: "NUMBER(20,0)"
        access_modifier: public_access
    metrics:
      - name: average_consensus_mean
        synonyms:
          - consensus
          - mean_estimate
          - average_estimate
        description: Consensus mean estimate value
        expr: AVG(consensus_mean)
        access_modifier: public_access
      - name: average_num_estimates
        synonyms:
          - analyst_coverage
          - coverage_count
          - number_of_analysts
        description: Average number of analyst estimates
        expr: AVG(num_estimates)
        access_modifier: public_access
      - name: max_consensus_high
        synonyms:
          - high_estimate
          - bull_case
          - optimistic_estimate
        description: Highest consensus estimate
        expr: MAX(consensus_high)
        access_modifier: public_access
      - name: min_consensus_low
        synonyms:
          - low_estimate
          - bear_case
          - pessimistic_estimate
        description: Lowest consensus estimate
        expr: MIN(consensus_low)
        access_modifier: public_access
  - name: financials
    synonyms:
      - financial_data
      - statements
      - fundamentals
      - sec_financials
    description: "Real SEC financial statement data from 10-K and 10-Q filings including income statement, balance sheet, and cash flow metrics"
    base_table:
      database: {{DATABASE}}
      schema: MARKET_DATA
      table: FACT_SEC_FINANCIALS
    primary_key:
      columns:
        - fina_pk_financial_id
    dimensions:
      - name: fina_pk_issuerid
        description: "ISSUERID for financials"
        expr: "ISSUERID"
        data_type: "NUMBER(38,0)"
      - name: fina_pk_financial_id
        description: "FINANCIAL_ID for financials"
        expr: FINANCIAL_ID
        data_type: "NUMBER(38,0)"
      - name: currency
        synonyms:
          - reporting_currency
          - currency_code
        description: Reporting currency
        expr: CURRENCY
        data_type: VARCHAR(16777216)
      - name: fiscal_period
        synonyms:
          - quarter
          - fiscal_quarter
          - period
          - q
        description: "Fiscal period (FY for annual, Q1-Q4 for quarterly, Q2_YTD/Q3_YTD for cumulative year-to-date)"
        expr: FISCAL_PERIOD
        data_type: VARCHAR(16777216)
        is_enum: true
        sample_values:
          - "Q1"
          - "Q2"
          - "Q3"
          - "Q4"
          - "FY"
      - name: fiscal_year
        synonyms:
          - year
          - fy
        description: Fiscal year from SEC filing
        expr: FISCAL_YEAR
        data_type: "NUMBER(4,0)"
      - name: period_type
        synonyms:
          - row_type
          - reporting_period_type
        description: "Reporting period type. CRITICAL: For fiscal year totals filter period_type='annual'. For single quarter data filter period_type='quarterly'. Never aggregate across different period_types — cumulative_ytd overlaps with quarterly."
        expr: PERIOD_TYPE
        data_type: VARCHAR(18)
        is_enum: true
        sample_values:
          - "annual"
          - "quarterly"
          - "cumulative_ytd"
          - "balance_sheet_only"
    facts:
      - name: capex
        description: "Capital expenditures"
        expr: CAPEX
        data_type: FLOAT
        access_modifier: public_access
      - name: cash_and_equivalents
        description: "Cash and cash equivalents from balance sheet"
        expr: CASH_AND_EQUIVALENTS
        data_type: FLOAT
        access_modifier: public_access
      - name: current_ratio
        description: "Current assets divided by current liabilities"
        expr: CURRENT_RATIO
        data_type: FLOAT
        access_modifier: public_access
      - name: debt_to_equity
        description: "Total debt divided by stockholders equity"
        expr: DEBT_TO_EQUITY
        data_type: FLOAT
        access_modifier: public_access
      - name: ebitda
        description: "Earnings before interest, taxes, depreciation, and amortisation"
        expr: EBITDA
        data_type: FLOAT
        access_modifier: public_access
      - name: eps_basic
        description: "Basic earnings per share"
        expr: EPS_BASIC
        data_type: FLOAT
        access_modifier: public_access
      - name: eps_diluted
        description: "Diluted earnings per share"
        expr: EPS_DILUTED
        data_type: FLOAT
        access_modifier: public_access
      - name: estimated_customer_count
        description: "Estimated customer count (heuristic)"
        expr: ESTIMATED_CUSTOMER_COUNT
        data_type: FLOAT
        access_modifier: public_access
      - name: estimated_nrr_pct
        description: "Estimated net revenue retention rate"
        expr: ESTIMATED_NRR_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: free_cash_flow
        description: "Operating cash flow minus capex"
        expr: FREE_CASH_FLOW
        data_type: FLOAT
        access_modifier: public_access
      - name: gross_margin_pct
        description: "Gross margin as percentage of revenue"
        expr: GROSS_MARGIN_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: gross_profit
        description: "Revenue minus cost of revenue"
        expr: GROSS_PROFIT
        data_type: FLOAT
        access_modifier: public_access
      - name: long_term_debt
        description: "Long-term debt from balance sheet"
        expr: LONG_TERM_DEBT
        data_type: FLOAT
        access_modifier: public_access
      - name: net_income
        description: "Bottom-line net income"
        expr: NET_INCOME
        data_type: FLOAT
        access_modifier: public_access
      - name: net_margin_pct
        description: "Net margin as percentage of revenue"
        expr: NET_MARGIN_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: operating_cash_flow
        description: "Cash flow from operations"
        expr: OPERATING_CASH_FLOW
        data_type: FLOAT
        access_modifier: public_access
      - name: operating_income
        description: "Income from core operations"
        expr: OPERATING_INCOME
        data_type: FLOAT
        access_modifier: public_access
      - name: operating_margin_pct
        description: "Operating margin as percentage of revenue"
        expr: OPERATING_MARGIN_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: rd_expense
        description: "Research and development expense"
        expr: RD_EXPENSE
        data_type: FLOAT
        access_modifier: public_access
      - name: revenue
        description: "Total revenue from SEC filings (actual USD)"
        expr: REVENUE
        data_type: FLOAT
        access_modifier: public_access
      - name: revenue_growth_pct
        description: "Year-over-year revenue growth percentage"
        expr: REVENUE_GROWTH_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: roa_pct
        description: "Return on assets as percentage"
        expr: ROA_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: roe_pct
        description: "Return on equity as percentage"
        expr: ROE_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: tam
        description: "Total addressable market estimate"
        expr: TAM
        data_type: FLOAT
        access_modifier: public_access
      - name: total_assets
        description: "Total assets from balance sheet"
        expr: TOTAL_ASSETS
        data_type: FLOAT
        access_modifier: public_access
      - name: total_equity
        description: "Total shareholders equity"
        expr: TOTAL_EQUITY
        data_type: FLOAT
        access_modifier: public_access
      - name: total_liabilities
        description: "Total liabilities from balance sheet"
        expr: TOTAL_LIABILITIES
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_current_ratio
        synonyms:
          - current_ratio
          - liquidity_ratio
        description: Current ratio
        expr: AVG(current_ratio)
        access_modifier: public_access
      - name: average_debt_to_equity
        synonyms:
          - leverage
          - d_e_ratio
        description: Debt to equity ratio
        expr: AVG(debt_to_equity)
        access_modifier: public_access
      - name: average_eps_basic
        synonyms:
          - eps
          - earnings_per_share
        description: Basic earnings per share from SEC filings
        expr: AVG(eps_basic)
        access_modifier: public_access
      - name: average_eps_diluted
        synonyms:
          - diluted_eps
        description: Diluted earnings per share from SEC filings
        expr: AVG(eps_diluted)
        access_modifier: public_access
      - name: average_estimated_nrr_pct
        synonyms:
          - nrr
          - net_revenue_retention
          - dollar_retention
          - revenue_retention
        description: Estimated Net Revenue Retention percentage (based on revenue growth)
        expr: AVG(estimated_nrr_pct)
        access_modifier: public_access
      - name: average_gross_margin_pct
        synonyms:
          - gross_margin
        description: Gross margin percentage
        expr: AVG(gross_margin_pct)
        access_modifier: public_access
      - name: average_net_margin_pct
        synonyms:
          - net_margin
          - profit_margin
        description: Net profit margin percentage
        expr: AVG(net_margin_pct)
        access_modifier: public_access
      - name: average_operating_margin_pct
        synonyms:
          - operating_margin
          - op_margin
        description: Operating margin percentage
        expr: AVG(operating_margin_pct)
        access_modifier: public_access
      - name: average_revenue_growth_pct
        synonyms:
          - revenue_growth
          - growth_rate
          - yoy_growth
        description: Year-over-year revenue growth percentage
        expr: AVG(revenue_growth_pct)
        access_modifier: public_access
      - name: average_roa_pct
        synonyms:
          - roa
          - return_on_assets
        description: Return on assets percentage
        expr: AVG(roa_pct)
        access_modifier: public_access
      - name: average_roe_pct
        synonyms:
          - roe
          - return_on_equity
        description: Return on equity percentage
        expr: AVG(roe_pct)
        access_modifier: public_access
      - name: issuer_count
        synonyms:
          - issuers
          - companies
          - num_companies
        description: Number of issuers/companies
        expr: COUNT(DISTINCT FINANCIAL_ID)
        access_modifier: public_access
      - name: period_count
        synonyms:
          - periods
          - fiscal_periods
          - record_count
        description: Number of fiscal periods
        expr: COUNT(DISTINCT FINANCIAL_ID)
        access_modifier: public_access
      - name: total_capex
        synonyms:
          - capital_expenditure
          - capex
        description: Capital expenditure from SEC filings
        expr: SUM(CAPEX)
        access_modifier: public_access
      - name: total_cash_and_equivalents
        synonyms:
          - cash
          - cash_equivalents
          - liquidity
        description: Cash and cash equivalents from SEC filings
        expr: SUM(cash_and_equivalents)
        access_modifier: public_access
      - name: total_ebitda
        synonyms:
          - ebitda
          - operating_ebitda
        description: EBITDA (Operating Income + D&A)
        expr: SUM(EBITDA)
        access_modifier: public_access
      - name: total_estimated_customer_count
        synonyms:
          - customers
          - total_customers
          - customer_base
          - customer_count
        description: Estimated customer count (Revenue / Average Revenue Per Customer by industry)
        expr: SUM(estimated_customer_count)
        access_modifier: public_access
      - name: total_free_cash_flow
        synonyms:
          - fcf
        description: Free cash flow (OCF - CapEx)
        expr: SUM(free_cash_flow)
        access_modifier: public_access
      - name: total_gross_profit
        synonyms:
          - gross_profit
          - gross_margin_dollars
        description: Gross profit from SEC filings
        expr: SUM(gross_profit)
        access_modifier: public_access
      - name: total_long_term_debt
        synonyms:
          - debt
        description: Long-term debt from SEC filings
        expr: SUM(long_term_debt)
        access_modifier: public_access
      - name: total_net_income
        synonyms:
          - earnings
          - profit
          - bottom_line
        description: Net income from SEC filings
        expr: SUM(net_income)
        access_modifier: public_access
      - name: total_operating_cash_flow
        synonyms:
          - cfo
          - ocf
        description: Cash from operations from SEC filings
        expr: SUM(operating_cash_flow)
        access_modifier: public_access
      - name: total_operating_income
        synonyms:
          - ebit
          - operating_profit
        description: Operating income from SEC filings
        expr: SUM(operating_income)
        access_modifier: public_access
      - name: total_rd_expense
        synonyms:
          - rd
          - research_development
        description: R&D expense from SEC filings
        expr: SUM(rd_expense)
        access_modifier: public_access
      - name: total_revenue
        synonyms:
          - revenue
          - sales
          - top_line
        description: Total revenue from SEC filings
        expr: SUM(REVENUE)
        access_modifier: public_access
      - name: total_tam
        synonyms:
          - tam
          - total_addressable_market
          - market_size
          - addressable_market
        description: Total Addressable Market (estimated as Revenue x Industry Multiplier)
        expr: SUM(TAM)
        access_modifier: public_access
      - name: sum_total_assets
        synonyms:
          - assets
        description: Total assets from SEC filings
        expr: SUM(total_assets)
        access_modifier: public_access
      - name: sum_total_equity
        synonyms:
          - stockholders_equity
          - equity
          - book_value
        description: Total stockholders equity from SEC filings
        expr: SUM(total_equity)
        access_modifier: public_access
      - name: sum_total_liabilities
        synonyms:
          - liabilities
        description: Total liabilities from SEC filings
        expr: SUM(total_liabilities)
        access_modifier: public_access
    time_dimensions:
      - name: period_end_date
        synonyms:
          - period_end
          - quarter_end
          - reporting_date
        description: Period end date from SEC filing
        expr: PERIOD_END_DATE
        data_type: DATE
  - name: issuers
    synonyms:
      - companies
      - firms
      - corporations
    description: Company/issuer master data (single source of truth for company information)
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: DIM_ISSUER
    primary_key:
      columns:
        - issu_pk_issuerid
    dimensions:
      - name: issu_pk_issuerid
        description: "ISSUERID for issuers"
        expr: ISSUERID
        data_type: "NUMBER(38,0)"
      - name: cik
        synonyms:
          - cik_number
          - sec_id
          - edgar_id
        description: SEC Central Index Key for EDGAR filings
        expr: CIK
        data_type: VARCHAR(16777216)
      - name: company_name
        synonyms:
          - company
          - firm_name
          - corporation
          - issuer
          - entity
          - name
        description: "Company legal name for filtering (e.g., MICROSOFT CORP, APPLE INC., NVIDIA CORP)"
        expr: LegalName
        data_type: VARCHAR(16777216)
      - name: country
        synonyms:
          - country
          - domicile
          - country_of_incorporation
        description: Country of incorporation (2-letter ISO code)
        expr: CountryOfIncorporation
        data_type: VARCHAR(16777216)
      - name: industry
        synonyms:
          - industry
          - business_description
        description: Industry classification description (SIC)
        expr: SIC_DESCRIPTION
        data_type: VARCHAR(16777216)
      - name: sector
        synonyms:
          - gics
          - gics_sector
          - sector
          - sector_classification
        description: "GICS Level 1 sector classification (e.g., Information Technology, Health Care, Financials)"
        expr: GICS_SECTOR
        data_type: VARCHAR(16777216)
      - name: ticker
        synonyms:
          - ticker
          - symbol
          - stock_symbol
          - stock
        description: "Stock ticker symbol for filtering (e.g., MSFT, AAPL, NVDA)"
        expr: PrimaryTicker
        data_type: VARCHAR(16777216)
  - name: segments
    synonyms:
      - revenue_segments
      - geographic_segments
      - business_segments
    description: "SEC revenue segment breakdowns by geography, business unit, customer, and legal entity"
    base_table:
      database: "{{DATABASE}}"
      schema: MARKET_DATA
      table: FACT_SEC_SEGMENTS
    primary_key:
      columns:
        - seg_segment_id
    dimensions:
      - name: seg_segment_id
        description: Segment record identifier
        expr: SEGMENT_ID
        data_type: "NUMBER(38,0)"
      - name: seg_issuer_id
        description: Issuer ID for segment data
        expr: ISSUERID
        data_type: "NUMBER(38,0)"
      - name: business_segment
        description: Business segment name
        expr: BUSINESS_SEGMENT
        data_type: VARCHAR(16777216)
      - name: business_sub_segment
        description: Business sub-segment name
        expr: BUSINESS_SUBSEGMENT
        data_type: VARCHAR(16777216)
      - name: segment_customer
        synonyms:
          - customer
        description: Customer segment name
        expr: CUSTOMER
        data_type: VARCHAR(16777216)
      - name: seg_fiscal_period
        description: Fiscal period for segment
        expr: FISCAL_PERIOD
        data_type: VARCHAR(16777216)
      - name: seg_fiscal_year
        description: Fiscal year for segment
        expr: FISCAL_YEAR
        data_type: "NUMBER(38,0)"
      - name: geography
        synonyms:
          - region
          - geographic_region
        description: "Geographic segment (Europe, Americas, Asia Pacific)"
        expr: GEOGRAPHY
        data_type: VARCHAR(16777216)
      - name: legal_entity
        description: Legal entity name
        expr: LEGAL_ENTITY
        data_type: VARCHAR(16777216)
    facts:
      - name: segment_revenue
        description: Revenue for this segment
        expr: SEGMENT_REVENUE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: total_segment_revenue
        synonyms:
          - segment_total
        description: Total segment revenue
        expr: SUM(segment_revenue)
        access_modifier: public_access
      - name: segment_count
        description: Number of distinct segments
        expr: COUNT(DISTINCT SEGMENT_ID)
        access_modifier: public_access
    time_dimensions:
      - name: seg_period_end_date
        description: Period end date for segment data
        expr: PERIOD_END_DATE
        data_type: DATE
  - name: insider_transactions
    synonyms:
      - insider_trading
      - form_4
      - insider_buys_sells
    description: "SEC Form 4 insider trading transactions: executive buys/sells, volumes, ownership changes"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_INSIDER_TRANSACTIONS
    primary_key:
      columns:
        - insider_tx_id
    dimensions:
      - name: insider_tx_id
        description: Insider transaction identifier
        expr: INSIDER_TX_ID
        data_type: "NUMBER(38,0)"
      - name: insider_issuer_name
        synonyms:
          - insider_company
        description: Company name for insider transaction
        expr: ISSUER_NAME
        data_type: VARCHAR(16777216)
      - name: insider_ticker
        description: Ticker for insider transaction
        expr: TICKER
        data_type: VARCHAR(16777216)
      - name: form_type
        description: SEC form type
        expr: FORM_TYPE
        data_type: VARCHAR(16777216)
      - name: security_type
        description: Security type traded
        expr: SECURITY_TYPE
        data_type: VARCHAR(16777216)
      - name: transaction_type
        description: Transaction type code
        expr: TRANSACTION_TYPE
        data_type: VARCHAR(16777216)
      - name: transaction_action
        synonyms:
          - buy_sell
        description: "Transaction action: Purchase, Sale, etc."
        expr: TRANSACTION_ACTION
        data_type: VARCHAR(16777216)
        is_enum: true
        sample_values:
          - "BUY"
          - "SELL"
      - name: insider_ownership
        description: Direct or indirect ownership
        expr: OWNERSHIP
        data_type: VARCHAR(16777216)
    facts:
      - name: transaction_shares
        description: Number of shares in transaction
        expr: TRANSACTION_SHARES
        data_type: FLOAT
        access_modifier: public_access
      - name: transaction_price
        description: Price per share
        expr: TRANSACTION_PRICE_PER_SHARE
        data_type: FLOAT
        access_modifier: public_access
      - name: post_transaction_shares
        description: Shares owned after transaction
        expr: POST_TRANSACTION_SHARES_OWNED
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: total_insider_shares
        description: Total shares transacted
        expr: SUM(transaction_shares)
        access_modifier: public_access
      - name: total_insider_value
        synonyms:
          - insider_transaction_value
        description: Total value of insider transactions
        expr: SUM(transaction_shares * transaction_price)
        access_modifier: public_access
      - name: insider_transaction_count
        description: Number of insider transactions
        expr: COUNT(*)
        access_modifier: public_access
    time_dimensions:
      - name: transaction_date
        description: Date of insider transaction
        expr: TRANSACTION_DATE
        data_type: DATE
  - name: institutional_holdings
