module_custom_instructions:
  sql_generation: "CRITICAL: NEVER aggregate income statement metrics across different period_type values — cumulative_ytd overlaps quarterly and will double-count. Balance sheet metrics are point-in-time and safe with any period_type. CONSENSUS ESTIMATES: ALWAYS filter estimate_type when querying consensus data — mixing Revenue ($100B+) with NRR (90-140%) produces meaningless results. Retrieve ALL estimate types in one query using GROUP BY estimate_type. Use total_revenue, total_net_income, total_ebitda, total_tam, average_gross_margin_pct, average_operating_margin_pct, average_net_margin_pct, average_revenue_growth_pct as needed. Always order by fiscal_year descending. PRESENTATION: results are displayed exactly as returned, so round in the query and cast to a fixed-point decimal - CAST(ROUND(x, 1) AS DECIMAL(38, 1)) - because a rounded FLOAT still displays as 215.90000000000001. Currency in billions to one decimal (millions when under 1B), percentages on a 0-100 scale to one decimal, per-share values to two decimals. LATEST PERIOD: to restrict to the latest fiscal year or rating date, compute the maximum in a CTE and join to it (see the verified queries). Never put a MAX() subquery in the WHERE clause - it can compile to a correlated aggregate and fail. OUTPUT COLUMNS: when a question is about one company or one period, do not return a column that holds the same value on every row (company name, ticker, a single date) - state it in the table title instead. COMPANY NAMES: filter a company only with = on its exact stored legal name (from the company_name search lookup) or its ticker, including preliminary lookups that check whether a company is covered - never LIKE or ILIKE."
  question_categorization: "If users ask about 'financials', 'fundamentals', 'revenue', 'earnings', 'margins', use financials metrics. If users ask about 'estimates' or 'consensus', use consensus table. If users ask about 'price targets' or 'ratings', use recommendations table. If users ask about 'analysts' or 'brokers', include analysts and brokers dimensions. If users ask about 'TAM', 'market size', 'addressable market', use total_tam metric (note: estimated). If users ask about 'segments', 'geographic revenue', 'business segments', use segments table. Filter fiscal_period = 'FY' for annual segment data. If users ask about 'insider trading', 'Form 4', 'executive buys/sells', use insider_transactions table. If users ask about 'institutional holdings', '13F', 'institutional ownership', 'who owns', use institutional_holdings table. If users ask about 'thesis', 'investment thesis', 'my thesis', 'validate thesis', 'assumptions', use theses table. Query by THESIS_ID if provided, otherwise by ticker/company_name and STAGE='ACTIVE'."
verified_queries:
  - name: ANNUAL_REVENUE_BY_COMPANY
    sql: "SELECT __issuers.company_name, __financials.fiscal_year, SUM(__financials.revenue) AS total_revenue, SUM(__financials.net_income) AS total_net_income, AVG(__financials.gross_margin_pct) AS average_gross_margin_pct FROM __financials JOIN __issuers ON (__financials.fina_pk_issuerid = __issuers.issu_pk_issuerid) WHERE __financials.period_type = 'annual' GROUP BY __issuers.company_name, __financials.fiscal_year ORDER BY __financials.fiscal_year DESC"
    question: What is the annual revenue for each company?
    use_as_onboarding_question: true
  - name: QUARTERLY_REVENUE
    sql: "SELECT __issuers.company_name, __financials.fiscal_year, __financials.fiscal_period, SUM(__financials.revenue) AS total_revenue, SUM(__financials.net_income) AS total_net_income FROM __financials JOIN __issuers ON (__financials.fina_pk_issuerid = __issuers.issu_pk_issuerid) WHERE __issuers.company_name = 'NVIDIA CORP' AND __financials.period_type = 'quarterly' GROUP BY __issuers.company_name, __financials.fiscal_year, __financials.fiscal_period ORDER BY __financials.fiscal_year DESC, __financials.fiscal_period"
    question: What is the quarterly revenue for NVIDIA?
    use_as_onboarding_question: false
  - name: PROFITABILITY_ANALYSIS
    sql: "SELECT __issuers.company_name, AVG(__financials.gross_margin_pct) AS average_gross_margin_pct, AVG(__financials.operating_margin_pct) AS average_operating_margin_pct, AVG(__financials.net_margin_pct) AS average_net_margin_pct, AVG(__financials.roe_pct) AS average_roe_pct FROM __financials JOIN __issuers ON (__financials.fina_pk_issuerid = __issuers.issu_pk_issuerid) WHERE __financials.period_type = 'annual' GROUP BY __issuers.company_name"
    question: What are the profitability margins?
    use_as_onboarding_question: true
  - name: revenue_CONSENSUS_ESTIMATES
    sql: "SELECT __issuers.company_name, __consensus.estimate_type, AVG(__consensus.consensus_mean) AS average_consensus_mean, MAX(__consensus.consensus_high) AS max_consensus_high, MIN(__consensus.consensus_low) AS min_consensus_low, AVG(__consensus.num_estimates) AS average_num_estimates FROM __consensus JOIN __issuers ON (__consensus.cons_pk_issuerid = __issuers.issu_pk_issuerid) WHERE __consensus.estimate_type = 'Revenue' GROUP BY __issuers.company_name, __consensus.estimate_type"
    question: What are the revenue consensus estimates?
    use_as_onboarding_question: true
  - name: EARNINGS_CONSENSUS_ESTIMATES
    sql: "SELECT __issuers.company_name, __consensus.estimate_type, AVG(__consensus.consensus_mean) AS average_consensus_mean, MAX(__consensus.consensus_high) AS max_consensus_high, MIN(__consensus.consensus_low) AS min_consensus_low FROM __consensus JOIN __issuers ON (__consensus.cons_pk_issuerid = __issuers.issu_pk_issuerid) WHERE __consensus.estimate_type = 'Net Income' GROUP BY __issuers.company_name, __consensus.estimate_type"
    question: What are the net income consensus estimates?
    use_as_onboarding_question: false
  - name: ALL_CONSENSUS_ESTIMATES_FOR_COMPANY
    sql: "SELECT __issuers.company_name, __consensus.estimate_type, AVG(__consensus.consensus_mean) AS average_consensus_mean, MAX(__consensus.consensus_high) AS max_consensus_high, MIN(__consensus.consensus_low) AS min_consensus_low, AVG(__consensus.num_estimates) AS average_num_estimates FROM __consensus JOIN __issuers ON (__consensus.cons_pk_issuerid = __issuers.issu_pk_issuerid) WHERE __issuers.company_name = 'NVIDIA CORP' GROUP BY __issuers.company_name, __consensus.estimate_type ORDER BY __consensus.estimate_type"
    question: What are all the consensus estimates for NVIDIA?
    use_as_onboarding_question: true
  - name: STREET_VIEW
    sql: "WITH latest AS (SELECT MAX(__recommendations.vintage_date) AS vintage_date FROM __recommendations WHERE __recommendations.recommendation_ticker = 'NVDA') SELECT latest.vintage_date, COUNT(DISTINCT __recommendations.recommendation_broker_name) AS brokers, COUNT_IF(__recommendations.rating IN ('Strong Buy', 'Buy')) AS buy_ratings, COUNT_IF(__recommendations.rating = 'Hold') AS hold_ratings, COUNT_IF(__recommendations.rating IN ('Sell', 'Strong Sell')) AS sell_ratings, CAST(ROUND(AVG(__recommendations.price_target), 2) AS DECIMAL(38, 2)) AS avg_price_target_usd, CAST(ROUND(MIN(__recommendations.price_target), 2) AS DECIMAL(38, 2)) AS low_price_target_usd, CAST(ROUND(MAX(__recommendations.price_target), 2) AS DECIMAL(38, 2)) AS high_price_target_usd, CAST(ROUND(AVG(__recommendations.close_price), 2) AS DECIMAL(38, 2)) AS share_price_usd, CAST(ROUND(100 * AVG(__recommendations.upside_fraction), 1) AS DECIMAL(38, 1)) AS avg_upside_pct FROM __recommendations JOIN latest ON __recommendations.vintage_date = latest.vintage_date WHERE __recommendations.recommendation_ticker = 'NVDA' GROUP BY latest.vintage_date"
    question: What is the latest street view on NVIDIA - analyst ratings, price targets and upside to the current share price?
    use_as_onboarding_question: false
  - name: GEOGRAPHIC_REVENUE_BREAKDOWN
    sql: "WITH latest AS (SELECT __segments.seg_issuer_id, MAX(__segments.seg_fiscal_year) AS fiscal_year FROM __segments JOIN __issuers ON (__segments.seg_issuer_id = __issuers.issu_pk_issuerid) WHERE __issuers.company_name = 'NVIDIA CORP' AND __segments.seg_fiscal_period = 'FY' AND __segments.geographic_revenue_breakdown GROUP BY __segments.seg_issuer_id), regions AS (SELECT latest.seg_issuer_id, latest.fiscal_year, __segments.geography, MAX(__segments.segment_revenue) AS region_revenue FROM __segments JOIN latest ON (__segments.seg_issuer_id = latest.seg_issuer_id AND __segments.seg_fiscal_year = latest.fiscal_year) WHERE __segments.seg_fiscal_period = 'FY' AND __segments.geographic_revenue_breakdown GROUP BY latest.seg_issuer_id, latest.fiscal_year, __segments.geography), filed AS (SELECT __financials.fina_pk_issuerid, __financials.fiscal_year, MAX(__financials.revenue) AS revenue FROM __financials WHERE __financials.annual_figures GROUP BY __financials.fina_pk_issuerid, __financials.fiscal_year) SELECT regions.fiscal_year, regions.geography, CAST(ROUND(regions.region_revenue / 1e9, 1) AS DECIMAL(38, 1)) AS revenue_usd_b, CAST(ROUND(100 * regions.region_revenue / filed.revenue, 1) AS DECIMAL(38, 1)) AS share_of_revenue_pct, CAST(ROUND(100 * SUM(regions.region_revenue) OVER () / filed.revenue, 1) AS DECIMAL(38, 1)) AS regions_cover_pct_of_revenue FROM regions LEFT JOIN filed ON (regions.seg_issuer_id = filed.fina_pk_issuerid AND regions.fiscal_year = filed.fiscal_year) ORDER BY revenue_usd_b DESC"
    question: How is NVIDIA's revenue split by geography in the latest fiscal year, and what share of total revenue does each region contribute?
    use_as_onboarding_question: false
  - name: ACTIVE_THESIS_FOR_COMPANY
    sql: "SELECT __theses.thesis_ticker, __theses.thesis_title, __theses.thesis_summary, __theses.thesis_recommendation, __theses.thesis_conviction, __theses.thesis_health, __theses.thesis_key_assumptions, __theses.thesis_entry_price, __theses.thesis_target_price, __theses.thesis_validation_notes, __theses.thesis_last_validated FROM __theses JOIN __issuers ON (__theses.thes_pk_issuerid = __issuers.issu_pk_issuerid) WHERE __issuers.company_name = 'APPLE INC.' AND __theses.thesis_stage = 'ACTIVE'"
    question: Show me the active investment thesis for Apple including key assumptions
    use_as_onboarding_question: false
  - name: THESIS_BY_ID
    sql: "SELECT __theses.thes_pk_thesis_id, __theses.thesis_ticker, __theses.thesis_title, __theses.thesis_summary, __theses.thesis_recommendation, __theses.thesis_conviction, __theses.thesis_health, __theses.thesis_key_assumptions, __theses.thesis_entry_price, __theses.thesis_target_price, __theses.thesis_stop_loss, __theses.thesis_validation_notes FROM __theses WHERE __theses.thes_pk_thesis_id = 1"
    question: Show me thesis with ID 1
    use_as_onboarding_question: false
  - name: CEO_PAY_RANKING
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_RESEARCH_VIEW DIMENSIONS executive_compensation.comp_company_name, executive_compensation.executive_name METRICS executive_compensation.avg_total_compensation, executive_compensation.avg_variable_pay_ratio WHERE executive_compensation.executive_role = 'ceo' AND executive_compensation.comp_fiscal_year = 2025) ORDER BY avg_total_compensation DESC LIMIT 10"
    question: Which CEOs were paid the most in FY2025 and how much of it was performance-linked?
    use_as_onboarding_question: false
  - name: MEDIAN_PAY_BY_ROLE_AND_YEAR
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_RESEARCH_VIEW DIMENSIONS executive_compensation.comp_fiscal_year, executive_compensation.executive_role METRICS executive_compensation.median_total_compensation, executive_compensation.executive_count WHERE executive_compensation.executive_role IN ('ceo', 'cfo')) ORDER BY comp_fiscal_year, executive_role"
    question: How has median CEO and CFO pay moved year on year?
    use_as_onboarding_question: false
