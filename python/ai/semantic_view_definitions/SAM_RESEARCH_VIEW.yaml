      - name: average_roe_pct
        synonyms:
          - roe
          - return_on_equity
        description: Return on equity percentage
        expr: AVG(roe_pct)
        access_modifier: public_access
      - name: issuer_count
        synonyms:
          - issuers
          - companies
          - num_companies
        description: Number of issuers/companies
        expr: COUNT(DISTINCT FINANCIAL_ID)
        access_modifier: public_access
      - name: period_count
        synonyms:
          - periods
          - fiscal_periods
          - record_count
        description: Number of fiscal periods
        expr: COUNT(DISTINCT FINANCIAL_ID)
