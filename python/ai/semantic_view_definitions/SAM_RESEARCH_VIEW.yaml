        access_modifier: public_access
      - name: total_free_cash_flow
        synonyms:
          - fcf
        description: Free cash flow (OCF - CapEx)
        expr: SUM(free_cash_flow)
        access_modifier: public_access
      - name: total_gross_profit
        synonyms:
          - gross_profit
          - gross_margin_dollars
        description: Gross profit from SEC filings
        expr: SUM(gross_profit)
        access_modifier: public_access
      - name: total_long_term_debt
        synonyms:
          - debt
        description: Long-term debt from SEC filings
        expr: SUM(long_term_debt)
        access_modifier: public_access
      - name: total_net_income
        synonyms:
          - earnings
          - profit
          - bottom_line
        description: Net income from SEC filings
        expr: SUM(net_income)
        access_modifier: public_access
      - name: total_operating_cash_flow
        synonyms:
          - cfo
          - ocf
        description: Cash from operations from SEC filings
        expr: SUM(operating_cash_flow)
        access_modifier: public_access
      - name: total_operating_income
        synonyms:
          - ebit
          - operating_profit
        description: Operating income from SEC filings
        expr: SUM(operating_income)
        access_modifier: public_access
      - name: total_rd_expense
        synonyms:
          - rd
          - research_development
        description: R&D expense from SEC filings
        expr: SUM(rd_expense)
        access_modifier: public_access
      - name: total_revenue
        synonyms:
          - revenue
          - sales
          - top_line
        description: Total revenue from SEC filings
        expr: SUM(REVENUE)
        access_modifier: public_access
      - name: total_tam
        synonyms:
          - tam
          - total_addressable_market
          - market_size
          - addressable_market
        description: Total Addressable Market (estimated as Revenue x Industry Multiplier)
        expr: SUM(TAM)
        access_modifier: public_access
      - name: sum_total_assets
        synonyms:
          - assets
        description: Total assets from SEC filings
        expr: SUM(total_assets)
        access_modifier: public_access
      - name: sum_total_equity
        synonyms:
          - stockholders_equity
          - equity
          - book_value
        description: Total stockholders equity from SEC filings
        expr: SUM(total_equity)
        access_modifier: public_access
      - name: sum_total_liabilities
        synonyms:
          - liabilities
        description: Total liabilities from SEC filings
        expr: SUM(total_liabilities)
        access_modifier: public_access
    time_dimensions:
      - name: period_end_date
        synonyms:
          - period_end
          - quarter_end
          - reporting_date
        description: Period end date from SEC filing
        expr: PERIOD_END_DATE
        data_type: DATE
  - name: issuers
    synonyms:
      - companies
      - firms
      - corporations
    description: Company/issuer master data (single source of truth for company information)
    base_table:
      database: {{DATABASE}}
      schema: CURATED
      table: DIM_ISSUER
    primary_key:
      columns:
        - issu_pk_issuerid
    dimensions:
      - name: issu_pk_issuerid
        description: "ISSUERID for issuers"
        expr: ISSUERID
        data_type: "NUMBER(38,0)"
      - name: cik
        synonyms:
          - cik_number
          - sec_id
          - edgar_id
        description: SEC Central Index Key for EDGAR filings
        expr: CIK
        data_type: VARCHAR(16777216)
      - name: company_name
        synonyms:
          - company
          - firm_name
          - corporation
          - issuer
          - entity
          - name
        description: "Company legal name exactly as stored, e.g. ELI LILLY & CO, TAIWAN SEMICONDUCTOR MANUFACTURING CO LTD, MICROSOFT CORP. Identifies the company for filtering and grouping. Users give informal names (Lilly, TSMC): look up the stored value with this column's search lookup and filter with =, never LIKE or ILIKE. If none of the returned names is the company the user meant, the company is not covered - say so rather than substituting a similar name."
        expr: LegalName
        data_type: VARCHAR(16777216)
        cortex_search_service:
          service: SAM_ISSUER_NAME_SEARCH
          literal_column: LEGALNAME
          database: {{DATABASE}}
          schema: AI
      - name: country
        synonyms:
          - country
          - domicile
          - country_of_incorporation
        description: Country of incorporation (2-letter ISO code)
        expr: CountryOfIncorporation
        data_type: VARCHAR(16777216)
      - name: industry
        synonyms:
          - industry
          - business_description
        description: Industry classification description (SIC)
        expr: SIC_DESCRIPTION
        data_type: VARCHAR(16777216)
      - name: sector
        synonyms:
          - gics
          - gics_sector
          - sector
          - sector_classification
        description: "GICS Level 1 sector classification (e.g., Information Technology, Health Care, Financials)"
        expr: GICS_SECTOR
        data_type: VARCHAR(16777216)
      - name: ticker
        synonyms:
          - ticker
          - symbol
          - stock_symbol
          - stock
        description: "Stock ticker symbol for filtering (e.g., MSFT, AAPL, NVDA)"
        expr: PrimaryTicker
        data_type: VARCHAR(16777216)
  - name: segments
    synonyms:
      - revenue_segments
      - geographic_segments
      - business_segments
    description: "SEC revenue segment breakdowns by geography, business unit, customer, and legal entity"
    base_table:
      database: "{{DATABASE}}"
      schema: MARKET_DATA
      table: FACT_SEC_SEGMENTS
    primary_key:
      columns:
        - seg_segment_id
    dimensions:
      - name: seg_segment_id
        description: Segment record identifier
        expr: SEGMENT_ID
        data_type: "NUMBER(38,0)"
      - name: seg_issuer_id
        description: Issuer ID for segment data
        expr: ISSUERID
        data_type: "NUMBER(38,0)"
      - name: business_segment
        description: "Business segment name. Many companies report several overlapping segment hierarchies at once (for example reportable segments and market platforms), so business-segment rows often add up to more than total revenue. Before presenting segments as shares of revenue or in a pie chart, check that the rows add up to total revenue."
        expr: BUSINESS_SEGMENT
        data_type: VARCHAR(16777216)
      - name: business_sub_segment
        description: Business sub-segment name
        expr: BUSINESS_SUBSEGMENT
        data_type: VARCHAR(16777216)
      - name: segment_customer
        synonyms:
          - customer
        description: Customer segment name
        expr: CUSTOMER
        data_type: VARCHAR(16777216)
      - name: seg_fiscal_period
        description: Fiscal period for segment
        expr: FISCAL_PERIOD
        data_type: VARCHAR(16777216)
      - name: seg_fiscal_year
        description: "Fiscal year for segment. To filter to the latest year, take the year from an earlier result and filter on it as a literal (seg_fiscal_year = 2026): a MAX() subquery inside the WHERE clause can fail to compile against this view."
        expr: FISCAL_YEAR
        data_type: "NUMBER(38,0)"
      - name: geography
        synonyms:
          - region
          - geographic_region
        description: "Geographic area as the company reports it, for example United States, Taiwan, or China and Hong Kong. Names and levels differ between companies, and some mix levels (Americas alongside United States)."
        expr: GEOGRAPHY
        data_type: VARCHAR(16777216)
      - name: geographic_revenue_breakdown
        description: "Filter: the geographic revenue rows, with no business segment attached - the breakdown to use for revenue by region. For many companies they add up to total revenue, but some report overlapping levels or only part of their revenue. Before presenting them as shares of revenue or in a pie chart, check that they add up to total revenue."
        expr: GEOGRAPHY IS NOT NULL AND BUSINESS_SEGMENT IS NULL
        data_type: BOOLEAN
        labels:
          - filter
      - name: legal_entity
        description: Legal entity name
        expr: LEGAL_ENTITY
        data_type: VARCHAR(16777216)
    facts:
      - name: segment_revenue
        description: Revenue for this segment
        expr: SEGMENT_REVENUE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: total_segment_revenue
        synonyms:
          - segment_total
        description: Total segment revenue
        expr: SUM(segment_revenue)
        access_modifier: public_access
      - name: segment_count
        description: Number of distinct segments
        expr: COUNT(DISTINCT SEGMENT_ID)
        access_modifier: public_access
    time_dimensions:
      - name: seg_period_end_date
        description: Period end date for segment data
        expr: PERIOD_END_DATE
        data_type: DATE
  - name: insider_transactions
    synonyms:
      - insider_trading
      - form_4
      - insider_buys_sells
    description: "SEC Form 4 insider trading transactions: executive buys/sells, volumes, ownership changes"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_INSIDER_TRANSACTIONS
    primary_key:
      columns:
        - insider_tx_id
    dimensions:
      - name: insider_tx_id
        description: Insider transaction identifier
        expr: INSIDER_TX_ID
        data_type: "NUMBER(38,0)"
      - name: insider_issuer_name
        synonyms:
          - insider_company
        description: "Company name as spelled on the insider's Form 4 filing, for display only. Spellings differ from company legal names (e.g. ELI LILLY & Co) and this table has no join to issuers, so filter insider transactions by company with insider_ticker (e.g. LLY), never by this name."
        expr: ISSUER_NAME
        data_type: VARCHAR(16777216)
      - name: insider_ticker
        description: "Ticker of the company whose insider traded, e.g. LLY, NVDA. Use this to filter insider transactions by company."
        expr: TICKER
        data_type: VARCHAR(16777216)
      - name: form_type
        description: "SEC insider form type: 4 for a change in holdings, 3 for an initial
          filing when someone becomes an insider, 5 for an annual catch-up. Suffix /A marks
          an amendment."
        expr: FORM_TYPE
        data_type: VARCHAR(16777216)
      - name: security_type
        description: Security type traded
        expr: SECURITY_TYPE
        data_type: VARCHAR(16777216)
      - name: transaction_type
        description: Transaction type code
        expr: TRANSACTION_TYPE
        data_type: VARCHAR(16777216)
      - name: transaction_action
        synonyms:
          - buy_sell
        description: "Form 4 direction flag: Acquired or Disposed. Not the same as buy/sell — most acquisitions are grants, awards and option exercises. For open-market buying or selling, also filter transaction_type to the open market purchase or sale types."
        expr: TRANSACTION_ACTION
        data_type: VARCHAR(16777216)
        is_enum: true
        sample_values:
          - "Acquired"
          - "Disposed"
      - name: insider_ownership
        description: Direct or indirect ownership
        expr: OWNERSHIP
        data_type: VARCHAR(16777216)
      - name: insider_name
        synonyms:
          - reporting_owner
          - who_traded
          - insider_person
        description: Name of the reporting person on the filing, for example "Ternus John".
          Where a filing names several co-filers this is the most senior one - an officer
          or director in preference to a passive 10%+ holder.
        expr: PRIMARY_INSIDER_NAME
        data_type: VARCHAR(16777216)
      - name: insider_role
        synonyms:
          - insider_relationship
          - insider_title
        description: The reporting person's relationship to the issuer, for example
          "Director", "Officer - CEO" or "10% Owner". Use this to distinguish a management
          sale from a financial holder reducing a stake.
        expr: PRIMARY_INSIDER_ROLE
        data_type: VARCHAR(16777216)
      - name: reporting_owner_count
        description: How many reporting persons the filing named. 1 for the large majority.
          Higher values mean joint or group filings, where insider_name is one of several.
        expr: REPORTING_OWNER_COUNT
        data_type: NUMBER(38,0)
    facts:
      - name: transaction_shares
        description: Number of shares in transaction
        expr: TRANSACTION_SHARES
        data_type: FLOAT
        access_modifier: public_access
      - name: transaction_price
        description: Price per share
        expr: TRANSACTION_PRICE_PER_SHARE
        data_type: FLOAT
        access_modifier: public_access
      - name: post_transaction_shares
        description: Shares owned after transaction
        expr: POST_TRANSACTION_SHARES_OWNED
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: total_insider_shares
        description: Total shares transacted
        expr: SUM(transaction_shares)
        access_modifier: public_access
      - name: total_insider_value
        synonyms:
          - insider_transaction_value
        description: Total value of insider transactions
        expr: SUM(transaction_shares * transaction_price)
        access_modifier: public_access
      - name: insider_transaction_count
        description: Number of insider transactions. NOT the number of people - one insider
          on a scheduled selling plan can file many transactions. Use distinct_insider_count
          to count people.
        expr: COUNT(*)
        access_modifier: public_access
      - name: distinct_insider_count
        synonyms:
          - number_of_insiders
          - how_many_insiders
        description: Number of different people who transacted. This is the correct measure
          for questions like "how many insiders sold" - counting transactions instead
          overstates it, often by an order of magnitude.
        expr: COUNT(DISTINCT insider_name)
        access_modifier: public_access
    time_dimensions:
      - name: transaction_date
        description: Date of insider transaction
        expr: TRANSACTION_DATE
        data_type: DATE
  - name: institutional_holdings
