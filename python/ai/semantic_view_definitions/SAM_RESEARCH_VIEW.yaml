        expr: MARKET_VALUE_USD
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: shares_held
        description: Number of shares held
        expr: SHARES_HELD
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: total_institutional_value
        synonyms:
          - total_institutional_market_value
        description: Total market value of institutional holdings
        expr: SUM(inst_market_value)
        access_modifier: public_access
      - name: total_shares_held
        description: Total shares held by institutions
        expr: SUM(shares_held)
        access_modifier: public_access
      - name: institution_count
        synonyms:
          - number_of_institutions
        description: Count of distinct institutional holders
        expr: COUNT(DISTINCT INSTITUTION_NAME)
        access_modifier: public_access
    time_dimensions:
      - name: filing_date
