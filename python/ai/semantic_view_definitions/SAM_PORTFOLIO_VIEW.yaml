module_custom_instructions:
  sql_generation: "PORTFOLIO NAME FILTERING: Always include the SAM prefix when filtering portfolio_name. Use ILIKE: portfolio_name ILIKE 'SAM %Technology%'. CRITICAL: Always filter holdings to the latest date unless the user explicitly requests historical data. Use WHERE holding_date = (SELECT MAX(holding_date) FROM __holdings). ANNUAL REVIEW: For year-end queries, filter to December 31 of the most recent complete year using a non-correlated scalar subquery. For portfolio weight percentages, multiply by 100. Round market values to 2dp and weights to 1dp. SUPPLY CHAIN: Use supply_chain and sc_counterparty_issuers tables together."
  question_categorization: "Unless the user explicitly asks for historical trends, assume they want current holdings (latest date only). For performance questions, use qtd_return_pct, ytd_return_pct, mtd_return_pct metrics. For benchmark performance, use benchmark_qtd_return_pct from benchmark_performance table. For portfolio vs benchmark comparison, use portfolio_benchmark table metrics. COMPLIANCE: For breach/alert queries, use compliance_alerts table. Filter by alert_type. Active alerts have resolved_date IS NULL."
verified_queries:
  - name: PORTFOLIO_HOLDINGS
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_PORTFOLIO_VIEW METRICS total_market_value_base, portfolio_weight_pct, holding_count)"
    question: What are the portfolio holdings?
    use_as_onboarding_question: true
  - name: ESG_SCORES
    sql: SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_PORTFOLIO_VIEW METRICS average_esg_score DIMENSIONS esg_grade)
    question: What are the ESG scores?
    use_as_onboarding_question: true
  - name: PORTFOLIO_RETURNS
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_PORTFOLIO_VIEW METRICS average_qtd_return_pct, average_ytd_return_pct, average_mtd_return_pct)"
    question: What are the portfolio returns?
    use_as_onboarding_question: false
  - name: FACTOR_EXPOSURES
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_PORTFOLIO_VIEW METRICS average_value_exposure, average_growth_exposure, average_momentum_exposure, average_quality_exposure DIMENSIONS factor_name)"
    question: What are the factor exposures?
    use_as_onboarding_question: false
  - name: BENCHMARK_PERFORMANCE
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_PORTFOLIO_VIEW METRICS average_benchmark_qtd_return_pct, average_benchmark_ytd_return_pct DIMENSIONS benchmark_name)"
    question: What is the benchmark performance?
    use_as_onboarding_question: true
  - name: PORTFOLIO_VS_BENCHMARK
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_PORTFOLIO_VIEW METRICS average_portfolio_qtd_return, average_portfolio_ytd_return, average_benchmark_qtd_return, average_benchmark_ytd_return, average_active_qtd_return, average_active_ytd_return DIMENSIONS comparison_portfolio, comparison_benchmark)"
    question: How does portfolio performance compare to benchmark?
    use_as_onboarding_question: true
  - name: LAST_CALENDAR_YEAR_PERFORMANCE
    sql: "SELECT __portfolios.portfolio_name, __holdings.holding_date, AVG(__holdings.ytd_return_pct) AS average_ytd_return_pct FROM __holdings JOIN __portfolios ON (__holdings.h_portfolio_id = __portfolios.p_portfolio_id) WHERE __holdings.holding_date = (SELECT MAX(holding_date) FROM __holdings WHERE EXTRACT(MONTH FROM holding_date) = 12 AND EXTRACT(DAY FROM holding_date) = 31) GROUP BY __portfolios.portfolio_name, __holdings.holding_date ORDER BY average_ytd_return_pct DESC"
    question: What was the full year performance for the last calendar year?
    use_as_onboarding_question: false
  - name: YEAR_END_TOP_HOLDINGS
    sql: "SELECT __portfolios.portfolio_name, __securities.security_description, __securities.ticker, SUM(__holdings.market_value_base) AS total_market_value_base, SUM(__holdings.portfolio_weight) * 100 AS PORTFOLIO_WEIGHT_PCT, __holdings.holding_date FROM __holdings JOIN __portfolios ON (__holdings.h_portfolio_id = __portfolios.p_portfolio_id) JOIN __securities ON (__holdings.h_security_id = __securities.s_security_id) WHERE __holdings.holding_date = (SELECT MAX(holding_date) FROM __holdings WHERE EXTRACT(MONTH FROM holding_date) = 12 AND EXTRACT(DAY FROM holding_date) = 31) GROUP BY __portfolios.portfolio_name, __securities.security_description, __securities.ticker, __holdings.holding_date ORDER BY total_market_value_base DESC"
    question: What were the top holdings at year end for the last calendar year?
    use_as_onboarding_question: false
  - name: YEAR_END_SECTOR_ALLOCATION
    sql: "SELECT __portfolios.portfolio_name, __issuers.industry AS Sector, SUM(__holdings.market_value_base) AS Sector_Value, SUM(__holdings.portfolio_weight) * 100 AS Sector_Weight FROM __holdings JOIN __portfolios ON (__holdings.h_portfolio_id = __portfolios.p_portfolio_id) JOIN __securities ON (__holdings.h_security_id = __securities.s_security_id) JOIN __issuers ON (__securities.s_issuer_id = __issuers.issuer_id) WHERE __holdings.holding_date = (SELECT MAX(holding_date) FROM __holdings WHERE EXTRACT(MONTH FROM holding_date) = 12 AND EXTRACT(DAY FROM holding_date) = 31) GROUP BY __portfolios.portfolio_name, __issuers.industry ORDER BY Sector_Weight DESC"
    question: What was the sector allocation at year end for the last calendar year?
    use_as_onboarding_question: false
  - name: PORTFOLIO_ANNUAL_REVIEW
    sql: "SELECT __portfolios.portfolio_name, AVG(__holdings.ytd_return_pct) AS Full_Year_Return, SUM(__holdings.market_value_base) AS Total_AUM, COUNT(__holdings.h_security_id) AS holding_count FROM __holdings JOIN __portfolios ON (__holdings.h_portfolio_id = __portfolios.p_portfolio_id) WHERE __holdings.holding_date = (SELECT MAX(holding_date) FROM __holdings WHERE EXTRACT(MONTH FROM holding_date) = 12 AND EXTRACT(DAY FROM holding_date) = 31) GROUP BY __portfolios.portfolio_name ORDER BY Total_AUM DESC"
    question: "Provide a comprehensive annual review for the last calendar year including performance, top holdings, and sector allocation"
    use_as_onboarding_question: false
  - name: COMPLIANCE_ALERT_SUMMARY
    sql: "SELECT * FROM SEMANTIC_VIEW({{DATABASE}}.AI.SAM_PORTFOLIO_VIEW METRICS total_compliance_alerts, active_compliance_alerts, compliance_breach_count, compliance_warning_count, esg_violation_count)"
    question: What are the current compliance alerts?
    use_as_onboarding_question: true
