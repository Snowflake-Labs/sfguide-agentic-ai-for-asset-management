name: SAM_MARKET_VIEW
description: "Consolidated market domain view covering macro regime classification (VIX-based volatility and market regimes), stress scenarios (10 historical + hypothetical crisis simulations), historical stress periods (COVID, GFC, Taper Tantrum, Rate Hike, Banking Crisis), US Treasury yield curve (14 maturities from 1M to 30Y), stock prices (daily OHLCV for 865+ tickers), and global macro data (policy rates for 73 countries, FX rates, US economic indicators, country-level GHG emissions)."
tables:
  - name: macro_regime
    synonyms:
      - market_regime
      - volatility_regime
      - macro_environment
      - market_conditions
    description: "Macro market regime classification. Volatility: LOW_VOL (<15), NORMAL (15-20), ELEVATED (20-30), HIGH_VOL (>30). Market: RISK_ON, RISK_OFF, TRANSITIONAL, NEUTRAL."
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: V_MACRO_REGIME
    primary_key:
      columns:
        - regime_date
    dimensions:
      - name: market_regime
        synonyms:
          - risk_regime
          - market_state
        description: "Market regime: RISK_ON, RISK_OFF, TRANSITIONAL, NEUTRAL"
        expr: MARKET_REGIME
        data_type: VARCHAR(12)
        is_enum: true
        sample_values:
          - "RISK_ON"
          - "RISK_OFF"
          - "TRANSITIONAL"
      - name: volatility_regime
        synonyms:
          - vol_regime
          - vix_regime
        description: "Volatility regime: LOW_VOL, NORMAL, ELEVATED, HIGH_VOL"
        expr: VOLATILITY_REGIME
        data_type: VARCHAR(8)
        is_enum: true
        sample_values:
          - "LOW_VOL"
          - "NORMAL"
          - "ELEVATED"
          - "HIGH_VOL"
    facts:
      - name: spx_return
        description: S&P 500 daily return
        expr: SPX_RETURN
        data_type: FLOAT
        access_modifier: public_access
      - name: vix_5d_change
        description: VIX 5-day change
        expr: VIX_5D_CHANGE
        data_type: FLOAT
        access_modifier: public_access
      - name: vix_close
        description: VIX closing level
        expr: VIX_CLOSE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_spx_return
        description: Average S&P 500 return
        expr: AVG(spx_return)
        access_modifier: public_access
      - name: average_vix_close
        synonyms:
          - avg_vix
        description: Average VIX level
        expr: AVG(vix_close)
        access_modifier: public_access
      - name: max_vix_close
        synonyms:
          - peak_vix
        description: Peak VIX level
        expr: MAX(vix_close)
        access_modifier: public_access
      - name: min_vix_close
        description: Minimum VIX level
        expr: MIN(vix_close)
        access_modifier: public_access
      - name: regime_day_count
        description: Number of trading days in regime
        expr: COUNT(*)
        access_modifier: public_access
    time_dimensions:
      - name: regime_date
        synonyms:
          - market_date
        description: Date of regime classification
        expr: DATE
        data_type: DATE
  - name: scenarios
    synonyms:
      - stress_tests
      - crisis_simulations
    description: "Stress scenario definitions: historical (2008, COVID, Tech Bubble) and hypothetical (Stagflation, China Crisis, Climate Shock)"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: DIM_STRESS_SCENARIOS
    primary_key:
      columns:
        - sce_scenario_id
    dimensions:
      - name: sce_scenario_id
        description: "SCENARIO_ID key for scenarios"
        expr: SCENARIO_ID
        data_type: "NUMBER(38,0)"
      - name: scenario_name
        synonyms:
          - crisis_name
          - stress_test_name
        description: Stress scenario name
        expr: SCENARIO_NAME
        data_type: VARCHAR(100)
      - name: scenario_type
        synonyms:
          - crisis_type
        description: "Scenario type: Historical or Hypothetical"
        expr: SCENARIO_TYPE
        data_type: VARCHAR(50)
        is_enum: true
        sample_values:
          - "HISTORICAL"
          - "HYPOTHETICAL"
      - name: scenario_description
        description: Detailed scenario description
        expr: DESCRIPTION
        data_type: VARCHAR(500)
      - name: scenario_severity
        description: "Severity level of the scenario"
        expr: SEVERITY
        data_type: VARCHAR(20)
        is_enum: true
        sample_values:
          - "MODERATE"
          - "SEVERE"
          - "EXTREME"
      - name: historical_reference
        description: Reference to historical event
        expr: HISTORICAL_REFERENCE
        data_type: VARCHAR(200)
  - name: scenario_shocks
    synonyms:
      - factor_shocks
      - crisis_impacts
    description: Factor-level shocks for each stress scenario
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_SCENARIO_SHOCKS
    primary_key:
      columns:
        - sce_scenario_id
        - shock_factor_name
    dimensions:
      - name: sce_scenario_id
        description: "SCENARIO_ID key for scenario_shocks"
        expr: SCENARIO_ID
        data_type: "NUMBER(38,0)"
      - name: shock_factor_name
        synonyms:
          - shocked_factor
        description: "Factor being shocked (Market, Value, Growth, Momentum, Quality, Size, Volatility)"
        expr: FACTOR_NAME
        data_type: VARCHAR(10)
    facts:
      - name: factor_shock
        description: Magnitude of factor shock
        expr: FACTOR_SHOCK
        data_type: "NUMBER(3,2)"
        access_modifier: public_access
      - name: shock_confidence_level
        description: Confidence level of the shock estimate
        expr: CONFIDENCE_LEVEL
        data_type: "NUMBER(3,2)"
        access_modifier: public_access
    metrics:
      - name: average_factor_shock
        description: Average factor shock magnitude
        expr: AVG(factor_shock)
        access_modifier: public_access
      - name: max_factor_shock
        description: Maximum factor shock
        expr: MAX(factor_shock)
        access_modifier: public_access
      - name: scenario_shock_count
        description: Number of factors shocked in scenario
        expr: COUNT(*)
        access_modifier: public_access
  - name: stress_periods
    synonyms:
      - historical_crises
      - market_crashes
      - past_stress_events
      - financial_crises
    description: "Historical stress periods: COVID-19 (2020), GFC (2008-09), Taper Tantrum (2013), Rate Hike (2022), Banking Crisis (2023)"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_HISTORICAL_STRESS_PERIODS
    primary_key:
      columns:
        - stress_period_id
    dimensions:
      - name: stress_period_id
        description: Stress period identifier
        expr: PERIOD_ID
        data_type: VARCHAR(19)
      - name: stress_period_description
        synonyms:
          - crisis_description
        description: Description of the historical stress period
        expr: DESCRIPTION
        data_type: VARCHAR(30)
    facts:
      - name: crisis_duration_days
        description: Duration of crisis in days
        expr: DURATION_DAYS
        data_type: "NUMBER(3,0)"
        access_modifier: public_access
      - name: crisis_market_return
        description: Market return during crisis period
        expr: MARKET_RETURN
        data_type: "NUMBER(3,2)"
        access_modifier: public_access
      - name: crisis_peak_vix
        description: Peak VIX during crisis
        expr: PEAK_VIX
        data_type: "NUMBER(4,2)"
        access_modifier: public_access
      - name: linked_scenario_id
        description: ID linking to stress scenario for backtesting
        expr: LINKED_SCENARIO_ID
        data_type: "NUMBER(2,0)"
        access_modifier: public_access
    metrics:
      - name: average_crisis_market_return
        description: Average market return across crises
        expr: AVG(crisis_market_return)
        access_modifier: public_access
      - name: max_crisis_peak_vix
        description: Highest peak VIX across all crises
        expr: MAX(crisis_peak_vix)
        access_modifier: public_access
    time_dimensions:
      - name: crisis_start_date
        description: Start date of crisis period
        expr: START_DATE
        data_type: DATE
      - name: crisis_end_date
        description: End date of crisis period
        expr: END_DATE
        data_type: DATE
  - name: treasury_yields
    synonyms:
      - yield_curve
      - us_treasuries
      - risk_free_rates
      - government_bonds
      - treasury_rates
    description: US Treasury par yield curve rates across 14 maturities (1M to 30Y). Daily frequency.
    base_table:
      database: "{{DATABASE}}"
      schema: MARKET_DATA
      table: FACT_TREASURY_YIELDS
    primary_key:
      columns:
        - tre_yield_id
    dimensions:
      - name: tre_yield_id
        description: "YIELD_ID key for treasury_yields"
        expr: YIELD_ID
        data_type: "NUMBER(38,0)"
      - name: maturity_code
        description: "Maturity code (1M, 3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 20Y, 30Y)"
        expr: MATURITY_CODE
        data_type: VARCHAR(16777216)
      - name: maturity_label
        description: Human-readable maturity label
        expr: MATURITY_LABEL
        data_type: VARCHAR(16777216)
    facts:
      - name: yield_pct
        description: Treasury yield percentage
        expr: YIELD_PCT
        data_type: FLOAT
        access_modifier: public_access
      - name: maturity_years
        description: Maturity in years (for curve fitting)
        expr: MATURITY_YEARS
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_yield
        description: Average yield across maturities or dates
        expr: AVG(yield_pct)
        access_modifier: public_access
      - name: yield_spread
        synonyms:
          - term_spread
        description: Spread between longest and shortest maturity (yield curve slope)
        expr: MAX(yield_pct) - MIN(yield_pct)
        access_modifier: public_access
    time_dimensions:
      - name: yield_date
        description: Date of yield observation
        expr: DATE
        data_type: DATE
  - name: stock_issuers
    description: Issuer data for stock prices (sector, industry, country)
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: DIM_ISSUER
    primary_key:
      columns:
        - sto_issuerid
    dimensions:
      - name: sto_issuerid
        description: "ISSUERID key for stock_issuers"
        expr: ISSUERID
        data_type: "NUMBER(38,0)"
      - name: stock_sector
        synonyms:
          - price_sector
        description: GICS sector of the stock
        expr: GICS_SECTOR
        data_type: VARCHAR(16777216)
      - name: stock_industry
        description: SIC industry of the stock
        expr: SIC_DESCRIPTION
        data_type: VARCHAR(16777216)
      - name: stock_company_name
        description: Company legal name
        expr: LEGALNAME
        data_type: VARCHAR(16777216)
  - name: prices
    synonyms:
      - stock_prices
      - daily_prices
      - market_data
    description: Daily OHLCV stock prices for 865+ tickers
    base_table:
      database: "{{DATABASE}}"
      schema: MARKET_DATA
      table: FACT_STOCK_PRICES
    primary_key:
      columns:
        - pri_price_id
    dimensions:
      - name: pric_pk_securityid
        description: "SECURITYID for prices"
        expr: "SECURITYID"
        data_type: "NUMBER(38,0)"
      - name: pric_pk_issuerid
        description: "ISSUERID for prices"
        expr: "ISSUERID"
        data_type: "NUMBER(38,0)"
      - name: pri_price_id
        description: "PRICE_ID key for prices"
        expr: PRICE_ID
        data_type: "NUMBER(38,0)"
      - name: stock_exchange
        description: Primary exchange code
        expr: PRIMARY_EXCHANGE_CODE
        data_type: VARCHAR(16777216)
    facts:
      - name: price_close
        description: Closing price
        expr: PRICE_CLOSE
        data_type: FLOAT
        access_modifier: public_access
      - name: price_high
        description: Intraday high
        expr: PRICE_HIGH
        data_type: FLOAT
        access_modifier: public_access
      - name: price_low
        description: Intraday low
        expr: PRICE_LOW
        data_type: FLOAT
        access_modifier: public_access
      - name: price_open
        description: Opening price
        expr: PRICE_OPEN
        data_type: FLOAT
        access_modifier: public_access
      - name: volume
        description: Trading volume
        expr: VOLUME
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: average_price_close
        description: Average closing price
        expr: AVG(price_close)
        access_modifier: public_access
      - name: max_price_high
        description: Maximum intraday high
        expr: MAX(price_high)
        access_modifier: public_access
      - name: min_price_low
        description: Minimum intraday low
        expr: MIN(price_low)
        access_modifier: public_access
      - name: total_volume
        description: Total trading volume
        expr: SUM(volume)
        access_modifier: public_access
      - name: trading_day_count
        description: Number of trading days
        expr: COUNT(DISTINCT PRICE_DATE)
        access_modifier: public_access
    time_dimensions:
      - name: trade_date
        synonyms:
          - price_date
          - market_date
        description: Trading date
        expr: PRICE_DATE
        data_type: DATE
  - name: stock_securities
    description: Security reference data for stock prices
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: DIM_SECURITY
    primary_key:
      columns:
        - sto_securityid
    dimensions:
      - name: stoc_pk_issuerid
        description: "ISSUERID for stock_securities"
        expr: "ISSUERID"
        data_type: "NUMBER(38,0)"
      - name: sto_securityid
        description: "SECURITYID key for stock_securities"
        expr: SECURITYID
        data_type: "NUMBER(38,0)"
      - name: stock_ticker
        synonyms:
          - ticker
          - symbol
        description: Trading ticker symbol
        expr: TICKER
        data_type: VARCHAR(16777216)
      - name: stock_name
        synonyms:
          - security_name
        description: Security description/name
        expr: DESCRIPTION
        data_type: VARCHAR(16777216)
      - name: stock_asset_class
        description: Asset class
        expr: ASSETCLASS
        data_type: VARCHAR(6)
  - name: econ_indicators
    synonyms:
      - economic_data
      - us_economics
      - fred_data
    description: US economic indicators from FRED (GDP, CPI, unemployment, etc.)
    base_table:
      database: "{{DATABASE}}"
      schema: MARKET_DATA
      table: FACT_ECONOMIC_INDICATORS
    primary_key:
      columns:
        - eco_indicator_id
    dimensions:
      - name: eco_indicator_id
        description: "INDICATOR_ID key for econ_indicators"
        expr: INDICATOR_ID
        data_type: "NUMBER(38,0)"
      - name: indicator_name
        synonyms:
          - economic_indicator
        description: Name of the economic indicator
        expr: INDICATOR_NAME
        data_type: VARCHAR(16777216)
      - name: indicator_type
        description: "Type: MACRO, LABOR, etc."
        expr: INDICATOR_TYPE
        data_type: VARCHAR(13)
        is_enum: true
        sample_values:
          - "GDP"
          - "CPI"
          - "UNEMPLOYMENT"
          - "RETAIL_SALES"
          - "INDUSTRIAL_PRODUCTION"
      - name: indicator_measure
        description: What the indicator measures
        expr: MEASURE
        data_type: VARCHAR(16777216)
      - name: indicator_unit
        description: Unit of measurement
        expr: UNIT
        data_type: VARCHAR(16777216)
    facts:
      - name: indicator_value
        description: Value of the economic indicator
        expr: VALUE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_indicator_value
        description: Average indicator value
        expr: AVG(indicator_value)
        access_modifier: public_access
    time_dimensions:
      - name: indicator_date
        synonyms:
          - economic_date
        description: Date of economic data point
        expr: DATE
        data_type: DATE
  - name: fx_rates
    synonyms:
      - exchange_rates
      - currency_rates
    description: Daily FX rates vs USD from BIS
    base_table:
      database: "{{DATABASE}}"
      schema: MARKET_DATA
      table: FACT_FX_RATES
    primary_key:
      columns:
        - fx__fx_rate_id
    dimensions:
      - name: fx__fx_rate_id
        description: "FX_RATE_ID key for fx_rates"
        expr: FX_RATE_ID
        data_type: "NUMBER(38,0)"
      - name: fx_base_currency
        description: Base currency (typically USD)
        expr: BASE_CURRENCY_ID
        data_type: VARCHAR(16777216)
      - name: fx_quote_currency
        description: Quote currency
        expr: QUOTE_CURRENCY_ID
        data_type: VARCHAR(16777216)
    facts:
      - name: fx_rate
        description: Exchange rate value
        expr: FX_RATE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_fx_rate
        description: Average exchange rate
        expr: AVG(fx_rate)
        access_modifier: public_access
    time_dimensions:
      - name: fx_date
        description: Date of FX rate
        expr: DATE
        data_type: DATE
  - name: policy_rates
    synonyms:
      - central_bank_rates
      - interest_rates
    description: Central bank policy rates for 73 countries from BIS
    base_table:
      database: "{{DATABASE}}"
      schema: MARKET_DATA
      table: FACT_POLICY_RATES
    primary_key:
      columns:
        - pol_rate_id
    dimensions:
      - name: pol_rate_id
        description: "RATE_ID key for policy_rates"
        expr: RATE_ID
        data_type: "NUMBER(38,0)"
      - name: policy_country
        synonyms:
          - central_bank_country
        description: Country of the central bank
        expr: COUNTRY
        data_type: VARCHAR(16777216)
      - name: rate_name
        description: Name/description of the policy rate
        expr: VARIABLE_NAME
        data_type: VARCHAR(16777216)
    facts:
      - name: policy_rate
        synonyms:
          - interest_rate
          - base_rate
        description: Policy rate value
        expr: POLICY_RATE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_policy_rate
        description: Average policy rate
        expr: AVG(policy_rate)
        access_modifier: public_access
    time_dimensions:
      - name: rate_date
        synonyms:
          - policy_date
        description: Date of policy rate observation
        expr: DATE
        data_type: DATE
  - name: country_emissions
    synonyms:
      - ghg_emissions
      - carbon_emissions
      - climate_data
    description: Country-level GHG emissions by sector from Climate Watch
    base_table:
      database: "{{DATABASE}}"
      schema: MARKET_DATA
      table: FACT_COUNTRY_EMISSIONS
    primary_key:
      columns:
        - cou_emission_id
    dimensions:
      - name: cou_emission_id
        description: "EMISSION_ID key for country_emissions"
        expr: EMISSION_ID
        data_type: "NUMBER(38,0)"
      - name: emission_country
        description: Country ISO3 code
        expr: COUNTRY_ISO3
        data_type: VARCHAR(16777216)
      - name: emission_type
        description: Type of emission
        expr: EMISSION_TYPE
        data_type: VARCHAR(16777216)
      - name: emission_sector
        description: Emission sector
        expr: SECTOR
        data_type: VARCHAR(16777216)
    facts:
      - name: emissions_tco2e
        description: Emissions in tonnes of CO2 equivalent
        expr: EMISSIONS_TCO2E
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: total_emissions
        description: Total emissions
        expr: SUM(emissions_tco2e)
        access_modifier: public_access
    time_dimensions:
      - name: emission_year
        description: Year of emission data
        expr: YEAR_DATE
        data_type: DATE
relationships:
  - name: shocks_to_scenarios
    left_table: scenario_shocks
    right_table: scenarios
    relationship_columns:
      - left_column: sce_scenario_id
        right_column: sce_scenario_id
  - name: prices_to_stock_issuers
    left_table: prices
    right_table: stock_issuers
    relationship_columns:
      - left_column: pric_pk_issuerid
        right_column: sto_issuerid
  - name: prices_to_stock_securities
    left_table: prices
    right_table: stock_securities
    relationship_columns:
      - left_column: pric_pk_securityid
        right_column: sto_securityid
  - name: stock_securities_to_stock_issuers
    left_table: stock_securities
    right_table: stock_issuers
    relationship_columns:
      - left_column: stoc_pk_issuerid
        right_column: sto_issuerid
module_custom_instructions:
  sql_generation: "CONSOLIDATED MARKET DOMAIN VIEW — covers macro regime, stress scenarios, historical crises, treasury yields, stock prices, and global macro data.\n\nMAP OF TABLES AND USE CASES:\n- macro_regime: Current market regime (VIX-based), daily granularity. Use for 'what regime are we in', 'risk on or off', 'VIX level'.\n- scenarios + scenario_shocks: Stress test definitions with factor shocks. Use for 'stress test', 'crisis simulation', 'what if market crashes'.\n- stress_periods: Historical crisis reference data. Use for 'past crises', '2008 crisis', 'COVID crash', 'when did GFC start'.\n- treasury_yields: Daily yield curve across 14 maturities. Use for 'yield curve', 'term structure', '10-year yield', 'rate environment'.\n- prices + stock_securities + stock_issuers: Daily stock OHLCV. Use for 'stock price', 'how did AAPL do', 'volume', 'price history'.\n- econ_indicators: US economic data (GDP, CPI, unemployment). Use for 'economic outlook', 'inflation', 'GDP growth'.\n- fx_rates: Daily FX rates. Use for 'dollar strength', 'EUR/USD', 'currency rates'.\n- policy_rates: Central bank rates. Use for 'Fed funds rate', 'SOFR', 'ECB rate', 'rate hikes'.\n- country_emissions: GHG emissions by country/sector. Use for 'carbon footprint', 'country emissions'.\n\nNote: These tables are INDEPENDENT — no cross-table joins except scenarios↔shocks and prices↔securities↔issuers. Each sub-domain answers different question types."
