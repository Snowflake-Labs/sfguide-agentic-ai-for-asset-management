name: SAM_PROACTIVE_INSIGHTS_VIEW
description: "Proactive agent insights and alerts generated by automated DATA_AGENT_RUN tasks. Three insight types: DAILY_BRIEFING (morning attribution summary per portfolio), ANOMALY_ALERT (cross-portfolio risk scan flagging HIGH severity items), POSITION_CHANGE (stream-triggered check when new positions arrive). Alerts table captures only HIGH severity items for notification workflows."
tables:
  - name: proactive_insights
    synonyms:
      - insights
      - agent_insights
      - automated_insights
      - daily_briefings
      - proactive_intelligence
    description: All proactive insights generated by scheduled/triggered agent runs
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_PROACTIVE_INSIGHTS
    primary_key:
      columns:
        - proa_pk_insightid
    dimensions:
      - name: proa_pk_insightid
        description: "INSIGHTID for proactive_insights"
        expr: INSIGHTID
        data_type: "NUMBER(38,0)"
      - name: insight_type
        synonyms:
          - type
          - category
          - insight_category
        description: "Type of insight: DAILY_BRIEFING, ANOMALY_ALERT, or POSITION_CHANGE"
        expr: INSIGHTTYPE
        data_type: VARCHAR(50)
        is_enum: true
        sample_values:
          - "ANOMALY_ALERT"
          - "DAILY_BRIEFING"
          - "POSITION_CHANGE"
      - name: portfolio_name
        synonyms:
          - portfolio
          - fund
          - fund_name
        description: Portfolio the insight relates to (NULL for cross-portfolio scans)
        expr: PORTFOLIONAME
        data_type: VARCHAR(200)
      - name: agent_name
        synonyms:
          - agent
          - generating_agent
        description: "Name of the agent that generated the insight (e.g. AM_attribution_intelligence)"
        expr: AGENTNAME
        data_type: VARCHAR(100)
      - name: severity
        synonyms:
          - risk_level
          - alert_level
          - priority
        description: "Severity classification: LOW, MEDIUM, HIGH, CRITICAL (NULL for informational)"
        expr: SEVERITY
        data_type: VARCHAR(10)
        is_enum: true
        sample_values:
          - "LOW"
          - "MEDIUM"
          - "HIGH"
          - "CRITICAL"
      - name: is_read
        synonyms:
          - read_status
          - acknowledged
          - seen
        description: Whether the insight has been read/acknowledged by a user
        expr: ISREAD
        data_type: BOOLEAN
      - name: generated_date
        synonyms:
          - date
          - insight_date
          - creation_date
        description: Date the insight was generated
        expr: DATE(GENERATEDAT)
        data_type: DATE
    time_dimensions:
      - name: generated_at
        synonyms:
          - creation_time
          - timestamp
        description: Timestamp when the insight was generated
        expr: GENERATEDAT
        data_type: TIMESTAMP_NTZ
      - name: expires_at
        synonyms:
          - expiry
          - valid_until
        description: When the insight becomes stale and should be archived
        expr: EXPIRESAT
        data_type: TIMESTAMP_NTZ
    measures:
      - name: insight_count
        synonyms:
          - total_insights
          - number_of_insights
          - count
        description: Total number of insights
        expr: COUNT(INSIGHTID)
        data_type: NUMBER
        default_aggregation: sum
      - name: unread_count
        synonyms:
          - unread_insights
          - pending_review
        description: Number of insights not yet read
        expr: COUNT(CASE WHEN ISREAD = FALSE THEN 1 END)
        data_type: NUMBER
        default_aggregation: sum
      - name: high_severity_count
        synonyms:
          - critical_count
          - high_priority_count
          - urgent_count
        description: Number of HIGH or CRITICAL severity insights
        expr: COUNT(CASE WHEN SEVERITY IN ('HIGH', 'CRITICAL') THEN 1 END)
        data_type: NUMBER
        default_aggregation: sum
      - name: insight_text
        synonyms:
          - response
          - narrative
          - agent_response
          - briefing_text
        description: The agent-generated text response (narrative content)
        expr: AGENTRESPONSETEXT
        data_type: VARCHAR
      - name: prompt_text
        synonyms:
          - question
          - query
          - agent_prompt
        description: The prompt/question sent to the agent
        expr: PROMPT
        data_type: VARCHAR
  - name: proactive_alerts
    synonyms:
      - alerts
      - risk_alerts
      - high_severity_alerts
      - notifications
    description: HIGH severity alerts promoted from insights for notification and action tracking
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_PROACTIVE_ALERTS
    primary_key:
      columns:
        - proa_pk_alertid
    dimensions:
      - name: proa_pk_alertid
        description: "ALERTID for proactive_alerts"
        expr: ALERTID
        data_type: "NUMBER(38,0)"
      - name: alert_type
        synonyms:
          - type
          - alert_category
        description: "Type of alert: ANOMALY_HIGH, CONCENTRATION_BREACH, STYLE_DRIFT"
        expr: ALERTTYPE
        data_type: VARCHAR(50)
        is_enum: true
        sample_values:
          - "CONCENTRATION_BREACH"
          - "CONCENTRATION_WARNING"
          - "ESG_DOWNGRADE"
      - name: portfolio_name
        synonyms:
          - portfolio
          - fund
          - affected_portfolio
        description: Portfolio affected by the alert
        expr: PORTFOLIONAME
        data_type: VARCHAR(200)
      - name: is_acknowledged
        synonyms:
          - acknowledged
          - resolved
          - actioned
        description: Whether the risk team has acknowledged/actioned the alert
        expr: ISACKNOWLEDGED
        data_type: BOOLEAN
      - name: alert_detail
        synonyms:
          - description
          - detail
          - explanation
        description: Human-readable explanation of the alert
        expr: ALERTDETAIL
        data_type: VARCHAR(4000)
    time_dimensions:
      - name: generated_at
        synonyms:
          - alert_time
          - timestamp
          - created_at
        description: When the alert was generated
        expr: GENERATEDAT
        data_type: TIMESTAMP_NTZ
    measures:
      - name: alert_count
        synonyms:
          - total_alerts
          - number_of_alerts
        description: Total number of alerts
        expr: COUNT(ALERTID)
        data_type: NUMBER
        default_aggregation: sum
      - name: unacknowledged_count
        synonyms:
          - open_alerts
          - pending_alerts
          - unresolved_count
        description: Number of alerts not yet acknowledged
        expr: COUNT(CASE WHEN ISACKNOWLEDGED = FALSE THEN 1 END)
        data_type: NUMBER
        default_aggregation: sum

verified_queries:
  - name: RECENT_INSIGHTS_SUMMARY
    question: "How many proactive insights were generated this week?"
    sql: "SELECT __proactive_insights.insight_type, COUNT(__proactive_insights.proa_pk_insightid) AS insight_count, COUNT(CASE WHEN __proactive_insights.is_read = FALSE THEN 1 END) AS unread_count FROM __proactive_insights WHERE __proactive_insights.generated_at >= DATEADD('day', -7, CURRENT_TIMESTAMP()) GROUP BY __proactive_insights.insight_type ORDER BY insight_count DESC"
  - name: OPEN_ALERTS_BY_PORTFOLIO
    question: "Which portfolios have unacknowledged alerts?"
    sql: "SELECT __proactive_alerts.portfolio_name, __proactive_alerts.alert_type, __proactive_alerts.alert_detail, __proactive_alerts.generated_at FROM __proactive_alerts WHERE __proactive_alerts.is_acknowledged = FALSE ORDER BY __proactive_alerts.generated_at DESC"
  - name: LATEST_DAILY_BRIEFING
    question: "Show me the latest daily briefing for each portfolio"
    sql: "SELECT __proactive_insights.portfolio_name, __proactive_insights.insight_text AS briefing_text, __proactive_insights.generated_at FROM __proactive_insights WHERE __proactive_insights.insight_type = 'DAILY_BRIEFING' QUALIFY ROW_NUMBER() OVER (PARTITION BY __proactive_insights.portfolio_name ORDER BY __proactive_insights.generated_at DESC) = 1 ORDER BY __proactive_insights.portfolio_name"

module_custom_instructions:
  sql_generation: |
    When querying proactive insights:
    - DAILY_BRIEFING insights are generated once per portfolio per weekday morning
    - ANOMALY_ALERT insights contain cross-portfolio risk scans
    - POSITION_CHANGE insights are triggered when new position data arrives
    - AgentResponseText contains the human-readable narrative
    - AgentResponseRaw contains the full JSON for detailed tool_use/tool_result inspection
    - Use ExpiresAt to filter out stale insights (insights older than their expiry)
    - For the most recent insight per portfolio, use QUALIFY ROW_NUMBER() OVER (PARTITION BY PORTFOLIONAME ORDER BY GENERATEDAT DESC) = 1
