      - name: cur_portfolioid
        description: "PORTFOLIOID key for currency_attribution"
        expr: PORTFOLIOID
        data_type: "NUMBER(38,0)"
      - name: local_currency
        synonyms:
          - trading_currency
          - security_currency
        description: Currency of the security
        expr: LOCALCURRENCY
        data_type: VARCHAR(10)
      - name: base_currency
        synonyms:
          - reporting_currency
        description: Base currency of the portfolio (USD)
        expr: BASECURRENCY
        data_type: VARCHAR(10)
    facts:
      - name: local_return
        description: Return in the security's local currency
        expr: LOCALRETURN
        data_type: FLOAT
        access_modifier: public_access
      - name: fx_return
        description: Currency return component (change in exchange rate)
        expr: FXRETURN
        data_type: FLOAT
        access_modifier: public_access
      - name: avu_return
