name: SAM_ATTRIBUTION_VIEW
description: "Consolidated attribution domain view covering Brinson performance decomposition (allocation, selection, interaction effects by sector/country/industry), factor attribution (7 systematic factors), hidden factor detection (5 AI-discovered latent risks), rolling analytics (drift tracking, cumulative paths), anomaly detection (8 risk alert types), cross-portfolio peer learning (alpha persistence, repeatable alpha sources), and currency attribution (local/FX/AVU decomposition). Supports multi-level drill-down, linked multi-period attribution (QTD/YTD/trailing 12M), and regime-conditional analysis."
tables:
  - name: brinson_sector
    synonyms:
      - sector_attribution
      - sector_brinson
      - sector_effects
    description: "Sector-level Brinson attribution with allocation, selection, interaction effects"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_BRINSON_BY_SECTOR
    primary_key:
      columns:
        - sector_date
        - bri_portfolioid
        - sector
    dimensions:
      - name: bri_portfolioid
        description: "PORTFOLIOID key for brinson_sector"
        expr: PORTFOLIOID
        data_type: "NUMBER(38,0)"
      - name: sector
        synonyms:
          - gics_sector
          - industry_sector
          - sector_name
        description: GICS sector for attribution
        expr: SECTOR
        data_type: VARCHAR(22)
    facts:
      - name: sector_benchmark_weight
        description: Benchmark weight in sector
        expr: BENCHMARK_WEIGHT
        data_type: "NUMBER(3,2)"
        access_modifier: public_access
      - name: sector_portfolio_weight
        description: Portfolio weight in sector
        expr: PORTFOLIO_WEIGHT
        data_type: FLOAT
        access_modifier: public_access
      - name: sector_allocation_effect
        description: Allocation effect for this sector
        expr: ALLOCATION_EFFECT
        data_type: FLOAT
        access_modifier: public_access
      - name: sector_interaction_effect
        description: Interaction effect for this sector
        expr: INTERACTION_EFFECT
        data_type: FLOAT
        access_modifier: public_access
      - name: sector_selection_effect
        description: Selection effect for this sector
        expr: SELECTION_EFFECT
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_sector_benchmark_weight
        synonyms:
          - index_weight
          - benchmark_allocation
        description: Benchmark weight in sector
        expr: AVG(sector_benchmark_weight)
        access_modifier: public_access
      - name: average_sector_portfolio_weight
        synonyms:
          - fund_weight
          - portfolio_allocation
        description: Portfolio weight in sector
        expr: AVG(sector_portfolio_weight)
        access_modifier: public_access
      - name: total_sector_allocation_effect
        description: Allocation effect for specific sector
        expr: SUM(sector_allocation_effect)
        access_modifier: public_access
      - name: total_sector_interaction_effect
        description: Interaction effect for specific sector
        expr: SUM(sector_interaction_effect)
        access_modifier: public_access
      - name: total_sector_selection_effect
        description: Selection effect for specific sector
        expr: SUM(sector_selection_effect)
        access_modifier: public_access
    time_dimensions:
      - name: sector_date
        description: Date of sector-level attribution
        expr: DATE
        data_type: DATE
  - name: brinson_summary
    synonyms:
      - brinson
      - attribution
      - active_return
      - performance_attribution
    description: "Portfolio-level Brinson attribution decomposition, ONE ROW PER PORTFOLIO PER MONTH (single-month returns and effects). All values are decimal fractions (0.0296 = 2.96%). For any period longer than one month (quarter, QTD, YTD, multi-quarter comparison) use linked_attribution, not sums of these monthly rows."
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_BRINSON_ATTRIBUTION
    primary_key:
      columns:
        - attribution_date
        - bri_portfolioid
    dimensions:
      - name: bri_portfolioid
        description: "PORTFOLIOID key for brinson_summary"
        expr: PORTFOLIOID
        data_type: "NUMBER(38,0)"
    facts:
      - name: active_return
        description: "Single-month active return (portfolio minus benchmark). Stored as a DECIMAL fraction: 0.0296 = +2.96% = +296 bps. Multiply by 100 for percent, by 10000 for bps."
        expr: ACTIVE_RETURN
        data_type: FLOAT
        access_modifier: public_access
      - name: allocation_effect
        description: "Single-month brinson allocation effect (over/underweight contribution). Decimal fraction (0.0010 = 0.10% = 10 bps)."
        expr: ALLOCATION_EFFECT
        data_type: FLOAT
        access_modifier: public_access
      - name: interaction_effect
        description: "Single-month brinson interaction (cross) effect. Decimal fraction (0.0010 = 0.10% = 10 bps)."
        expr: INTERACTION_EFFECT
        data_type: FLOAT
        access_modifier: public_access
      - name: selection_effect
        description: "Single-month brinson security selection effect within each group. Decimal fraction (0.0010 = 0.10% = 10 bps)."
        expr: SELECTION_EFFECT
        data_type: FLOAT
        access_modifier: public_access
      - name: total_benchmark_return
        description: "Single-month total benchmark return. Decimal fraction (0.0296 = 2.96%)."
        expr: TOTAL_BENCHMARK_RETURN
        data_type: FLOAT
        access_modifier: public_access
      - name: total_portfolio_return
        description: "Single-month total portfolio return. Decimal fraction (0.0296 = 2.96%)."
        expr: TOTAL_PORTFOLIO_RETURN
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: total_active_return
        synonyms:
          - excess_return
          - alpha
          - outperformance
        description: "Sum of monthly active returns (portfolio minus benchmark; equals allocation + selection + interaction). Stored as a DECIMAL fraction: 0.0296 = +2.96% = +296 bps. Multiply by 100 for percent, by 10000 for bps. Correct for a SINGLE month. Summing several months is an arithmetic approximation that ignores compounding - for quarters, QTD, YTD or comparing quarters use linked_attribution (total_linked_total_effect / linked_compounded_active_return) instead."
        expr: SUM(active_return)
        access_modifier: public_access
      - name: total_allocation_effect
        synonyms:
          - weight_effect
        description: Return from sector weight differences vs benchmark
        expr: SUM(allocation_effect)
        access_modifier: public_access
      - name: total_interaction_effect
        description: Combined allocation and selection effect
        expr: SUM(interaction_effect)
        access_modifier: public_access
      - name: total_selection_effect
        synonyms:
          - stock_selection
          - security_selection
        description: Return from security selection within sectors
        expr: SUM(selection_effect)
        access_modifier: public_access
      - name: sum_benchmark_return
        synonyms:
          - benchmark_return
          - index_return
        description: "Sum of monthly benchmark returns (decimal fraction). Valid for a single month only; for multi-month periods use linked_compounded_benchmark_return."
        expr: SUM(total_benchmark_return)
        access_modifier: public_access
      - name: sum_portfolio_return
        synonyms:
          - portfolio_return
          - fund_return
        description: "Sum of monthly portfolio returns (decimal fraction). Valid for a single month only; for multi-month periods use linked_compounded_portfolio_return."
        expr: SUM(total_portfolio_return)
        access_modifier: public_access
    time_dimensions:
      - name: attribution_date
        synonyms:
          - period_date
          - analysis_date
        description: Date of attribution analysis
        expr: DATE
        data_type: DATE
  - name: portfolios
    synonyms:
      - funds
      - strategies
    description: Portfolio reference data (shared dimension across all attribution tables)
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: DIM_PORTFOLIO
    primary_key:
      columns:
        - portfolio_id
    dimensions:
      - name: portfolio_id
        synonyms:
          - fund_id
          - portfolio_number
        description: Numeric portfolio identifier (1-11)
        expr: PORTFOLIOID
        data_type: "NUMBER(38,0)"
      - name: portfolio_name
        synonyms:
          - fund_name
          - strategy_name
        description: "Portfolio name, one of 11 exact names that all start with \"SAM \" (see values). Filter with = on the exact name, never LIKE or ILIKE. Map short names to the full name first - Tech or Technology means SAM Technology & Infrastructure (not SAM Tech Disruptors Equity), Flagship means SAM Global Flagship Multi-Asset, ESG means SAM ESG Leaders Global Equity, 60/40 or Balanced means SAM Global Balanced 60/40."
        expr: PORTFOLIONAME
        data_type: VARCHAR(134217728)
        is_enum: true
        sample_values:
          - SAM Technology & Infrastructure
          - SAM ESG Leaders Global Equity
          - SAM Global Flagship Multi-Asset
          - SAM US Core Equity
          - SAM Renewable & Climate Solutions
          - SAM Sustainable Global Equity
          - SAM AI & Digital Innovation
          - SAM Global Balanced 60/40
          - SAM Tech Disruptors Equity
          - SAM US Value Equity
          - SAM Multi-Asset Income
      - name: strategy
        synonyms:
          - investment_style
          - strategy_type
        description: Investment strategy type
        expr: STRATEGY
        data_type: VARCHAR(134217728)
        is_enum: true
        sample_values:
          - "Core"
          - "ESG"
          - "Growth"
          - "Income"
          - "Multi-Asset"
          - "Value"
  - name: multi_level_detail
    synonyms:
      - multi_level
      - country_attribution
      - industry_attribution
    description: Multi-level Brinson attribution by sector, country, or industry with drill-down support
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_BRINSON_ATTRIBUTION_DETAIL
    primary_key:
      columns:
        - detail_date
        - mul_portfolioid
        - grouping_dimension
        - grouping_value
    dimensions:
      - name: mul_portfolioid
        description: "PORTFOLIOID key for multi_level_detail"
        expr: PORTFOLIOID
        data_type: "NUMBER(38,0)"
      - name: grouping_dimension
        description: "Attribution decomposition level: SECTOR, COUNTRY, INDUSTRY or ASSET_CLASS"
        expr: GROUPINGDIMENSION
        data_type: VARCHAR(30)
        is_enum: true
        sample_values:
          - "SECTOR"
          - "COUNTRY"
          - "INDUSTRY"
          - "ASSET_CLASS"
      - name: grouping_value
        synonyms:
          - group_name
          - attribution_group
        description: "Value within the grouping dimension (e.g. 'Information Technology', 'US', 'Semiconductors')"
        expr: GROUPINGVALUE
        data_type: VARCHAR(200)
      - name: parent_grouping_value
        synonyms:
          - parent_group
          - drill_up
        description: "Parent group for drill-down hierarchy (e.g. 'Information Technology' is parent of 'Semiconductors')"
        expr: PARENTGROUPINGVALUE
        data_type: VARCHAR(200)
    facts:
      - name: detail_allocation_effect
        description: "Detail-level allocation effect (country/industry within sector)"
        expr: ALLOCATIONEFFECT
        data_type: FLOAT
        access_modifier: public_access
      - name: detail_selection_effect
        description: "Detail-level selection effect"
        expr: SELECTIONEFFECT
        data_type: FLOAT
        access_modifier: public_access
      - name: detail_interaction_effect
        description: "Detail-level interaction effect"
        expr: INTERACTIONEFFECT
        data_type: FLOAT
        access_modifier: public_access
      - name: detail_total_effect
        description: "Detail-level total attribution effect"
        expr: TOTALEFFECT
        data_type: FLOAT
        access_modifier: public_access
      - name: detail_portfolio_weight
        description: "Detail-level portfolio weight"
        expr: PORTFOLIOWEIGHT
        data_type: FLOAT
        access_modifier: public_access
      - name: detail_benchmark_weight
        description: "Detail-level benchmark weight"
        expr: BENCHMARKWEIGHT
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: total_detail_allocation_effect
        description: Sum of allocation effects across multi-level groups
        expr: SUM(detail_allocation_effect)
        access_modifier: public_access
      - name: total_detail_selection_effect
        description: Sum of selection effects across multi-level groups
        expr: SUM(detail_selection_effect)
        access_modifier: public_access
      - name: total_detail_total_effect
        description: Total effect across multi-level groups
        expr: SUM(detail_total_effect)
        access_modifier: public_access
      - name: average_detail_portfolio_weight
        description: Average portfolio weight across periods
        expr: AVG(detail_portfolio_weight)
        access_modifier: public_access
      - name: average_detail_benchmark_weight
        description: Average benchmark weight across periods
        expr: AVG(detail_benchmark_weight)
        access_modifier: public_access
    time_dimensions:
      - name: detail_date
        description: Date of multi-level attribution analysis
        expr: DATE
        data_type: DATE
  - name: linked_attribution
    synonyms:
      - linked
      - period_attribution
      - qtd_attribution
      - ytd_attribution
    description: "AUTHORITATIVE source for any multi-month attribution (quarter, QTD, YTD, trailing 12M, quarter-vs-quarter comparisons). Frongello-linked effects that compound correctly, one row per portfolio, period_end, period_type and grouping value. A full calendar quarter is the period_type = 'QTD' row at a quarter-end period_end (March, June, September, December). Effects are decimal fractions (0.0010 = 10 bps). Summing linked effects across the groups of ONE linked_grouping_dimension at ONE period_end and period_type gives the portfolio total; never sum across period_end values or across dimensions."
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_BRINSON_LINKED
    primary_key:
      columns:
        - period_end
        - period_type
        - lin_portfolioid
        - linked_grouping_dimension
        - linked_grouping_value
    dimensions:
      - name: lin_portfolioid
        description: "PORTFOLIOID key for linked_attribution"
        expr: PORTFOLIOID
        data_type: "NUMBER(38,0)"
      - name: period_type
        synonyms:
          - aggregation_period
          - time_horizon
        description: "Linked period type: QTD, YTD, or TRAILING_12M"
        expr: PERIODTYPE
        data_type: VARCHAR(20)
        is_enum: true
        sample_values:
          - "QTD"
          - "YTD"
          - "TRAILING_12M"
      - name: linked_grouping_dimension
        description: "Grouping dimension for linked attribution: SECTOR, COUNTRY, INDUSTRY or ASSET_CLASS. Always filter to exactly one value; each dimension decomposes the same portfolio total."
        expr: GROUPINGDIMENSION
        data_type: VARCHAR(30)
      - name: linked_grouping_value
        description: Group value within the linked attribution dimension
        expr: GROUPINGVALUE
        data_type: VARCHAR(200)
    facts:
      - name: linked_allocation
        description: "Multi-period linked allocation effect for the group over the period_type window ending at period_end. Decimal fraction (0.0010 = 10 bps)."
        expr: LINKEDALLOCATION
        data_type: FLOAT
        access_modifier: public_access
      - name: linked_selection
        description: "Multi-period linked selection effect for the group over the period_type window ending at period_end. Decimal fraction (0.0010 = 10 bps)."
        expr: LINKEDSELECTION
        data_type: FLOAT
        access_modifier: public_access
      - name: linked_interaction
        description: "Multi-period linked interaction effect for the group over the period_type window ending at period_end. Decimal fraction (0.0010 = 10 bps)."
        expr: LINKEDINTERACTION
        data_type: FLOAT
        access_modifier: public_access
      - name: linked_total_effect
        description: "Multi-period linked total attribution effect for the group over the period_type window ending at period_end. Decimal fraction (0.0010 = 10 bps)."
        expr: LINKEDTOTALEFFECT
        data_type: FLOAT
        access_modifier: public_access
      - name: compounded_active_return
        description: "Compounded portfolio-level active return over the period_type window (repeated on every group row - do not sum). Stored as a DECIMAL fraction: 0.0296 = +2.96% = +296 bps. Multiply by 100 for percent, by 10000 for bps."
        expr: TRY_TO_DOUBLE(COMPOUNDEDACTIVERETURN)
        data_type: FLOAT
        access_modifier: public_access
      - name: compounded_portfolio_return
        description: "Compounded portfolio return over the period_type window (repeated on every group row - do not sum). Decimal fraction."
        expr: TRY_TO_DOUBLE(COMPOUNDEDPORTFOLIORETURN)
        data_type: FLOAT
        access_modifier: public_access
      - name: compounded_benchmark_return
        description: "Compounded benchmark return over the period_type window (repeated on every group row - do not sum). Decimal fraction."
        expr: TRY_TO_DOUBLE(COMPOUNDEDBENCHMARKRETURN)
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: linked_compounded_active_return
        synonyms:
          - quarterly_active_return
          - qtd_active_return
          - ytd_active_return
          - linked_active_return
        description: "Compounded portfolio active return for the period (decimal: 0.0296 = +2.96% = +296 bps). Use with one portfolio, period_type and period_end. Preferred answer to 'what was the active return last quarter / YTD'."
        expr: AVG(compounded_active_return)
        access_modifier: public_access
      - name: linked_compounded_portfolio_return
        description: "Compounded portfolio return for the period (decimal fraction). Use with one portfolio, period_type and period_end."
        expr: AVG(compounded_portfolio_return)
        access_modifier: public_access
      - name: linked_compounded_benchmark_return
        description: "Compounded benchmark return for the period (decimal fraction). Use with one portfolio, period_type and period_end."
        expr: AVG(compounded_benchmark_return)
        access_modifier: public_access
      - name: total_linked_interaction
        description: "Sum of linked interaction effects (decimal fraction). Sum only within one period_end, period_type and linked_grouping_dimension."
        expr: SUM(linked_interaction)
        access_modifier: public_access
      - name: total_linked_allocation
        description: "Sum of linked allocation effects (decimal fraction, 0.0010 = 10 bps). Sum only within one period_end, period_type and linked_grouping_dimension."
        expr: SUM(linked_allocation)
        access_modifier: public_access
      - name: total_linked_selection
        description: "Sum of linked selection effects (decimal fraction). Sum only within one period_end, period_type and linked_grouping_dimension."
        expr: SUM(linked_selection)
        access_modifier: public_access
      - name: total_linked_total_effect
        description: "Sum of linked total effects (decimal fraction). Across all groups of one dimension at one period_end and period_type this approximates the compounded active return for the period."
        expr: SUM(linked_total_effect)
        access_modifier: public_access
    time_dimensions:
      - name: period_end
        synonyms:
          - linked_date
        description: End date of the linked attribution period
        expr: PERIODEND
        data_type: DATE
  - name: factor_attribution
    synonyms:
      - factor_returns
      - factor_contribution
      - factor_analysis
      - systematic_factors
    description: "Factor-based performance attribution showing factor exposures and contributions for 7 factors: Market, Value, Growth, Momentum, Quality, Size, Volatility"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_FACTOR_ATTRIBUTION
    primary_key:
      columns:
        - factor_date
        - fac_portfolioid
        - factor_name
    dimensions:
      - name: fac_portfolioid
        description: "PORTFOLIOID key for factor_attribution"
        expr: PORTFOLIOID
        data_type: "NUMBER(38,0)"
      - name: factor_name
        synonyms:
          - factor
          - risk_factor
          - systematic_factor
        description: "Factor name (Market, Value, Growth, Momentum, Quality, Size, Volatility)"
        expr: FACTOR_NAME
        data_type: VARCHAR(10)
        is_enum: true
        sample_values:
          - "Growth"
          - "Market"
          - "Momentum"
          - "Quality"
          - "Size"
          - "Value"
          - "Volatility"
    facts:
      - name: factor_contribution
        description: Return contribution from this factor exposure
        expr: FACTOR_CONTRIBUTION
        data_type: FLOAT
        access_modifier: public_access
      - name: factor_return
        description: Factor return (premium) for the period
        expr: FACTOR_RETURN
        data_type: FLOAT
        access_modifier: public_access
      - name: portfolio_factor_exposure
        description: Portfolio exposure (loading/beta) to this factor
        expr: PORTFOLIO_FACTOR_EXPOSURE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_factor_return
        synonyms:
          - factor_premium
          - factor_spread
        description: Average factor return
        expr: AVG(factor_return)
        access_modifier: public_access
      - name: average_portfolio_factor_exposure
        synonyms:
          - beta
          - factor_loading
          - factor_exposure
        description: Average portfolio exposure to factor
        expr: AVG(portfolio_factor_exposure)
        access_modifier: public_access
      - name: total_factor_contribution
        synonyms:
          - factor_performance
          - systematic_return
        description: Total return contribution from factor exposure
        expr: SUM(factor_contribution)
        access_modifier: public_access
    time_dimensions:
      - name: factor_date
        description: Date of factor attribution
        expr: DATE
        data_type: DATE
  - name: hidden_factors
    synonyms:
      - latent_factors
      - unpriced_risks
      - hidden_exposures
      - alternative_factors
    description: "AI-detected hidden factor exposures: AI_Exposure, Reshoring_Benefit, Rate_Convexity, Climate_Transition, Geopolitical_Risk"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: FACT_HIDDEN_FACTOR_EXPOSURES
    primary_key:
      columns:
        - hidden_factor_date
        - hid_portfolioid
        - hidden_factor_name
    dimensions:
      - name: hid_portfolioid
        description: "PORTFOLIOID key for hidden_factors"
        expr: PORTFOLIOID
        data_type: "NUMBER(38,0)"
      - name: hidden_factor_name
        synonyms:
          - hidden_factor
          - latent_factor
          - alternative_factor
        description: "Hidden factor name (AI_Exposure, Reshoring_Benefit, Rate_Convexity, Climate_Transition, Geopolitical_Risk)"
        expr: FACTOR_NAME
        data_type: VARCHAR(18)
        is_enum: true
        sample_values:
          - "AI_Exposure"
          - "Climate_Transition"
          - "Geopolitical_Risk"
          - "Rate_Convexity"
          - "Reshoring_Benefit"
      - name: hidden_factor_description
        synonyms:
          - factor_desc
        description: Description of hidden factor
        expr: DESCRIPTION
        data_type: VARCHAR(81)
    facts:
      - name: explanatory_power
        description: Variance explained by this hidden factor (R-squared contribution)
        expr: EXPLANATORY_POWER
        data_type: FLOAT
        access_modifier: public_access
      - name: hidden_factor_exposure
        description: Portfolio exposure to this hidden factor
        expr: FACTOR_EXPOSURE
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_explanatory_power
        description: Average explanatory power per hidden factor
        expr: AVG(explanatory_power)
        access_modifier: public_access
      - name: average_hidden_factor_exposure
        synonyms:
          - hidden_beta
          - latent_exposure
        description: Average hidden factor exposure
        expr: AVG(hidden_factor_exposure)
        access_modifier: public_access
      - name: max_hidden_factor_exposure
        synonyms:
          - peak_hidden_exposure
        description: Maximum hidden factor exposure
        expr: MAX(hidden_factor_exposure)
        access_modifier: public_access
      - name: total_explanatory_power
        synonyms:
          - variance_explained
        description: Total variance explained by hidden factors
        expr: SUM(explanatory_power)
        access_modifier: public_access
    time_dimensions:
      - name: hidden_factor_date
        description: Date of hidden factor analysis
        expr: DATE
        data_type: DATE
  - name: rolling
    synonyms:
      - rolling_attribution
      - factor_drift
      - exposure_path
      - contribution_path
    description: "Rolling factor analytics with exposure drift, cumulative contributions, and regime classification"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: V_FACTOR_ROLLING_ANALYTICS
    primary_key:
      columns:
        - rolling_date
        - rol_portfolioid
        - rolling_factor_name
    dimensions:
      - name: rol_portfolioid
        description: "PORTFOLIOID key for rolling"
        expr: PORTFOLIOID
        data_type: "NUMBER(38,0)"
      - name: rolling_factor_name
        synonyms:
          - rolling_factor
        description: "Factor name for rolling analytics (Market, Value, Growth, Momentum, Quality, Size, Volatility)"
        expr: FACTOR_NAME
        data_type: VARCHAR(10)
      - name: market_regime
        synonyms:
          - risk_regime
          - market_state
        description: "Monthly market regime from the ML regime model (RISK_ON, RISK_OFF, TRANSITIONAL)"
        expr: MARKET_REGIME
        data_type: VARCHAR(12)
        is_enum: true
        sample_values:
          - "RISK_ON"
          - "RISK_OFF"
          - "TRANSITIONAL"
      - name: volatility_regime
        synonyms:
          - vol_regime
          - vix_regime
        description: "Monthly volatility regime (LOW_VOL, NORMAL, ELEVATED, HIGH_VOL)"
        expr: VOLATILITY_REGIME
        data_type: VARCHAR(8)
        is_enum: true
        sample_values:
          - "LOW_VOL"
          - "NORMAL"
          - "ELEVATED"
          - "HIGH_VOL"
    facts:
      - name: rolling_contribution
        description: Monthly factor contribution
        expr: CONTRIBUTION
        data_type: FLOAT
        access_modifier: public_access
      - name: cumulative_contribution
        description: Running total of factor contribution from start
        expr: CUMULATIVE_CONTRIBUTION
        data_type: FLOAT
        access_modifier: public_access
      - name: rolling_exposure
        description: Current factor exposure
        expr: EXPOSURE
        data_type: FLOAT
        access_modifier: public_access
      - name: exposure_drift
        description: Current exposure minus 6-month trailing average
        expr: EXPOSURE_DRIFT
        data_type: FLOAT
        access_modifier: public_access
      - name: rolling_3m_contribution
        description: Trailing 3-month factor contribution
        expr: ROLLING_3M_CONTRIBUTION
        data_type: FLOAT
        access_modifier: public_access
      - name: rolling_6m_contribution
        description: Trailing 6-month factor contribution
        expr: ROLLING_6M_CONTRIBUTION
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_rolling_contribution
        description: Average factor contribution
        expr: AVG(rolling_contribution)
        access_modifier: public_access
      - name: average_rolling_exposure
        description: Average factor exposure
        expr: AVG(rolling_exposure)
        access_modifier: public_access
      - name: average_exposure_drift
        synonyms:
          - mean_drift
        description: Average exposure drift from 6-month trailing average
        expr: AVG(exposure_drift)
        access_modifier: public_access
      - name: max_cumulative_contribution
        synonyms:
          - final_cumulative
        description: Latest cumulative contribution value
        expr: MAX(cumulative_contribution)
        access_modifier: public_access
      - name: max_drift_zscore
        synonyms:
          - peak_drift
        description: Maximum absolute drift z-score
        expr: MAX(ABS(EXPOSURE_DRIFT_ZSCORE))
        access_modifier: public_access
      - name: total_rolling_contribution
        description: Total factor contribution
        expr: SUM(rolling_contribution)
        access_modifier: public_access
    time_dimensions:
      - name: rolling_date
        description: Date of rolling analytics
        expr: DATE
        data_type: DATE
  - name: anomalies
    synonyms:
      - anomaly_alerts
      - risk_flags
      - attribution_anomalies
      - drift_alerts
    description: "Monthly attribution anomaly detection: FACTOR_DRIFT_ALERT, CONCENTRATION_ALERT, SINGLE_FACTOR_DOMINANCE, STYLE_INCONSISTENCY, ATTRIBUTION_SPIKE, ALLOCATION_DRIFT_ALERT, SELECTION_REVERSAL_ALERT, WEIGHT_CONCENTRATION_ALERT"
    base_table:
      database: "{{DATABASE}}"
      schema: CURATED
      table: V_ATTRIBUTION_ANOMALIES
