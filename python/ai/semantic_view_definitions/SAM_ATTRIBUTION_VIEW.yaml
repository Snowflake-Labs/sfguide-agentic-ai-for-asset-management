module_custom_instructions:
  sql_generation: "CONSOLIDATED ATTRIBUTION DOMAIN VIEW — covers Brinson, factor, hidden factor, rolling analytics, anomaly detection, peer learning, and currency attribution.\n\nDATA GRANULARITY: All data is MONTHLY (month-end dates). Each fact table has different grain:\n- brinson_summary: portfolio-month\n- brinson_sector: portfolio-sector-month\n- multi_level_detail: portfolio-dimension-group-month\n- linked_attribution: portfolio-period-dimension-group (QTD/YTD/TRAILING_12M)\n- factor_attribution: portfolio-factor-month\n- hidden_factors: portfolio-factor-month\n- rolling: portfolio-factor-month (pre-joined with drift and regime)\n- anomalies: portfolio-month (pre-aggregated alerts)\n- peers: portfolio (trailing 12M snapshot)\n- currency_attribution: portfolio-security-month\n\nUNITS: Every return and effect in this view is a DECIMAL FRACTION, not a percentage and not bps. 0.0296 means +2.96% (= +296 bps); 0.00043 means +0.043% (= +4.3 bps). Convert explicitly (x100 for %, x10000 for bps) and state the unit. Never present a raw 0.0296 as 2.96 bps or 0.0296%.\n\nLAST QUARTER: 'last quarter', 'most recent quarter' or 'Qn' means the latest COMPLETE calendar quarter available in the data, not the trailing 3 months and not the current partial quarter. Its end date is the latest quarter-end month-end (March, June, September or December) with data: in linked_attribution use period_type = 'QTD' AND period_end = (SELECT MAX(period_end) FROM linked_attribution WHERE MONTH(period_end) IN (3, 6, 9, 12)). Always state the quarter label and its date range in the answer. If the user wants quarter-to-date for the current partial quarter, use period_type = 'QTD' at MAX(period_end) and label it QTD.\n\nMULTI-PERIOD RULE: Monthly tables (brinson_summary, brinson_sector, multi_level_detail) hold single-month effects. For anything longer than one month - a quarter, QTD, YTD, trailing 12M, or comparing two quarters - use linked_attribution, which is Frongello-linked and compounds correctly. Do NOT sum monthly active returns or effects across months. To compare quarters, select the QTD rows at each quarter-end period_end.\n\nBRINSON IDENTITY: active_return = allocation_effect + selection_effect + interaction_effect (ALWAYS holds).\n\nMULTI-LEVEL: Filter multi_level_detail by grouping_dimension ('SECTOR', 'COUNTRY', 'INDUSTRY'). For drill-down, filter by parent_grouping_value.\n\nLINKED ATTRIBUTION: Filter by period_type, exactly one linked_grouping_dimension, and period_end. For portfolio-level allocation, selection and interaction totals use linked_grouping_dimension = 'SECTOR' and return ONE row with all three effects plus active return from the same query (see LINKED_EFFECTS_QTD_BPS / LINKED_EFFECTS_YTD_BPS); never quote an effect from a different dimension, period or query, and report the reconciliation check (effects minus active). Pre-computed with Frongello adjustment. Portfolio-level compounded returns are in compounded_active_return / compounded_portfolio_return / compounded_benchmark_return (repeated on each group row: use AVG, never SUM).\n\nFACTOR ATTRIBUTION: 7 factors — Market, Value, Growth, Momentum, Quality, Size, Volatility. factor_contribution = portfolio_factor_exposure * factor_return.\n\nHIDDEN FACTORS: 5 factors — AI_Exposure, Reshoring_Benefit, Rate_Convexity, Climate_Transition, Geopolitical_Risk.\n\nROLLING: Pre-joined view with exposure_drift (current minus 6M average), EXPOSURE_DRIFT_ZSCORE, cumulative paths, and regime labels.\n\nANOMALIES: 8 alert types with severity scoring. Filter by anomaly_severity for priority.\n\nPEERS: Trailing 12M snapshot — one row per portfolio. No date filter needed.\n\nCURRENCY: base_return = local_return + fx_return + avu_return."
verified_queries:
  - name: LINKED_EFFECTS_QTD_BPS
    sql: "SELECT __portfolios.portfolio_name, __linked_attribution.period_type, __linked_attribution.period_end, SUM(__linked_attribution.linked_allocation) * 10000 AS ALLOCATION_EFFECT_BPS, SUM(__linked_attribution.linked_selection) * 10000 AS SELECTION_EFFECT_BPS, SUM(__linked_attribution.linked_interaction) * 10000 AS INTERACTION_EFFECT_BPS, AVG(__linked_attribution.compounded_active_return) * 10000 AS ACTIVE_RETURN_BPS, (SUM(__linked_attribution.linked_allocation) + SUM(__linked_attribution.linked_selection) + SUM(__linked_attribution.linked_interaction) - AVG(__linked_attribution.compounded_active_return)) * 10000 AS RECONCILIATION_CHECK_BPS FROM __linked_attribution JOIN __portfolios ON __linked_attribution.lin_portfolioid = __portfolios.portfolio_id WHERE __portfolios.portfolio_name = 'SAM Global Flagship Multi-Asset' AND __linked_attribution.linked_grouping_dimension = 'SECTOR' AND __linked_attribution.period_type = 'QTD' AND __linked_attribution.period_end = (SELECT MAX(period_end) FROM __linked_attribution WHERE MONTH(period_end) IN (3, 6, 9, 12)) GROUP BY __portfolios.portfolio_name, __linked_attribution.period_type, __linked_attribution.period_end"
    question: "What were the allocation, selection and interaction effects and active return in bps for SAM Global Flagship Multi-Asset last quarter?"
    use_as_onboarding_question: false
  - name: LINKED_EFFECTS_YTD_BPS
    sql: "SELECT __portfolios.portfolio_name, __linked_attribution.period_type, __linked_attribution.period_end, SUM(__linked_attribution.linked_allocation) * 10000 AS ALLOCATION_EFFECT_BPS, SUM(__linked_attribution.linked_selection) * 10000 AS SELECTION_EFFECT_BPS, SUM(__linked_attribution.linked_interaction) * 10000 AS INTERACTION_EFFECT_BPS, AVG(__linked_attribution.compounded_active_return) * 10000 AS ACTIVE_RETURN_BPS, (SUM(__linked_attribution.linked_allocation) + SUM(__linked_attribution.linked_selection) + SUM(__linked_attribution.linked_interaction) - AVG(__linked_attribution.compounded_active_return)) * 10000 AS RECONCILIATION_CHECK_BPS FROM __linked_attribution JOIN __portfolios ON __linked_attribution.lin_portfolioid = __portfolios.portfolio_id WHERE __portfolios.portfolio_name = 'SAM Global Flagship Multi-Asset' AND __linked_attribution.linked_grouping_dimension = 'SECTOR' AND __linked_attribution.period_type = 'YTD' AND __linked_attribution.period_end = (SELECT MAX(period_end) FROM __linked_attribution WHERE period_type = 'YTD') GROUP BY __portfolios.portfolio_name, __linked_attribution.period_type, __linked_attribution.period_end"
    question: "What are the year-to-date allocation, selection and interaction effects and active return in bps for SAM Global Flagship Multi-Asset?"
    use_as_onboarding_question: false
  - name: QUARTERLY_BRINSON_SUMMARY
    sql: "SELECT __portfolios.portfolio_name, __linked_attribution.period_end AS QUARTER_END, DATEADD('day', 1, DATEADD('month', -3, __linked_attribution.period_end)) AS QUARTER_START, AVG(__linked_attribution.compounded_portfolio_return) AS PORTFOLIO_RETURN, AVG(__linked_attribution.compounded_benchmark_return) AS BENCHMARK_RETURN, AVG(__linked_attribution.compounded_active_return) AS ACTIVE_RETURN, AVG(__linked_attribution.compounded_active_return) * 10000 AS ACTIVE_RETURN_BPS, SUM(__linked_attribution.linked_allocation) AS ALLOCATION_EFFECT, SUM(__linked_attribution.linked_selection) AS SELECTION_EFFECT, SUM(__linked_attribution.linked_interaction) AS INTERACTION_EFFECT FROM __linked_attribution JOIN __portfolios ON __linked_attribution.lin_portfolioid = __portfolios.portfolio_id WHERE __portfolios.portfolio_name = 'SAM Global Flagship Multi-Asset' AND __linked_attribution.period_type = 'QTD' AND __linked_attribution.linked_grouping_dimension = 'SECTOR' AND __linked_attribution.period_end = (SELECT MAX(period_end) FROM __linked_attribution WHERE MONTH(period_end) IN (3, 6, 9, 12)) GROUP BY __portfolios.portfolio_name, __linked_attribution.period_end"
    question: Show the attribution for SAM Global Flagship versus the benchmark for the last quarter, including active return and allocation, selection, and interaction effects.
    use_as_onboarding_question: true
  - name: sector_ATTRIBUTION_BREAKDOWN
    sql: "SELECT __linked_attribution.linked_grouping_value AS SECTOR, __linked_attribution.period_end AS QUARTER_END, SUM(__linked_attribution.linked_allocation) AS ALLOCATION_EFFECT, SUM(__linked_attribution.linked_selection) AS SELECTION_EFFECT, SUM(__linked_attribution.linked_interaction) AS INTERACTION_EFFECT, SUM(__linked_attribution.linked_total_effect) AS TOTAL_EFFECT, SUM(__linked_attribution.linked_total_effect) * 10000 AS TOTAL_EFFECT_BPS FROM __linked_attribution JOIN __portfolios ON __linked_attribution.lin_portfolioid = __portfolios.portfolio_id WHERE __portfolios.portfolio_name = 'SAM Global Flagship Multi-Asset' AND __linked_attribution.period_type = 'QTD' AND __linked_attribution.linked_grouping_dimension = 'SECTOR' AND __linked_attribution.period_end = (SELECT MAX(period_end) FROM __linked_attribution WHERE MONTH(period_end) IN (3, 6, 9, 12)) GROUP BY __linked_attribution.linked_grouping_value, __linked_attribution.period_end ORDER BY ABS(SUM(__linked_attribution.linked_total_effect)) DESC"
    question: Which sectors contributed most to performance last quarter? Show allocation and selection effects by sector.
    use_as_onboarding_question: true
  - name: country_ATTRIBUTION_BREAKDOWN
    sql: "SELECT __linked_attribution.linked_grouping_value AS COUNTRY, __linked_attribution.period_end AS QUARTER_END, SUM(__linked_attribution.linked_allocation) AS ALLOCATION_EFFECT, SUM(__linked_attribution.linked_selection) AS SELECTION_EFFECT, SUM(__linked_attribution.linked_interaction) AS INTERACTION_EFFECT, SUM(__linked_attribution.linked_total_effect) AS TOTAL_EFFECT FROM __linked_attribution JOIN __portfolios ON __linked_attribution.lin_portfolioid = __portfolios.portfolio_id WHERE __portfolios.portfolio_name = 'SAM Global Flagship Multi-Asset' AND __linked_attribution.period_type = 'QTD' AND __linked_attribution.linked_grouping_dimension = 'COUNTRY' AND __linked_attribution.period_end = (SELECT MAX(period_end) FROM __linked_attribution WHERE MONTH(period_end) IN (3, 6, 9, 12)) GROUP BY __linked_attribution.linked_grouping_value, __linked_attribution.period_end ORDER BY ABS(SUM(__linked_attribution.linked_total_effect)) DESC"
    question: Show attribution by country for SAM Global Flagship for the last quarter. Which countries drove outperformance?
    use_as_onboarding_question: true
  - name: QUARTER_OVER_QUARTER_ATTRIBUTION
    sql: "WITH quarter_ends AS (SELECT DISTINCT period_end FROM __linked_attribution WHERE MONTH(period_end) IN (3, 6, 9, 12) ORDER BY period_end DESC LIMIT 2) SELECT __linked_attribution.period_end AS QUARTER_END, AVG(__linked_attribution.compounded_active_return) AS ACTIVE_RETURN, AVG(__linked_attribution.compounded_active_return) * 10000 AS ACTIVE_RETURN_BPS, SUM(__linked_attribution.linked_allocation) AS ALLOCATION_EFFECT, SUM(__linked_attribution.linked_selection) AS SELECTION_EFFECT, SUM(__linked_attribution.linked_interaction) AS INTERACTION_EFFECT FROM __linked_attribution JOIN __portfolios ON __linked_attribution.lin_portfolioid = __portfolios.portfolio_id WHERE __portfolios.portfolio_name = 'SAM Global Flagship Multi-Asset' AND __linked_attribution.period_type = 'QTD' AND __linked_attribution.linked_grouping_dimension = 'SECTOR' AND __linked_attribution.period_end IN (SELECT period_end FROM quarter_ends) GROUP BY __linked_attribution.period_end ORDER BY __linked_attribution.period_end"
    question: Compare the attribution for SAM Global Flagship in the last quarter with the quarter before. Did active return and selection improve?
    use_as_onboarding_question: false
  - name: YTD_LINKED_ATTRIBUTION
    sql: "SELECT __linked_attribution.linked_grouping_value, SUM(__linked_attribution.linked_allocation) AS LINKED_ALLOCATION, SUM(__linked_attribution.linked_selection) AS LINKED_SELECTION, SUM(__linked_attribution.linked_interaction) AS LINKED_INTERACTION, SUM(__linked_attribution.linked_total_effect) AS LINKED_TOTAL FROM __linked_attribution JOIN __portfolios ON __linked_attribution.lin_portfolioid = __portfolios.portfolio_id WHERE __portfolios.portfolio_name = 'SAM Global Flagship Multi-Asset' AND __linked_attribution.period_type = 'YTD' AND __linked_attribution.linked_grouping_dimension = 'SECTOR' AND __linked_attribution.period_end = (SELECT MAX(period_end) FROM __linked_attribution) GROUP BY __linked_attribution.linked_grouping_value ORDER BY ABS(SUM(__linked_attribution.linked_total_effect)) DESC"
    question: Show the YTD linked attribution by sector for SAM Global Flagship.
    use_as_onboarding_question: true
  - name: FACTOR_EXPOSURE_SUMMARY
    sql: "SELECT __factor_attribution.factor_name, AVG(__factor_attribution.portfolio_factor_exposure) AS AVG_EXPOSURE, AVG(__factor_attribution.factor_return) AS AVG_FACTOR_RETURN, SUM(__factor_attribution.factor_contribution) AS TOTAL_CONTRIBUTION FROM __factor_attribution JOIN __portfolios ON __factor_attribution.fac_portfolioid = __portfolios.portfolio_id WHERE __portfolios.portfolio_name = 'SAM Global Flagship Multi-Asset' AND __factor_attribution.factor_date > DATEADD('month', -3, (SELECT MAX(factor_date) FROM __factor_attribution)) GROUP BY __factor_attribution.factor_name ORDER BY ABS(SUM(__factor_attribution.factor_contribution)) DESC"
    question: What factor exposures drove our returns? Show the contribution from all systematic factors.
    use_as_onboarding_question: true
  - name: ANOMALY_SCAN
    sql: "SELECT __anomalies.anomaly_severity, __anomalies.drift_factor, __anomalies.drift_magnitude, __anomalies.concentrated_sector, __anomalies.dominant_factor FROM __anomalies WHERE __anomalies.anomaly_date = (SELECT MAX(anomaly_date) FROM __anomalies) ORDER BY CASE __anomalies.anomaly_severity WHEN 'HIGH' THEN 1 WHEN 'MEDIUM' THEN 2 ELSE 3 END"
    question: Run an anomaly scan across all portfolios. Flag anything concerning.
    use_as_onboarding_question: true
  - name: PEER_RANKING
    sql: "SELECT __peers.alpha_persistence, __peers.peer_avg_active_return, __peers.peer_avg_allocation_effect, __peers.peer_avg_selection_effect, __peers.allocation_consistency, __peers.selection_consistency, __peers.best_factor_source, __peers.worst_factor_source, __peers.best_selection_sector FROM __peers ORDER BY __peers.alpha_persistence DESC"
    question: Rank all portfolios by alpha persistence and show their best and worst factor sources.
    use_as_onboarding_question: false
  - name: ROLLING_DRIFT_ALL
    sql: "SELECT __rolling.rolling_factor_name, __rolling.rolling_exposure, __rolling.exposure_drift FROM __rolling WHERE __rolling.rolling_date = (SELECT MAX(rolling_date) FROM __rolling) ORDER BY ABS(__rolling.exposure_drift) DESC"
    question: Show the current exposure drift for all factors across all portfolios.
    use_as_onboarding_question: false
  - name: currency_IMPACT
    sql: "SELECT __currency_attribution.local_currency, COUNT(*) AS POSITION_COUNT, AVG(__currency_attribution.local_return) AS AVG_LOCAL_RETURN, AVG(__currency_attribution.fx_return) AS AVG_FX_RETURN, AVG(__currency_attribution.avu_return) AS AVG_AVU_RETURN FROM __currency_attribution JOIN __portfolios ON __currency_attribution.cur_portfolioid = __portfolios.portfolio_id WHERE __portfolios.portfolio_name = 'SAM Global Flagship Multi-Asset' AND __currency_attribution.currency_date > DATEADD('month', -3, (SELECT MAX(currency_date) FROM __currency_attribution)) GROUP BY __currency_attribution.local_currency ORDER BY POSITION_COUNT DESC"
    question: How much of our return came from currency effects? Show the FX impact by currency.
    use_as_onboarding_question: false
