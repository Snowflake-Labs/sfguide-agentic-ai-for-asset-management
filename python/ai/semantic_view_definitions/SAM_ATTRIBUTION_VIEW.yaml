      - name: style_alert_count
        description: Count of style inconsistency alerts
        expr: SUM(CASE WHEN STYLE_INCONSISTENCY THEN 1 ELSE 0 END)
        access_modifier: public_access
      - name: allocation_drift_count
        description: Count of allocation drift alerts
        expr: SUM(CASE WHEN ALLOCATION_DRIFT_ALERT THEN 1 ELSE 0 END)
        access_modifier: public_access
      - name: selection_reversal_count
        description: Count of selection reversal alerts
        expr: SUM(CASE WHEN SELECTION_REVERSAL_ALERT THEN 1 ELSE 0 END)
        access_modifier: public_access
      - name: weight_concentration_count
        description: Count of weight concentration alerts
        expr: SUM(CASE WHEN WEIGHT_CONCENTRATION_ALERT THEN 1 ELSE 0 END)
