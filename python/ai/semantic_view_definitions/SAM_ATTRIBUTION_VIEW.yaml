        expr: BASERETURN
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: average_local_return
        description: Average local currency return
        expr: AVG(local_return)
        access_modifier: public_access
      - name: average_fx_return
        description: Average FX return component
        expr: AVG(fx_return)
        access_modifier: public_access
      - name: total_fx_impact
        synonyms:
          - currency_impact
          - fx_effect
        description: Total FX impact across all positions
        expr: SUM(fx_return)
        access_modifier: public_access
    time_dimensions:
      - name: currency_date
        description: Date of currency attribution
        expr: DATE
        data_type: DATE
  - name: securities
    description: Security reference data for currency attribution drill-down
    base_table:
